// ===== السحب بالإصبع: يمين = عرفتها، يسار = ما عرفتها =====
let SW=null, tx=0, ty=0;
app.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
app.addEventListener('touchend',e=>{ if(!SW) return; const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dy)<60){ const f=dx>0?SW.yes:SW.no; SW=null; f&&f(); } },{passive:true});
const swipeHint='<p class="swipehint">تقدر تسحب البطاقة: يمين ← عرفتها · يسار → ما عرفتها</p>';

// ===== الرجوع خطوة =====
const U=[];
function snap(c,restore){ U.push({id:c.id,prev:st[c.id]?JSON.parse(JSON.stringify(st[c.id])):null,restore}); if(U.length>20) U.shift(); }
function undo(){ const u=U.pop(); if(!u) return; if(u.prev) st[u.id]=u.prev; else delete st[u.id]; st[u.id]&&(st[u.id].u=Date.now()); save(); u.restore(); }
const undoBtn=()=>U.length?'<button class="link" id="undo">↶ رجوع</button>':'';

// ===== أدوات البطاقة: نجمة وكتم =====
const cardTools=c=>`<span style="margin-inline-start:auto;display:flex;gap:6px"><button class="ibtn" data-star="${c.id}" title="نجمة">${X.star[c.id]?'★':'☆'}</button><button class="ibtn" data-mute="${c.id}" title="أعرفها أكيد">أعرفها أكيد</button></span>`;
function wireTools(after){
  $$('[data-star]').forEach(b=>b.onclick=()=>{const id=b.dataset.star; if(X.star[id]) delete X.star[id]; else X.star[id]=1; saveX(); b.textContent=X.star[id]?'★':'☆';});
  $$('[data-mute]').forEach(b=>b.onclick=()=>{X.mute[b.dataset.mute]=1; saveX(); after&&after();});
}

// ===== خلط الأبواب: الجديد يجيك من كل باب على قد حجمه =====
const mix=()=>S.get('mix',true);
function mixNew(N){
  if(!mix()||chap()) return N;
  if(!sub()){ // وزن المواد بدرجاتها: المادة الأقل إنجازاً نسبةً لوزنها تتقدم
    const M=marks(), size={}, got={}, by={};
    for(const c of deck){ size[c.s]=(size[c.s]||0)+1; if(st[c.id]||muted(c)) got[c.s]=(got[c.s]||0)+1; }
    for(const c of mixChap(N)) (by[c.s]=by[c.s]||[]).push(c);
    const out=[]; let left=N.length;
    while(left){ let best=null,bv=Infinity; for(const k in by){ if(!by[k].length) continue; const v=((got[k]||0)/size[k])/Math.sqrt((M[k]||5)/60); if(v<bv){bv=v;best=k;} }
      out.push(by[best].shift()); got[best]=(got[best]||0)+1; left--; }
    return out;
  }
  return mixChap(N);
}
function mixChap(N){
  const by={}, size={}, got={};
  for(const c of deck){ size[c.b]=(size[c.b]||0)+1; if(st[c.id]||muted(c)) got[c.b]=(got[c.b]||0)+1; }
  for(const c of N) (by[c.b]=by[c.b]||[]).push(c);
  const out=[]; let left=N.length;
  while(left){ let best=null,bv=Infinity; for(const b in by){ if(!by[b].length) continue; const v=(got[b]||0)/size[b]; if(v<bv){bv=v;best=b;} }
    out.push(by[best].shift()); got[best]=(got[best]||0)+1; left--; }
  return out;
}
// ===== الفهم قبل الحفظ =====
const cOf=b=>CONTENT.find(x=>x.b===b);
const trapsOf=c=>{const k=cOf(c.b); return k?k.traps.filter(t=>t.card===c.id):[];};
const pgTxt=p=>p>8?` <span class="pg">(دليل الطالب ص${p})</span>`:'';
function extras(c){
  return (c.y?`<div class="why"><b>ليش؟ </b>${esc(c.y)}</div>`:'')+trapsOf(c).map(t=>`<div class="trap"><b>انتبه: </b>${esc(t.right)} <span class="x">— لا تخلطها بـ: ${esc(t.wrong)}</span></div>`).join('');
}
// ===== الجلسة (Anki) =====
function queue(){
  const now=Date.now(), P=pool();
  const L=P.filter(c=>st[c.id]?.t==='l'&&st[c.id].due<=now).sort((a,b)=>st[a.id].due-st[b.id].due);
  const R=P.filter(c=>st[c.id]?.t==='r'&&st[c.id].due<=now).sort((a,b)=>st[a.id].due-st[b.id].due);
  const N=newLeft()>0?mixNew(P.filter(c=>!st[c.id])):[];
  return [...L,...R,...N];
}
function bar(){
  const k=counts(), m=Math.floor((Date.now()-sessionStart)/MIN);
  return `<div class="bar"><span class="cnt"><b style="color:var(--blue)">${Math.min(k.n,newLeft())}</b><b style="color:var(--bad)">${k.l}</b><b style="color:var(--accent)">${k.r}</b></span><span>${m} دقيقة</span>${undoBtn()}<button class="link" id="home">إنهاء</button></div>`;
}
function frame(c,tag,body,barHtml){
  SW=null;
  app.innerHTML=(barHtml||bar())+`<article class="card"><div class="tags"><span class="tag plain">${esc(tagOf(c))}</span>${tag}${cardTools(c)}</div>${body}</article>`;
  on('#home',home); on('#undo',undo);
  const am=AM; AM=null; wireTools(am||next);
}
let AM=null; // ماذا يحدث بعد «أعرفها أكيد» في الوضع الحالي
function next(){
  const q=queue();
  if(!q.length){
    const soon=pool().filter(c=>st[c.id]?.t==='l').sort((a,b)=>st[a.id].due-st[b.id].due)[0];
    if(soon) return show(soon);
    return home();
  }
  show(q[0]);
}
function show(c){
  const s=st[c.id];
  if(!s) return flip(c,'<span class="tag new">جديدة'+(lim()==='auto'?' · خطة اليوم '+(newToday()+1)+'/'+limTxt():' '+(sessNew+1)+'/'+lim())+'</span>',true);
  if(s.t==='r') return flip(c,'<span class="tag">مراجعة</span>');
  [explain,mcq,recall,write][s.step](c);
}
function learn(c,step,delay){ const o=st[c.id]||{}; st[c.id]={t:'l',step,due:Date.now()+(delay??2*MIN),lapses:(o.lapses||0),bad:o.bad||0,u:Date.now()}; save(); }
function graduate(c,iv){ const s=st[c.id]||{}; st[c.id]={t:'r',iv,ease:s.ease||2.5,due:Math.min(Date.now()+iv*DAY,EXAM-DAY/2),reps:(s.reps||0)+1,bad:s.bad||0,u:Date.now()}; save(); }
const sAct=(c,isNew)=>snap(c,()=>{ if(isNew){ sessNew=Math.max(0,sessNew-1); const L=X.log[dkey()]; if(L&&L.nw) {L.nw--; saveX();} } show(c); });

function flip(c,tag,isNew){
  frame(c,tag,`<p class="q">${esc(c.q)}</p><div id="ans" hidden><div class="a">${esc(c.a)}</div>${c.n?`<div class="x">${esc(c.n)}</div>`:''}${extras(c)}</div>
    <div class="acts" id="acts"><button class="main" id="show">اكشف الجواب</button></div>`);
  on('#show',()=>{
    $('#ans').hidden=false; if(isNew){ sessNew++; const L=X.log[dkey()]||(X.log[dkey()]={n:0,ok:0,bad:0,sec:0}); L.nw=(L.nw||0)+1; saveX(); }
    const s=st[c.id], iv=s?.iv||0, ease=s?.ease||2.5;
    const hard=s?Math.max(1,Math.round(iv*1.2)):1, good=s?Math.max(iv+1,Math.round(iv*ease)):1, easy=s?Math.max(good+1,Math.round(iv*ease*1.3)):3;
    $('#acts').className='acts four';
    $('#acts').innerHTML=`<button class="again" id="b0">ما عرفتها<small>أتعلّمها</small></button>
      <button class="hard" id="b1">صعبة<small>${fmt(hard*DAY)}</small></button>
      <button class="good" id="b2">عرفتها<small>${fmt(good*DAY)}</small></button>
      <button class="easy" id="b3">سهلة<small>${fmt(easy*DAY)}</small></button>`+swipeHint;
    const no=()=>{sAct(c,isNew);learn(c,0,0);miss(c);next();};
    const yes=()=>{sAct(c,isNew);graduate(c,good);tick(true);next();};
    on('#b0',no);
    on('#b1',()=>{sAct(c,isNew);graduate(c,hard);st[c.id].ease=Math.max(1.3,ease-.15);save();tick(true);next();});
    on('#b2',yes);
    on('#b3',()=>{sAct(c,isNew);graduate(c,easy);st[c.id].ease=ease+.15;save();tick(true);next();});
    SW={yes,no};
  });
}
const stepTag=i=>`<span class="tag s${i}">${i+1}/${skipW()?3:4} · ${STEPS[i]}</span>`;
function explain(c){
  frame(c,stepTag(0),`<p class="q">${esc(c.q)}</p><div class="a">${esc(c.a)}</div>
    ${c.ex?`<div class="ex"><b>الشرح: </b>${esc(c.ex)}</div>`:''}${extras(c)}${c.mn?`<div class="mn">للحفظ: ${esc(c.mn)}</div>`:''}${c.n?`<div class="x">${esc(c.n)}</div>`:''}
    <div class="acts"><button class="main" id="ok">فهمتها</button></div>`);
  on('#ok',()=>{sAct(c);learn(c,1);tick(null);next();});
}
function mcq(c){
  if(!c.w||c.w.length<3){learn(c,2,0);return next();}
  const right=c.ca||c.a, opts=shuffle([right,...c.w]);
  frame(c,stepTag(1),`<p class="q">${esc(c.q)}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="acts" id="acts"></div>`);
  $$('.opt').forEach(b=>b.onclick=()=>{
    const ok=opts[+b.dataset.i]===right;
    $$('.opt').forEach(x=>{x.disabled=true; if(opts[+x.dataset.i]===right) x.classList.add('right');});
    if(!ok) b.classList.add('wrong');
    $('#acts').innerHTML=`<button class="main" id="nx">${ok?'صح، التالي':'راجع الشرح مرة ثانية'}</button>`;
    on('#nx',()=>{ sAct(c); if(ok){learn(c,2);tick(true);} else {learn(c,0,MIN);miss(c);} next(); });
  });
}
function recall(c){
  frame(c,stepTag(2),`<p class="q">${esc(c.q)}</p><div id="ans" hidden><div class="a">${esc(c.a)}</div>${extras(c)}</div>
    <div class="acts" id="acts"><button class="main" id="show">جاوب في راسك ثم اكشف</button></div>`);
  on('#show',()=>{
    $('#ans').hidden=false;
    const a=$('#acts'); a.className='acts two';
    a.innerHTML=`<button class="again" id="no">ما عرفتها</button><button class="good" id="yes">عرفتها</button>`+swipeHint;
    const no=()=>{sAct(c);learn(c,1,MIN);miss(c);next();};
    const yes=()=>{sAct(c); if(skipW()) graduate(c,1); else learn(c,3); tick(true); next();};
    on('#no',no); on('#yes',yes); SW={yes,no};
  });
}

// ===== صح أو خطأ (يُستعمل في المراجعة والاختبارات) =====
const STOP=new Set(['التي','الذي','الذين','وهو','وهي','فيه','فيها','عليه','عليها','إلى','على','حتى','إذا','إلا','ولا','وإن','لغير','بلا','كان','يكون','منه','منها','بعد','قبل','عند','أو','ذلك','هذا','مع','كل','غير','بين','ولو','إن','أن','لم','لا','ما','من','في','عن','بها','به','له','لها','فإن','وإلا','أي','ثم','فلا','وفي','وهما','وما','ومن']);
const toks=a=>String(a).split(/([\s،.؛:()«»]+)/);
function blankItem(c){ // أكمل الفراغ: تُخفى كلمة من جواب البطاقة، والخيارات كلمات من أجوبة الباب نفسه
  if(c.s&&c.s!=='fiqh') return null;
  const T=toks(c.a); const cand=T.map((w,i)=>[w,i]).filter(([w])=>w.replace(/^[وبفل]/,'').length>=4&&!STOP.has(w)&&!/[\s،.؛:()«»]/.test(w));
  if(cand.length<2) return null;
  const num=cand.filter(([w])=>NUMRE.test(' '+w)), src=num.length&&Math.random()<.5?num:cand, [word,idx]=src[Math.floor(Math.random()*src.length)];
  const inAns=new Set(T); const pool2=[...new Set(deck.filter(x=>x.b===c.b&&x.id!==c.id).flatMap(x=>toks(x.a)).filter(w=>w.length>=Math.max(3,word.length-3)&&w.length<=word.length+4&&!STOP.has(w)&&!inAns.has(w)&&!/[\s،.؛:()«»]/.test(w)&&(!NUMRE.test(' '+word)||NUMRE.test(' '+w))))];
  if(pool2.length<3) return null;
  const opts=shuffle([word,...shuffle(pool2).slice(0,3)]);
  const html=T.map((w,i)=>i===idx?'<b style="border-bottom:2px solid var(--accent);padding:0 1.5em"> ؟ </b>':esc(w)).join('');
  return {opts,right:word,html};
}
function tfItem(c){ const truth=!c.w||c.w.length<1||Math.random()<.5; return {truth, shown: truth?(c.ca||c.a):c.w[Math.floor(Math.random()*c.w.length)]}; }

// ===== المراجعة الحرة: تحتاج «عرفتها» مرتين متتاليتين، وبعدها تنجز وتتأجل أيام =====
const seen=()=>{const e=EOD(); return pool().filter(c=>{const s=st[c.id]; return s&&(s.t==='l'||s.due<=e);});};
const NEED=2, MAXSEEN=4;
const weak=c=>{const s=st[c.id]; return s.t==='l'?-100+(s.step||0):(s.iv||0)-(s.bad||0)*2;};
let cq=[], cdone=0, cleft=0, cshown={}, ctot=0, ctitle='مراجعة حرة', cback=null;
function cram(list,title,back){
  const L=list||seen();
  cq=shuffle(L.slice()).sort((a,b)=>(st[a.id]?weak(a):-50)-(st[b.id]?weak(b):-50)).slice(0,20);
  ctot=cq.length; cdone=0; cleft=0; cshown={}; ctitle=title||'مراجعة حرة'; cback=back||null; sessionStart=Date.now(); U.length=0; cramNext();
}
function cramNext(){ if(!cq.length) return cramDone(); cramShow(); }
function cramBar(){ return `<div class="bar"><span class="cnt"><b style="color:var(--accent)">أنجزت ${cdone}/${ctot}</b></span><span>${esc(ctitle)}</span>${undoBtn()}<button class="link" id="home">إنهاء</button></div>`; }
function cramFrame(c,body){ const k=st[c.id]?.ok||0; AM=()=>{cq.shift();cramNext();};
  frame(c,`<span class="tag">${'●'.repeat(k)+'○'.repeat(NEED-k)} باقي ${NEED-k} وتنجز</span>`,body,cramBar()); }
function cramDone(){
  const rest=cback?0:seen().length;
  app.innerHTML=`<div class="home"><h1>${cdone?'أحسنت!':'خلصت المراجعة'}</h1><div class="stats" style="grid-template-columns:1fr 1fr"><div class="c-rev"><b>${cdone}</b><span>أنجزتها وتأجلت أيام</span></div><div class="c-learn"><b>${cleft}</b><span>باقية تتعلمها</span></div></div>
    ${rest?`<button class="big" id="again">كمّل (${rest} باقية)</button>`:(cback?'':'<p class="note" style="font-size:1.05rem;color:var(--accent);font-weight:700">ما عليك شي الحين ✓ كل اللي درسته متأجل</p>')}
    <button class="big alt" id="back">${cback?'رجوع':'الرئيسية'}</button>
    <p class="note">كل بطاقة تقول فيها «عرفتها» مرتين ورا بعض تنجز وما ترجع إلا بعد أيام. واللي تغلط فيها ترجع من الصفر.</p></div>`;
  on('#again',()=>cram()); on('#back',cback||home);
}
function cramRes(c,ok){
  const saved={cq:cq.slice(),cdone,cleft,cshown:Object.assign({},cshown)};
  snap(c,()=>{cq=saved.cq;cdone=saved.cdone;cleft=saved.cleft;cshown=saved.cshown;cramShow();});
  cq.shift(); cshown[c.id]=(cshown[c.id]||0)+1;
  if(ok){
    tick(true);
    if(!st[c.id]) learn(c,0,0);
    const k=(st[c.id].ok||0)+1;
    if(k>=NEED){ const s=st[c.id]; graduate(c, s.t==='r'?Math.max((s.iv||1)+1,Math.round((s.iv||1)*(s.ease||2.5))):2); cdone++; return cramNext(); }
    st[c.id].ok=k; st[c.id].u=Date.now(); save();
  } else { learn(c,0,0); st[c.id].ok=0; miss(c); }
  if(cshown[c.id]<MAXSEEN) cq.splice(Math.min(cq.length,3),0,c); else cleft++;
  cramNext();
}
function cramShow(){
  const c=cq[0], r=Math.random(), hasW=c.w&&c.w.length>=3, bl=r<.2?blankItem(c):null;
  if(bl){
    cramFrame(c,`<p class="q">${esc(c.q)}</p><p class="lbl">أكمل الفراغ:</p><div class="tfbox">${bl.html}</div><div class="opts">${bl.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="ans"></div><div class="acts" id="acts"></div>`);
    $$('.opt').forEach(b=>b.onclick=()=>{ const ok=bl.opts[+b.dataset.i]===bl.right;
      $$('.opt').forEach(x=>{x.disabled=true; if(bl.opts[+x.dataset.i]===bl.right) x.classList.add('right');}); if(!ok) b.classList.add('wrong');
      $('#ans').innerHTML=`<div class="a">${esc(c.a)}</div>`; $('#acts').innerHTML=`<button class="main" id="nx">التالي</button>`; on('#nx',()=>cramRes(c,ok)); });
  } else if(hasW&&r<.4){
    const right=c.ca||c.a, opts=shuffle([right,...c.w]);
    cramFrame(c,`<p class="q">${esc(c.q)}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="acts" id="acts"></div>`);
    $$('.opt').forEach(b=>b.onclick=()=>{
      const ok=opts[+b.dataset.i]===right;
      $$('.opt').forEach(x=>{x.disabled=true; if(opts[+x.dataset.i]===right) x.classList.add('right');});
      if(!ok) b.classList.add('wrong');
      $('#acts').innerHTML=`<button class="main" id="nx">${ok?'صح، التالي':'التالي'}</button>`;
      on('#nx',()=>cramRes(c,ok));
    });
  } else if(hasW&&r<.6){
    const t=tfItem(c);
    cramFrame(c,`<p class="q">${esc(c.q)}</p><p class="lbl">هل هذا الجواب صحيح؟</p><div class="tfbox">${esc(t.shown)}</div><div id="ans" hidden></div>
      <div class="acts two" id="acts"><button class="good" id="tt">صح</button><button class="again" id="ff">خطأ</button></div>`);
    const ans=pick=>{ const ok=pick===t.truth; $('#ans').hidden=false;
      $('#ans').innerHTML=`<p class="score" style="color:var(${ok?'--accent':'--bad'})">${ok?'إجابتك صحيحة':'إجابتك غلط'}</p><div class="a">${esc(c.a)}</div>`;
      const a=$('#acts'); a.className='acts'; a.innerHTML=`<button class="main" id="nx">التالي</button>`; on('#nx',()=>cramRes(c,ok)); };
    on('#tt',()=>ans(true)); on('#ff',()=>ans(false));
  } else {
    cramFrame(c,`<p class="q">${esc(c.q)}</p><div id="ans" hidden><div class="a">${esc(c.a)}</div>${extras(c)}</div>
      <div class="acts" id="acts"><button class="main" id="show">جاوب في راسك ثم اكشف</button></div>`);
    on('#show',()=>{
      $('#ans').hidden=false;
      const a=$('#acts'); a.className='acts two';
      a.innerHTML=`<button class="again" id="no">ما عرفتها</button><button class="good" id="yes">عرفتها</button>`+swipeHint;
      const no=()=>cramRes(c,false), yes=()=>cramRes(c,true);
      on('#no',no); on('#yes',yes); SW={yes,no};
    });
  }
}

let EX=null, exTimer=0;
function buildExam(n,from){
  const by={}; for(const c of from) (by[c.b]=by[c.b]||[]).push(c);
  const tot=from.length, out=[];
  for(const b in by){ const k=Math.max(1,Math.round(n*by[b].length/tot)); out.push(...shuffle(by[b].slice()).slice(0,k)); }
  if(out.length<n){ const have=new Set(out.map(c=>c.id)); out.push(...shuffle(from.filter(c=>!have.has(c.id))).slice(0,n-out.length)); }
  return shuffle(out).slice(0,n).map(c=>{ const hasW=c.w&&c.w.length>=3, r=Math.random();
    if(r<.25){ const bl=blankItem(c); if(bl) return {c,type:'blank',...bl}; }
    if(hasW&&r<.7){ const right=c.ca||c.a; return {c,type:'mcq',opts:shuffle([right,...c.w]),right}; }
    if(hasW) return {c,type:'tf',...tfItem(c)};
    return {c,type:'tf',truth:true,shown:c.ca||c.a}; });
}

function startExam(items,kind,mins,chapName){

  clearInterval(exTimer); exTimer=setInterval(()=>{ const t=$('#clock'); if(!EX){clearInterval(exTimer);return;} const ms=EX.end-Date.now(); if(ms<=0){clearInterval(exTimer);finishExam();return;} if(t) t.textContent=Math.floor(ms/MIN)+':'+String(Math.floor(ms%MIN/1000)).padStart(2,'0'); },1000);
  examShow();
}
function examShow(){
  SW=null; const it=EX.items[EX.i], c=it.c, ms=EX.end-Date.now();
  const top=`<div class="bar"><span class="cnt"><b style="color:var(--accent)">${EX.i+1}/${EX.items.length}</b></span><span id="clock">${Math.floor(ms/MIN)}:${String(Math.floor(ms%MIN/1000)).padStart(2,'0')}</span><button class="link" id="fin">سلّم الاختبار</button></div>`;
  const body=it.type==='mcq'||it.type==='blank'?`<p class="q">${esc(c.q)}</p>${it.type==='blank'?`<p class="lbl">أكمل الفراغ:</p><div class="tfbox">${it.html}</div>`:''}<div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
    :`<p class="q">${esc(c.q)}</p><p class="lbl">هل هذا الجواب صحيح؟</p><div class="tfbox">${esc(it.shown)}</div><div class="acts two"><button class="good" data-t="1">صح</button><button class="again" data-t="0">خطأ</button></div>`;
  app.innerHTML=top+`<article class="card"><div class="tags"><span class="tag plain">${esc(tagOf(c))}</span><span class="tag">${it.type==='mcq'?'اختيار':it.type==='blank'?'أكمل الفراغ':'صح أو خطأ'}</span>${EX.place?'<button class="ibtn" id="idk" style="margin-inline-start:auto">ما أدري</button>':''}</div>${body}</article>`;
  const answer=ok=>{ EX.ans[EX.i]=ok; EX.i++; EX.i<EX.items.length?examShow():finishExam(); };
  $$('.opt').forEach(b=>b.onclick=()=>answer(it.opts[+b.dataset.i]===it.right));
  on('#idk',()=>answer(false));
  $$('[data-t]').forEach(b=>b.onclick=()=>answer((b.dataset.t==='1')===it.truth));
  on('#fin',finishExam);
}
function finishPlace(E){
  let known=0; E.items.forEach((it,i)=>{ if(E.ans[i]===true){ graduate(it.c,3); known++; tick(true);} });
  const by={}; E.items.forEach((it,i)=>{ const b=it.c.b; by[b]=by[b]||[0,0]; by[b][1]++; if(E.ans[i]===true) by[b][0]++; });
  X.exams.push({d:dkey(),k:'تحديد مستوى',score:known,total:E.items.length}); saveX();
  page('🧭 نتيجة تحديد المستوى',`<div class="banner ok">عرفت <b>${known}</b> من ${E.items.length}، وتأجلت كلها. وفّرت على نفسك ${known} بطاقة.</div>
    <div style="overflow-x:auto"><table class="tbl"><tr><th>الباب</th><th>عرفت</th></tr>${Object.entries(by).map(([b,[k,n]])=>`<tr><td>${esc(b)}</td><td>${k}/${n}</td></tr>`).join('')}</table></div>
    <p class="note">الأبواب اللي جبت فيها قليل: ابدأ فيها.</p>`);
}
function finishExam(){
  if(!EX) return; clearInterval(exTimer);
  const E=EX; EX=null; if(E.place) return finishPlace(E);
  const total=E.items.length, score=E.ans.filter(Boolean).length, mins=Math.round((Date.now()-E.start)/MIN);
  const wrong=E.items.filter((it,i)=>E.ans[i]===false), skipped=E.items.filter((it,i)=>E.ans[i]===undefined).length;
  for(const it of wrong){ const c=it.c; if(!st[c.id]||st[c.id].t==='r') learn(c,0,0); miss(c); }
  for(let i=0;i<total;i++) if(E.ans[i]===true) tick(true);
  X.exams.push({d:dkey(),k:E.kind,score,total,done:total-skipped}); if(X.exams.length>30) X.exams.shift();
  const pct=Math.round(100*score/total), mastered=E.chapName&&pct>=90;
  if(mastered) X.mastered[E.chapName]=dkey();
  saveX();
  page(E.chapName?'نتيجة اختبار الباب':E.kind==='يومي'?'نتيجة اختبار اليوم':'نتيجة الاختبار التجريبي',`<div class="stats" style="grid-template-columns:1fr 1fr 1fr"><div class="c-rev"><b>${score}/${total}</b><span>درجتك</span></div><div class="c-new"><b>${pct}%</b><span>النسبة</span></div><div class="c-done"><b>${mins}</b><span>دقيقة</span></div></div>
    ${mastered?'<div class="banner ok">✓ أتقنت باب '+esc(E.chapName)+'</div>':E.chapName?'<div class="banner">تحتاج 90% عشان تتقن الباب. الغلط رجع لقائمة «تتعلمها».</div>':''}
    ${skipped?`<p class="note">ما جاوبت ${skipped} سؤال، وانحسبت بدون درجة.</p>`:''}
    ${wrong.length?`<p class="lbl">أخطاؤك (${wrong.length}) — رجعت لقائمة «تتعلمها»</p><button class="big alt small" id="rq">اختبرني في أخطائي الحين</button>`+rows(wrong.map(it=>it.c),true):'<div class="banner ok">ما غلطت ولا سؤال!</div>'}`);
  wireRows(); on('#rq',()=>cram(wrong.map(it=>it.c).slice(0,20),'أخطاء الاختبار'));
}

// ===== تقسيم القوائم (من نص جواب البطاقة نفسها) =====
const CW={'واجب واحد':1,'شيئان':2,'شرطان':2,'قسمان':2,'اثنان':2,'ثلاثة':3,'ثلاث':3,'أربعة':4,'أربع':4,'خمسة':5,'خمس':5,'ستة':6,'ست':6,'سبعة':7,'سبع':7,'ثمانية':8,'ثمان':8,'تسعة':9,'تسع':9,'عشرة':10,'عشر':10,'أربعة عشر':14};
function splitList(a){
  let t=a.split(/\.\s/)[0].replace(/\d+\)\s*/g,''), count=null;
  const m=t.match(/^([^:،(]{2,14}):\s*/); if(m&&CW[m[1].trim()]){count=m[1].trim(); t=t.slice(m[0].length);} else { const k=t.indexOf(':'); if(k>=0&&k<60) t=t.slice(k+1); }
  const out=[]; let d=0,cur='';
  for(const ch of t){ if(ch==='('||ch==='«')d++; if(ch===')'||ch==='»')d--; if(ch==='،'&&d===0){out.push(cur);cur='';} else cur+=ch; }
  out.push(cur);
  return {count, items: out.map(x=>x.trim().replace(/^و(?=\S)/,'').replace(/[.؛]$/,'').trim()).filter(x=>x.length>1)};
}
// المتشابهات: أقسام يخلط بينها الطلاب، العناصر من أجوبة البطاقات
const SIM=[
  {t:'الصلاة: شرط ولا ركن ولا واجب؟', g:[['شرط','s47'],['ركن','v2940'],['واجب','s51']]},
  {t:'الصلاة: مبطل ولا مكروه؟', g:[['يبطلها','s54'],['يكره فيها','s53']]},
  {t:'الوضوء: شرط ولا فرض ولا ناقض؟', g:[['شرط','s13'],['فرض','s12'],['ناقض','s20']]},
  {t:'التيمم: شرط ولا فرض ولا مبطل؟', g:[['شرط','s29'],['فرض','s31'],['مبطل','s32']]},
  {t:'الجمعة: شرط الصلاة ولا ركن الخطبة؟', g:[['شرط لصحة الجمعة','s84'],['ركن للخطبة','s85']]},
  {t:'الحج: ركن ولا واجب ولا محظور؟', g:[['ركن','s142'],['واجب','v9872'],['محظور في الإحرام','s137']]},
];
function simItems(grp){
  const cats=grp.g.map(([n,id])=>{const c=deck.find(x=>x.id===id); return c?{n,c,items:splitList(c.a).items}:null;}).filter(Boolean);
  const cnt={}; cats.forEach(k=>new Set(k.items).forEach(i=>cnt[i]=(cnt[i]||0)+1));
  return {cats, items:cats.flatMap(k=>[...new Set(k.items)].filter(i=>cnt[i]===1).map(i=>({i,cat:k.n,c:k.c})))};
}
function simPage(){
  const G=SIM.map(simItems).map((s,i)=>({...s,t:SIM[i].t})).filter(g=>g.cats.length>=2);
  page('🔀 المتشابهات',`<p class="note" style="text-align:right">أكثر شي يطيّح الدرجات الخلط بين الأشياء المتقاربة. هنا تشوفها جنب بعض، وبعدها تختبر نفسك: هذا شرط ولا ركن ولا واجب؟</p>
    <button class="big" id="all">اختبرني فيها كلها</button>
    ${G.map((g,gi)=>`<div class="set"><div class="topline"><b>${esc(g.t)}</b><button class="ibtn" data-g="${gi}">اختبرني</button></div>
      ${g.cats.map(k=>`<div><p class="lbl" style="color:var(--accent)">${esc(k.n)} (${k.items.length})</p><p class="x" style="margin:4px 0 0;color:var(--ink)">${k.items.map(esc).join(' · ')}</p></div>`).join('')}</div>`).join('')}`);
  const run=(gs,title)=>{ const Q=shuffle(gs.flatMap(g=>g.items.map(x=>({...x,cats:g.cats.map(k=>k.n),t:g.t})))).slice(0,15); simQuiz(Q,0,0,title); };
  on('#all',()=>run(G,'المتشابهات'));
  $$('[data-g]').forEach(b=>b.onclick=()=>run([G[+b.dataset.g]],G[+b.dataset.g].t));

function listQuiz(Q,i,ok){
  if(i>=Q.length){ page('🧩 النتيجة',`<div class="banner ${ok>=Q.length*.8?'ok':''}">جبت ${ok} من ${Q.length}</div><button class="big" id="again">مرة ثانية</button>`,listsIntro); on('#again',listsIntro); return; }
  const x=Q[i], c=x.c; SW=null; let opts, right, body;
  if(x.k==='count'){
    right=x.r.count; const nums=[...new Set(Object.keys(CW).filter(w=>CW[w]!==CW[right]&&CW[w]>=2&&CW[w]<=14).map(w=>CW[w]))];
    const alt=shuffle(nums).slice(0,3).map(n=>Object.keys(CW).find(w=>CW[w]===n&&!/^(شيئان|شرطان|قسمان|ثلاث|أربع|خمس|ست|سبع|ثمان|تسع|عشر)$/.test(w))||String(n));
    opts=shuffle([right,...alt]); body=`<p class="q">${esc(c.q)}</p><p class="lbl">كم عددها؟</p>`;
  } else {
    right=x.r.items[x.m]; const others=[...new Set(listCards().filter(o=>o.id!==c.id).flatMap(o=>splitList(o.a).items).filter(t=>!x.r.items.includes(t)))];

  }

    <article class="card"><div class="tags"><span class="tag plain">${esc(tagOf(c))}</span></div>${body}<div class="opts">${opts.map((o,j)=>`<button class="opt" data-i="${j}">${esc(o)}</button>`).join('')}</div><div id="ans"></div><div class="acts" id="acts"></div></article>`;
  on('#home',home);
  $$('.opt').forEach(b=>b.onclick=()=>{ const good=opts[+b.dataset.i]===right;

function trapQ(Q,i,ok){
  if(i>=Q.length){ page('⚠️ النتيجة',`<div class="banner ${ok>=Q.length*.8?'ok':''}">جبت ${ok} من ${Q.length}</div><button class="big" id="again">مرة ثانية</button>`); on('#again',()=>trapsQuiz()); return; }
  const {t,truth}=Q[i]; SW=null;
  app.innerHTML=`<div class="bar"><span class="cnt"><b style="color:var(--accent)">${i+1}/${Q.length}</b><span>صح ${ok}</span></span><span>الأخطاء الشائعة</span><button class="link" id="home">إنهاء</button></div>
    <article class="card"><div class="tags"><span class="tag plain">${esc(t.b)}</span><span class="tag">${esc(t.t)}</span></div><p class="lbl">صح ولا خطأ؟</p><div class="tfbox">${esc(truth?t.right:t.wrong)}</div>
    <div id="ans"></div><div class="acts two" id="acts"><button class="good" id="tt">صح</button><button class="again" id="ff">خطأ</button></div></article>`;

  on('#home',()=>{clearTimeout(CT);stopSpeech();clipsPage();});
  const go=d=>{clearTimeout(CT);stopSpeech();clipPlay(n,i+d,chain);};
  on('#nx',()=>go(1)); on('#pv',()=>go(-1)); on('#tl',()=>go(1)); on('#tr2',()=>go(-1));
  on('#spk',()=>{CSPK=!CSPK;S.set('cspk',CSPK); if(!CSPK) stopSpeech(); else speak(s.say); $('#spk').textContent=CSPK?'🔊':'🔈';});

  SW={yes:()=>go(-1),no:()=>go(1)};
  if(CSPK){ try{speechSynthesis.cancel();}catch(e){} speak(s.say); }
  if(s.k==='q'){ $$('.opt').forEach(b=>b.onclick=()=>{ const good=s.opts[+b.dataset.i]===s.q.a;
      $$('.opt').forEach(o=>{o.disabled=true; if(s.opts[+o.dataset.i]===s.q.a) o.classList.add('right');}); if(!good) b.classList.add('wrong');
      tick(good); $('#ans').innerHTML=`<p class="score" style="color:var(${good?'--accent':'--bad'})">${good?'صح ✓':'الجواب: '+esc(s.q.a)}</p>`; });

}

function matchGame(round,score){
  const R=shuffle(h40Rows().filter(r=>r.n!==18&&r.n!==27)); const pick=[]; const used=new Set();
  for(const r of R){ if(used.has(r.rawi)) continue; used.add(r.rawi); pick.push(r); if(pick.length===5) break; }
  const L=shuffle(pick.slice()), Rt=shuffle(pick.slice()); let sel=null, done=0, miss=0;
  app.innerHTML=`<div class="bar"><span class="cnt"><b style="color:var(--accent)">جولة ${round+1}</b><span>النقاط ${score}</span></span><span>التوصيل</span><button class="link" id="home">إنهاء</button></div>
    <article class="card"><p class="lbl">اضغط حديث، وبعدين راويه</p><div class="match"><div>${L.map(r=>`<button data-h="${r.n}">${esc(r.start)}</button>`).join('')}</div><div>${Rt.map(r=>`<button data-r="${r.n}"><b>${esc(r.rawi)}</b></button>`).join('')}</div></div><div id="ans"></div><div class="acts" id="acts"></div></article>`;
  on('#home',memPage);
  $$('[data-h]').forEach(b=>b.onclick=()=>{ if(b.classList.contains('ok')) return; $$('[data-h]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel=b; });
  $$('[data-r]').forEach(b=>b.onclick=()=>{ if(!sel||b.classList.contains('ok')) return;
    const a=+sel.dataset.h, r=hrow(a), good=r.rawi===hrow(+b.dataset.r).rawi;
    if(good){ sel.classList.remove('sel'); sel.classList.add('ok'); b.classList.add('ok'); done++; tick(true); sel=null;
      if(done===5){ const pts=Math.max(0,5-miss); $('#ans').innerHTML=`<p class="score" style="color:var(--accent)">ممتاز! ${miss?`غلطت ${miss} ${miss<3?(miss===1?"مرة":"مرتين"):"مرات"}`:'بدون ولا غلطة'}</p>`; $('#acts').innerHTML='<button class="main" id="nx">جولة ثانية</button>'; on('#nx',()=>matchGame(round+1,score+pts)); } }
    else { miss++; tick(false); b.classList.add('no'); setTimeout(()=>b.classList.remove('no'),600); } });
}

function speak(t){ return new Promise(res=>{ try{ const u=new SpeechSynthesisUtterance(t); u.lang='ar-SA'; const v=speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang)); if(v) u.voice=v; u.rate=.95; u.onend=res; u.onerror=res; speechSynthesis.speak(u); }catch(e){res();} }); }
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function listenRun(){
  stopSpeech(); const me={stop:false,paused:false,skip:false}; LS=me;
  try{ navigator.wakeLock?.request('screen').catch(()=>{}); }catch(e){}
  const list=shuffle(pool().slice()); let i=0;
  const render=(c,phase)=>{ app.innerHTML=`<div class="bar"><span class="cnt"><b style="color:var(--accent)">${i+1}/${list.length}</b></span><span>🎧 استماع</span><button class="link" id="home">إنهاء</button></div>
    <article class="card"><div class="tags"><span class="tag plain">${esc(tagOf(c))}</span></div><p class="q">${esc(c.q)}</p><div class="a" ${phase?'':'hidden'}>${esc(c.a)}</div>
    <div class="acts two"><button id="pz">${me.paused?'▶ كمّل':'⏸ إيقاف مؤقت'}</button><button id="sk">التالي ⟵</button></div></article>`;
    on('#home',()=>{stopSpeech();home();}); on('#pz',()=>{me.paused=!me.paused; if(me.paused) speechSynthesis.cancel(); render(c,phase);}); on('#sk',()=>{me.skip=true;speechSynthesis.cancel();}); };
  while(!me.stop&&i<list.length){
    const c=list[i]; me.skip=false;
    render(c,0); await speak(c.q); if(me.stop) return;
    for(let t=0;t<S.get('gap',5)*10&&!me.skip&&!me.stop;t++) await wait(100);
    while(me.paused&&!me.stop) await wait(200);
    if(!me.skip){ render(c,1); await speak('الجواب: '+c.a); await wait(1200); }
    while(me.paused&&!me.stop) await wait(200);
    if(me.stop) return; i++;
  }
  if(!me.stop) home();
}

// ================== الواجهة المبسّطة ==================
// شاشة رئيسية فيها زر واحد كبير، وبطاقة بسيطة: اختيار أو «اكشف» ثم عرفتها/ما عرفتها
function allDue(){ const now=Date.now(); return deck.filter(c=>!muted(c)&&st[c.id]&&st[c.id].due<=now); }
function todayList(extra){
  const due=allDue().sort((a,b)=>st[a.id].due-st[b.id].due);
  const n=(extra||0)+(plan().final?0:plan().left);
  const fresh=mixNew(deck.filter(c=>!muted(c)&&!st[c.id])).slice(0,n);
  // نخلط المستحق مع الجديد ونفرّق المواد، عشان كل 20 بطاقة يكون فيها من كل المواد
  const by={}; for(const c of [...due,...fresh]) (by[c.s]=by[c.s]||[]).push(c);
  const M=marks(), keys=Object.keys(by).sort((a,b)=>(M[b]||0)-(M[a]||0)), out=[], used={};
  while(out.length<due.length+fresh.length){ let best=null,bv=Infinity;
    for(const k of keys){ if(!by[k].length) continue; const v=(used[k]||0)/Math.pow(M[k]||4,.75); if(v<bv){bv=v;best=k;} }
    out.push(by[best].shift()); used[best]=(used[best]||0)+1; }
  return out;
}
function subjPage(){
  page('📚 ذاكر مادة معينة',`<div class="menu">${subjects().map(k=>{ const cs=deck.filter(c=>c.s===k&&!muted(c)), kn=cs.filter(c=>st[c.id]?.t==='r').length;
    return `<button data-k="${k}"><span>${{fiqh:'⚖️',hadith:'📜',aqeedah:'🕋',nahw:'✍️',tafsir:'📖',tajweed:'🎙️',mithaq:'🕌'}[k]||'📘'}</span><b>${SUBJ[k]}</b><small>${marks()[k]} درجة · حفظت ${kn} من ${cs.length}</small></button>`;}).join('')}</div>`);
  $$('.menu button').forEach(b=>b.onclick=()=>{ const k=b.dataset.k, now=Date.now();
    const cs=deck.filter(c=>c.s===k&&!muted(c)), due=cs.filter(c=>st[c.id]&&st[c.id].due<=now), fresh=mixChap(cs.filter(c=>!st[c.id]));
    run([...due,...fresh].slice(0,20),SUBJ[k]); });
}
function home(){
  U.length=0; stopSpeech(); SW=null; S.set('sub:'+tr,''); S.set('ch:'+tr,''); S.set('flt:'+tr,'all');
  const left=Math.max(0,Math.ceil((EXAM-Date.now())/DAY)), L=todayList(), known=deck.filter(c=>st[c.id]?.t==='r'||muted(c)).length;
  const pct=Math.round(100*known/Math.max(1,deck.length)), bad=deck.filter(c=>(st[c.id]?.bad||0)>0&&!muted(c)).length;
  document.title=(L.length?'('+L.length+') ':'')+'بطاقات الاختبار';
  app.innerHTML=`<div class="home simple">
    <div><h1>بطاقات الاختبار</h1><p class="sub" style="margin:4px 0 0;color:var(--muted)">${tr==='imam'?'إمام':'مؤذن'} · باقي ${left} ${left===1?'يوم':'أيام'} على الاختبار</p></div>
    <div class="today"><b>${L.length}</b><span>${L.length?'بطاقة عليك اليوم (20 كل مرة)':'خلصت اليوم ✓'}</span></div>
    <button class="big" id="go">${L.length?'ابدأ':'زيدني 10 بطاقات'}</button>
    <div><div class="meter" style="height:10px"><i style="width:${pct}%"></i></div><p class="note" style="margin-top:6px">حفظت ${known} من ${deck.length} (${pct}%)</p></div>
    <div class="menu">
      <button id="subj"><span>📚</span><b>ذاكر مادة معينة</b><small>${subjects().map(k=>SUBJ[k]).join('، ')}</small></button>
      <button id="muf"><span>📗</span><b>مراجعة مفيد الصاحب</b><small>لمن حفظه: السؤال وأنت تذكر الجواب</small></button>
      <button id="mock"><span>📝</span><b>اختبار تجريبي</b><small>مثل الاختبار الحقيقي</small></button>
      <button id="mist"><span>❌</span><b>أخطائي</b><small>${bad?bad+" سؤال":"ولا غلطة للحين"}</small></button>
      ${deck.some(c=>c.id==='h1r')?'<button id="h40"><span>📜</span><b>الأربعين النووية</b><small>الراوي ومن أخرجه</small></button>':''}
    </div>
    <p class="sync">${syncTxt()}</p>
    <button class="link" id="sw">تغيير (إمام / مؤذن)</button></div>`;
  on('#go',()=>run(L.length?L.slice(0,20):mixNew(deck.filter(c=>!muted(c)&&!st[c.id])).slice(0,10),'مذاكرة اليوم'));
  on('#mock',()=>{ const M=marks(), subs=subjects(), tot=subs.reduce((a,k)=>a+M[k],0);
    const items=subs.flatMap(k=>buildExam(Math.max(2,Math.round(50*M[k]/tot)),deck.filter(c=>c.s===k)));
    page('📝 اختبار تجريبي',`<p class="note" style="text-align:right;font-size:1rem">50 سؤال من كل المواد، وعندك ساعة. الجواب الصح يطلع لك في الأخير.</p><button class="big" id="st">ابدأ الاختبار</button>`);
    on('#st',()=>startExam(shuffle(items),'شامل',60)); });
  on('#mist',()=>{ const l=deck.filter(c=>(st[c.id]?.bad||0)>0&&!muted(c)).sort((a,b)=>st[b.id].bad-st[a.id].bad).slice(0,20);
    l.length?run(l,'أخطائي'):page('❌ أخطائي','<p class="note" style="font-size:1rem">ما عندك أخطاء للحين 👍</p>'); });
  on('#h40',h40Simple); on('#subj',subjPage); on('#muf',mufPage);
  on('#sw',()=>{tr=null;S.set('track',null);pick();});
}
// جلسة بسيطة: كل بطاقة تُسأل؛ الغلط يرجع بعد 3 بطاقات لين تعرفه
let RQ=[], RI=0, RTOT=0, ROK=0, RT='', RSEEN={};
function run(list,title){ RQ=list.slice(); RTOT=RQ.length; ROK=0; RT=title; RSEEN={}; sessionStart=Date.now(); runNext(); }
function runNext(){
  SW=null;
  if(!RQ.length){ const rest=todayList().length;
    page('🎉 أحسنت!',`<div class="today"><b>${ROK}</b><span>بطاقة خلصتها</span></div>${rest?`<button class="big" id="more">كمّل (باقي ${rest} اليوم)</button>`:'<p class="note" style="font-size:1.05rem;color:var(--accent);font-weight:700">خلصت كل بطاقات اليوم ✓</p>'}<button class="big alt" id="h">الرئيسية</button>`);
    on('#h',home); on('#more',()=>run(todayList().slice(0,20),'مذاكرة اليوم')); return; }
  const c=RQ[0], done=RTOT-RQ.length, pct=Math.round(100*done/Math.max(1,RTOT));
  const useMcq=c.w&&c.w.length>=3&&(RSEEN[c.id]||0)===0&&Math.random()<.6;
  const top=`<div class="bar"><button class="link" id="x">✕</button><div class="meter" style="flex:1"><i style="width:${pct}%"></i></div><span>${done}/${RTOT}</span></div>`;
  const tag=`<p class="lbl" style="margin:0">${esc(SUBJ[c.s]||'')}${c.b?' · '+esc(c.b):''}</p>`;
  if(useMcq){
    const right=c.ca||c.a, opts=shuffle([right,...c.w]);
    app.innerHTML=top+`<article class="card">${tag}<p class="q">${esc(c.q)}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="fb"></div><div class="acts" id="acts"></div></article>`;
    $$('.opt').forEach(b=>b.onclick=()=>{ const ok=opts[+b.dataset.i]===right;
      $$('.opt').forEach(x=>{x.disabled=true; if(opts[+x.dataset.i]===right) x.classList.add('right');}); if(!ok) b.classList.add('wrong');
      runResult(c,ok); });
  } else {
    app.innerHTML=top+`<article class="card">${tag}<p class="q">${esc(c.q)}</p><div id="ans" hidden><div class="a">${esc(c.a)}</div></div><div id="fb"></div>
      <div class="acts" id="acts"><button class="main" id="show">اكشف الجواب</button></div></article>`;
    on('#show',()=>{ $('#ans').hidden=false; const a=$('#acts'); a.className='acts two';
      a.innerHTML=`<button class="again" id="no">ما عرفتها</button><button class="good" id="yes">عرفتها</button>`;
      on('#no',()=>runResult(c,false,true)); on('#yes',()=>runResult(c,true,true)); SW={yes:()=>runResult(c,true,true),no:()=>runResult(c,false,true)}; });
  }
  on('#x',home);
}
function runResult(c,ok,flip){
  SW=null; RSEEN[c.id]=(RSEEN[c.id]||0)+1;
  const s=st[c.id];
  if(ok){ tick(true); if(RSEEN[c.id]===1){ const iv=s&&s.t==='r'?Math.max((s.iv||1)+1,Math.round((s.iv||1)*2.5)):(s?1:2); graduate(c,iv); } else graduate(c,1); ROK++; }
  else { learn(c,0,0); miss(c); }
  const more=(!ok?`<div class="ex"><b>الجواب: </b>${esc(c.a)}</div>`:'')+(!ok&&c.ex?`<div class="x">${esc(c.ex)}</div>`:'')+(!ok&&c.y?`<div class="why"><b>ليش؟ </b>${esc(c.y)}</div>`:'');
  if(flip&&ok){ RQ.shift(); return runNext(); }
  $('#fb').innerHTML=`<p class="score" style="color:var(${ok?'--accent':'--bad'});font-size:1.1rem">${ok?'صح ✓':'مو مشكلة، بترجع لك بعد شوي'}</p>${flip?'':more}${flip&&!ok&&(c.ex||c.y)?(c.ex?`<div class="x">${esc(c.ex)}</div>`:'')+(c.y?`<div class="why"><b>ليش؟ </b>${esc(c.y)}</div>`:''):''}`;
  const a=$('#acts'); a.className='acts'; a.innerHTML=`<button class="main" id="nx">التالي</button>`;
  on('#nx',()=>{ RQ.shift(); if(!ok) RQ.splice(Math.min(RQ.length,3),0,c); runNext(); });
}
// الأربعين: لعبتين + اختبار + الجدول

// قائمة بسيطة بلا أزرار (نتائج الاختبار)
function rows(list){ if(!list.length) return ''; return `<div class="list">${list.map(c=>`<div class="row"><div class="rq">${esc(c.q)}</div><div class="ra">${esc(c.a)}</div></div>`).join('')}</div>`; }

// ===== مراجعة مفيد الصاحب: باب باب بالترتيب =====
// المستوى: 0 جديد، 1 نسيت، 2 ذكرته مرة، 3 أتقنته (مرتين)، 9 «حافظه، لا تعيده»
const mdeck=()=>MUFID.filter(c=>tr==='imam'||!c.m);
const mlev=id=>(X.muf||{})[id]||0;
const mset=(id,v)=>{ X.muf=X.muf||{}; X.muf[id]=v; saveX(); };
const mgroups=()=>[...new Set(mdeck().map(c=>c.g))];
function mstat(g){ const cs=mdeck().filter(c=>c.g===g), act=cs.filter(c=>mlev(c.id)!==9);
  return {cs, act, done:act.filter(c=>mlev(c.id)>=3).length, skip:cs.length-act.length, ok:act.every(c=>mlev(c.id)>=3)}; }
function mufPage(){
  const gs=mgroups(), cur=gs.find(g=>!mstat(g).ok);
  const tot=mdeck().filter(c=>mlev(c.id)!==9).length, left=mdeck().filter(c=>{const l=mlev(c.id);return l!==9&&l<3;}).length;
  page('📗 مفيد الصاحب',`<p class="note" style="text-align:right;font-size:1rem">امشِ باب باب: أتقن الباب (كل سؤال تذكره كامل مرتين) وبعدين روح للي بعده. وأي سؤال حافظه زين اضغط «حافظه، لا تعيده» وما يرجع لك.</p>
    <div class="today"><b>${left}</b><span>سؤال باقي عليك تراجعه</span></div>
    <div class="menu">${gs.map((g,i)=>{ const m=mstat(g), isCur=g===cur;
      return `<button data-g="${esc(g)}" style="${isCur?'border:2px solid var(--accent);background:var(--soft)':''}"><span>${m.ok?'✅':isCur?'▶':(i+1)}</span><b>${esc(g)}${isCur?' <small style="color:var(--accent)">← ابدأ هنا</small>':''}</b><small>أتقنت ${m.done} من ${m.act.length}${m.skip?` · ${m.skip} حافظها`:''}</small></button>`;}).join('')}</div>`);
  $$('.menu button').forEach(b=>b.onclick=()=>mufGroup(b.dataset.g));
}
function mufGroup(g){
  const m=mstat(g), sk=m.cs.filter(c=>mlev(c.id)===9);
  const L=l=>m.act.filter(c=>mlev(c.id)===l);
  const order=[...L(1),...L(0),...L(2)], extra=shuffle(L(3));
  if(!order.length&&!sk.length&&!extra.length) return mufPage();
  page('📗 '+esc(g),`<div class="today"><b>${m.done}/${m.act.length}</b><span>${m.ok?'أتقنت الباب ✓':'أتقنت'}</span></div>
    ${order.length?`<button class="big" id="go">ابدأ (${Math.min(15,order.length)} سؤال)</button>`:(extra.length?`<button class="big" id="go">راجع الباب مرة ثانية</button>`:'')}
    ${sk.length?`<p class="lbl">حافظها ولا تراجعها (${sk.length}) — اضغط أي وحدة ترجعها للمراجعة</p><div class="list">${sk.map(c=>`<button class="row" data-back="${c.id}" style="text-align:right;color:var(--ink)"><div class="rq">${esc(c.q)}</div><small class="x">↩ رجّعها</small></button>`).join('')}</div>`:''}`,mufPage);
  on('#go',()=>mufRun((order.length?order:extra).slice(0,15),0,0,g));
  $$('[data-back]').forEach(b=>b.onclick=()=>{ mset(b.dataset.back,1); mufGroup(g); });
}
function mufRun(Q,i,ok,g){
  SW=null;
  if(i>=Q.length){ const m=mstat(g);
    page('📗 خلصت الجولة',`<div class="today"><b>${ok}/${Q.length}</b><span>ذكرتها كاملة</span></div>${m.ok?'<div class="banner ok">✅ أتقنت باب '+esc(g)+'، روح للباب اللي بعده</div>':''}<button class="big" id="again">${m.ok?'الباب التالي':'كمّل هذا الباب'}</button><button class="big alt" id="bk">رجوع</button>`,mufPage);
    on('#again',()=>{ if(m.ok){ const nx=mgroups().find(x=>!mstat(x).ok); nx?mufGroup(nx):mufPage(); } else mufGroup(g); }); on('#bk',mufPage); return; }
  const c=Q[i], pct=Math.round(100*i/Q.length), lv=mlev(c.id);
  app.innerHTML=`<div class="bar"><button class="link" id="x">✕</button><div class="meter" style="flex:1"><i style="width:${pct}%"></i></div><span>${i}/${Q.length}</span></div>
    <article class="card"><p class="lbl" style="margin:0">${esc(g)}${lv===2?' · باقي مرة وتتقنه':''}</p><p class="q">${esc(c.q)}</p>
    <p class="note" style="text-align:right;margin:0">اذكر ${c.need===c.pts.length?`الـ${c.pts.length} كلها`:`${c.need} منها`} من حفظك</p>
    <div id="ans" hidden><ol class="mpts">${c.pts.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>
    <div class="acts" id="acts"><button class="main" id="show">اكشف الجواب</button></div></article>`;
  on('#x',()=>mufGroup(g));
  on('#show',()=>{ $('#ans').hidden=false; const a=$('#acts'); a.className='acts';
    a.innerHTML=`<div class="acts two"><button class="again" id="no">نسيت شي</button><button class="good" id="yes">ذكرتها كاملة</button></div><button class="link" id="skip" style="justify-self:center">✓ حافظه زين، لا تعيده</button>`;
    const res=good=>{ tick(good);
      if(good) mset(c.id,Math.max(2,Math.min(3,lv+1))); else { mset(c.id,1); if(!c._r){ c._r=1; Q.splice(Math.min(Q.length,i+4),0,c); } }
      mufRun(Q,i+1,ok+(good?1:0),g); };
    on('#no',()=>res(false)); on('#yes',()=>res(true)); on('#skip',()=>{ mset(c.id,9); mufRun(Q,i+1,ok+1,g); });
    SW={yes:()=>res(true),no:()=>res(false)}; });
}
