 المبيع مالاً، وملكه، ومعرفة الثمن والمثمن، والقبض في المجلس","سبعة: الإيجاب، والقبول، والرضى، وكون المبيع مالاً، وملكه، والقدرة على تسليمه، وتعليقه على شرط"],"ca":"سبعة: الرضى، والرشد، وكون المبيع مالاً، وملكه أو الإذن فيه، والقدرة على تسليمه، ومعرفة الثمن والمثمن، والتنجيز","s":"fiqh","y":"كل شرط منها ينفي بيعاً: فالرضى ينفي بيع المكره، والرشد ينفي بيع المميز والسفيه بلا إذن وليهما"},{"id":"s152","b":"البيوع","q":"اذكر أمثلة لبيوع لا تصح وشروط بيع فاسدة؟","a":"الشرط الفاسد المبطل: كشرط بيع آخر، أو سلف، أو قرض، أو إجارة، أو شركة، أو صرف للثمن (بيعتان في بيعة). ومما لا يصح: البيع والشراء في المسجد، وممن تلزمه الجمعة بعد ندائها الذي عند المنبر","m":1,"ex":"الشرط الفاسد المبطل: أن يُشترط مع البيع عقد آخر، كبيع أو سلف أو قرض أو إجارة أو شركة أو صرف، فتصير «بيعتين في بيعة». ومما لا يصح: البيع في المسجد، والبيع بعد نداء الجمعة الذي عند المنبر ممن تلزمه.","w":["الشرط المبطل: كشرط تأجيل الثمن أو رهن أو ضمين. ولا يصح البيع في المسجد، ولا بعد نداء الجمعة ممن تلزمه","الشرط المبطل: كشرط بيع آخر أو قرض. ويصح البيع في المسجد مع الكراهة، وبعد نداء الجمعة","الشرط المبطل: كشرط صفة في المبيع. ولا يصح البيع في السوق وقت الصلاة، ولا بعد الأذان الأول للجمعة"],"ca":"الشرط المبطل: كشرط بيع آخر أو سلف أو قرض أو إجارة أو شركة. ولا يصح البيع في المسجد، ولا بعد نداء الجمعة ممن تلزمه","s":"fiqh","y":"لأن الكتاب عدّ اشتراط عقد آخر مع البيع شرطاً فاسداً مبطلاً، وهو بيعتان في بيعة"},{"id":"s153","b":"البيوع","q":"ما هي شروط بيع المكيل بالمكيل من جنسه لكي لا يقع في الربا؟","a":"شرطان: المماثلة في القدر، والقبض قبل التفرق","m":1,"ex":"إذا بيع ربوي بجنسه (تمر بتمر، ذهب بذهب) فلا بد من أمرين: التساوي في المقدار، والتقابض قبل التفرق. فإن اختلف الجنس (ذهب بفضة) كفى القبض وجاز التفاضل.","w":["شرطان: المماثلة في القدر، وجواز التأجيل","شرط واحد: القبض قبل التفرق، ويجوز التفاضل","شرطان: المماثلة في القيمة، والقبض قبل التفرق"],"s":"fiqh","y":"لأنه مكيل بجنسه أو موزون بجنسه، وهذا يصح بشرطين: المماثلة والقبض"},{"id":"v10563","b":"البيوع","q":"ما أقسام الشروط في البيع؟ مع مثال لكل قسم.","a":"قسمان: صحيح لازم، كشرط تأجيل الثمن أو بعضه، أو رهن أو ضمين معيّنين، أو شرط صفة في المبيع. وفاسد مبطل للبيع، كشرط بيع آخر، أو سلف، أو قرض، أو إجارة، أو شركة، أو صرف للثمن، وهو بيعتان في بيعة.","m":1,"ex":"الشرط الصحيح يلزم الوفاء به، فإن لم يوجد الوصف المشروط فللمشتري الفسخ. والشرط الفاسد المبطل يُفسد العقد كله، كأن يقول: لا أبيعك سيارتي إلا أن تقرضني ألف دينار.","ca":"صحيح لازم (كتأجيل الثمن أو صفة في المبيع)، وفاسد مبطل للبيع (كشرط بيع آخر أو قرض أو إجارة)","w":["قسمان: صحيح لازم كشرط القرض، وفاسد لا يؤثر كشرط تأجيل الثمن","ثلاثة: صحيح، ومكروه، وباطل؛ وكلها لا تؤثر في صحة البيع","قسمان: صحيح كشرط بيع آخر، وفاسد يبطل الشرط وحده ويصح البيع كشرط صفة في المبيع"],"s":"fiqh","y":"لأن الشروط في البيع قسمان فقط: صحيح لازم، وفاسد مبطل للبيع"},{"id":"v10647","b":"البيوع","q":"ما أقسام الخيار في البيع؟","a":"سبعة: خيار المجلس، وخيار الشرط، وخيار الغَبن، وخيار التدليس، وخيار العيب، وخيار الخُلف في الصفة، وخيار الخُلف في قدر الثمن.","m":1,"ex":"الخيار أن يكون للمتعاقد حق إمضاء البيع أو فسخه. فخيار المجلس يثبت للمتعاقدين من حين العقد إلى أن يتفرقا، وخيار الشرط أن يشترطا أو أحدهما الخيار إلى مدة معلومة.","mn":"مجلس، شرط، غبن، تدليس، عيب، خُلف في الصفة، خُلف في قدر الثمن","w":["ثلاثة: خيار المجلس، وخيار الشرط، وخيار العيب فقط","سبعة: خيار المجلس، والشرط، والرؤية، والتعيين، والعيب، والنقد، والقبول","خمسة: خيار المجلس، والشرط، والغبن، والعيب، والإقالة"],"s":"fiqh"},{"id":"v10719","b":"البيوع","q":"فيمَ يجري الربا؟ وما الذي لا يجري فيه؟","a":"يجري الربا في كل مكيل وموزون ولو لم يؤكل؛ فالمكيل كسائر الحبوب، ومن الثمار كالتمر والزبيب، والموزون كالذهب والفضة والنحاس والحديد. وما عدا ذلك فمعدود لا يجري فيه الربا ولو مطعوماً، كالبطيخ والخيار والبيض والرمان.","m":1,"ex":"العبرة بالكيل والوزن لا بكون الشيء طعاماً. فالحديد يجري فيه الربا لأنه موزون، والبيض لا يجري فيه لأنه معدود.","ca":"في كل مكيل وموزون ولو لم يؤكل، لا في المعدود ولو مطعوماً كالبطيخ والبيض","w":["في كل مطعوم فقط، كالبيض والبطيخ، لا في الحديد والنحاس","في الذهب والفضة فقط، دون الحبوب والثمار","في كل مكيل وموزون ومعدود، بشرط أن يكون مأكولاً"],"s":"fiqh","y":"لأن المعتبر الكيل والوزن ولو لم يؤكل، وما عدا ذلك معدود لا ربا فيه ولو مطعوماً"},{"id":"v10840","b":"البيوع","q":"ما حكم بيع الربوي بغير جنسه كذهب بفضة؟ وما حكم بيع المكيل بالموزون كبُرّ بذهب؟","a":"إذا بيع بغير جنسه كذهب بفضة، وبُرّ بشعير، صحّ بشرط القبض قبل التفرق، وجاز التفاضل. وإن بيع المكيل بالموزون كبُرّ بذهب جاز التفاضل والتفرق قبل القبض.","m":1,"ex":"المماثلة تُشترط في الجنس الواحد فقط، فإذا اختلف الجنس جازت الزيادة، كبيع كيلو ذهب بمئة كيلو فضة، لكن لا بد من التقابض في المجلس. وإذا كان أحدهما مكيلاً والآخر موزوناً سقط الشرطان.","ca":"بغير جنسه: يجوز التفاضل ويُشترط القبض قبل التفرق؛ المكيل بالموزون: يجوز التفاضل والتفرق قبل القبض","w":["بغير جنسه: تُشترط المماثلة والقبض؛ المكيل بالموزون: يُشترط القبض فقط","بغير جنسه: يجوز التفاضل والتفرق قبل القبض؛ المكيل بالموزون: تُشترط المماثلة","بغير جنسه: لا يصح البيع أصلاً؛ المكيل بالموزون: يجوز التفاضل ويُشترط القبض"],"s":"fiqh","y":"لأن المماثلة شرط في بيع الجنس بجنسه، فإذا اختلف الجنس بقي شرط القبض وحده"},{"id":"s154","b":"النكاح وما يتبعه","q":"متى يسن ويجب ويحرم النكاح؟","a":"يسن لذي شهوة لا يخاف الزنا، ويجب على من يخافه، ويباح لمن لا شهوة له، ويحرم بدار الحرب لغير ضرورة","m":1,"ex":"حكم النكاح يدور مع حال الشخص: من يخاف الزنا يجب عليه، وذو الشهوة الذي لا يخافه يسن له، ومن لا شهوة له يباح له، ويحرم في دار الحرب لغير ضرورة. احفظ التدرج: يخاف ← يجب، يشتهي ← يسن، لا يشتهي ← يباح.","w":["يجب لذي شهوة لا يخاف الزنا، ويسن لمن يخافه، ويباح لمن لا شهوة له، ويحرم بدار الحرب لغير ضرورة","يسن لذي شهوة لا يخاف الزنا، ويجب على من يخافه، ويكره لمن لا شهوة له، ويباح بدار الحرب","يسن لكل أحد، ويجب على من يخاف الزنا، ويحرم على من لا شهوة له"],"s":"fiqh","y":"الحكم يدور مع حال الرجل: خوف الزنا يوجبه، والشهوة بلا خوف تجعله سنة، وعدمها يجعله مباحاً"},{"id":"s155","b":"النكاح وما يتبعه","q":"ما حكم نظر الرجل للمرأة لخطبة، شهادة، أو مداواة؟","a":"المخطوبة: يجوز للوجه والرقبة واليد والقدم. الشهادة أو المعاملة: يجوز لوجهها، وكذا كفيها لحاجة. المداواة: يجوز إلى المواضع التي يحتاج إليها","m":1,"ex":"النظر يُقدّر بقدر الحاجة: للمخطوبة أوسع (الوجه، والرقبة، واليد، والقدم) لأنه يريد الزواج بها. وللشهادة أو المعاملة الوجه، والكفان عند الحاجة. وللمداواة ما تدعو إليه الحاجة فقط.","w":["المخطوبة: الوجه والكفان فقط. الشهادة والمعاملة: الوجه والرقبة واليد والقدم. المداواة: مواضع الحاجة","المخطوبة: الوجه والرقبة واليد والقدم. الشهادة والمعاملة: لا يجوز النظر. المداواة: الوجه فقط","المخطوبة: جميع ما يظهر غالباً والشعر. الشهادة والمعاملة: الوجه. المداواة: لا يجوز إلا للمحارم"],"ca":"المخطوبة: الوجه والرقبة واليد والقدم. الشهادة والمعاملة: الوجه والكفان لحاجة. المداواة: مواضع الحاجة","s":"fiqh","y":"لأن الكتاب قسم النظر ثمانية أقسام، وجعل لكل حاجة قدرها، فالمداواة إلى المواضع التي يحتاج إليها"},{"id":"s156","b":"النكاح وما يتبعه","q":"ما هما ركنا النكاح؟","a":"الإيجاب، والقبول، مرتبين","m":1,"ex":"للنكاح ركنان: الإيجاب، وهو لفظ الولي أو من يقوم مقامه (زوّجتك)، ثم القبول، وهو لفظ الزوج أو من يقوم مقامه (قبلت). ويجب أن يكونا مرتبين: الإيجاب أولاً ثم القبول.","w":["الولي، والشهادة","الإيجاب، والقبول، والمهر","الإيجاب، والقبول، ولو تقدم القبول"],"s":"fiqh"},{"id":"s157","b":"النكاح وما يتبعه","q":"اذكر شروط النكاح الخمسة؟","a":"تعيين الزوجين، ورضى الزوج المكلف والزوجة الحرة العاقلة الثيب التي تم لها تسع، والولي، والشهادة، وخلو الزوجين من الموانع","m":1,"ex":"خمسة شروط كأنها أسئلة: من هما؟ (تعيين الزوجين). هل رضيا؟ (الرضى). من يعقد؟ (الولي). من يشهد؟ (الشهادة). هل يحل أحدهما للآخر؟ (خلوّهما من الموانع).","w":["تعيين الزوجين، ورضاهما، والولي، والشهادة، والمهر","الإيجاب، والقبول، والولي، والشهادة، والكفاءة","تعيين الزوجين، والولي، والشهادة، والإعلان، وخلو الزوجين من الموانع"],"ca":"تعيين الزوجين، ورضاهما، والولي، والشهادة، وخلو الزوجين من الموانع","s":"fiqh"},{"id":"s158","b":"النكاح وما يتبعه","q":"متى يسقط المهر (الصداق) كاملاً قبل الدخول؟","a":"بفرقة اللعان، وبفسخه لعيبها، وبفرقة من قبلها (كفسخها لعيبه، وإسلامها تحت كافر، وردتها تحت مسلم، ورضاعها من ينفسخ به نكاحها)","m":1,"ex":"القاعدة: إذا وقعت الفرقة قبل الدخول بسبب من جهتها سقط المهر كله: كفسخه لعيب فيها، أو فسخها لعيبه، أو إسلامها تحت كافر، أو ردتها تحت مسلم، أو إرضاعها من ينفسخ به نكاحها. ويسقط كذلك بفرقة اللعان.","w":["بطلاقه لها، وبخلعه، وبموت أحدهما قبل الدخول","بفرقة اللعان، وبكل فرقة من قبله كطلاقه وردته وإسلامه","بالخلوة بها، وبتقبيلها، وبفسخها لعيبه"],"ca":"بفرقة اللعان، وبفسخه لعيبها، وبكل فرقة من قبلها كفسخها لعيبه وإسلامها أو ردتها وإرضاعها","s":"fiqh","y":"لأنها فرقة من قبلها قبل الدخول، كردتها تحت مسلم ورضاعها من ينفسخ به نكاحها، وهذه تسقط المهر كله"},{"id":"s159","b":"النكاح وما يتبعه","q":"متى يجب المهر كاملاً؟","a":"موت أحدهما، ووطؤه ولمسه لها، ونظره إلى فرجها لشهوة، وتقبيلها ولو بحضرة الناس، وطلاقها في مرض موت ترث فيه، وخلوته بها عن مميز إن كان يطأ مثله ويوطأ مثلها","m":1,"mn":"موت، وطء ولمس، نظر، تقبيل، طلاق مرض، خلوة","ex":"يتقرر المهر كاملاً بأمور ترجع إلى ثلاثة: انتهاء النكاح بالموت. والاستمتاع ولو بلا وطء: الوطء، واللمس، والنظر إلى فرجها لشهوة، والتقبيل. والخلوة بها بعيداً عن مميز، أو طلاقها في مرض موت ترث فيه.","w":["موت أحدهما، والوطء، والعقد وحده، والطلاق قبل الدخول، وفرقة اللعان","الوطء فقط، دون الخلوة أو التقبيل أو الموت قبل الدخول","موت أحدهما، والوطء، والخلوة، وفسخها لعيبه، وإسلامها تحت كافر"],"ca":"موت أحدهما، والوطء، واللمس والنظر إلى فرجها لشهوة، والتقبيل، وطلاقها في مرض موت ترث فيه، والخلوة بها","s":"fiqh"},{"id":"s160","b":"النكاح وما يتبعه","q":"ما حكم وليمة العرس والإجابة إليها؟","a":"الوليمة سنة مؤكدة. الإجابة: في المرة الأولى واجبة (إن كان لا عذر ولا منكر)، وفي الثانية سنة، وفي الثالثة مكروهة","m":1,"ex":"الوليمة نفسها سنة مؤكدة. أما إجابة الدعوة فيتدرج حكمها مع التكرار: المرة الأولى واجبة (إن لم يكن عذر ولا منكر)، والثانية سنة، والثالثة مكروهة. احفظ: واجب ← سنة ← مكروه.","w":["الوليمة واجبة. الإجابة: في المرة الأولى سنة، وفي الثانية مباحة، وفي الثالثة مكروهة","الوليمة سنة مؤكدة. الإجابة: في المرة الأولى سنة، وفي الثانية مباحة، وفي الثالثة محرمة","الوليمة سنة مؤكدة. الإجابة: واجبة في المرات الثلاث إن لم يكن عذر ولا منكر"],"s":"fiqh"},{"id":"s161","b":"النكاح وما يتبعه","q":"إن دُعي لاثنتين في نفس الوقت، لمن يجيب؟","a":"يجيب الكل إن أمكنه، وإلا أجاب: الأسبق قولاً، فالأدين، فالأقرب رحماً فجواراً، ثم يقرع","m":1,"ex":"إن أمكنه حضور الجميع حضر. وإلا قدّم بالترتيب: الأسبق دعوةً، ثم الأكثر ديناً، ثم الأقرب رحماً، ثم الأقرب جواراً، ثم القرعة. احفظ: سَبْق ← دين ← رحم ← جوار ← قرعة.","w":["يجيب الأقرب جواراً، فالأسبق قولاً، فالأدين، ثم يقرع","يجيب الأدين، فالأقرب رحماً، فالأسبق قولاً، ثم يقرع","يجيب الأغنى، فالأسبق قولاً، فالأقرب رحماً، ثم يقرع"],"s":"fiqh"},{"id":"s162","b":"النكاح وما يتبعه","q":"ما حكم استرضاع المرأة الفاجرة أو الكافرة؟","a":"يكره (وكذا سيئة الخلق والجذماء والبرصاء)","m":1,"ex":"يُكره أن يُسترضع للطفل من فيها صفة سيئة أو مرض منفّر، وهي خمس: الفاجرة، والكافرة، وسيئة الخلق، والجذماء، والبرصاء. والحكم كراهة لا تحريم.","w":["يحرم (وكذا سيئة الخلق والجذماء والبرصاء)","يباح (ويكره استرضاع الجذماء والبرصاء فقط)","يكره للفاجرة فقط، ويباح للكافرة"],"s":"fiqh"},{"id":"s163","b":"النكاح وما يتبعه","q":"ما حكم من أوقع الخلع بلفظ \"الطلاق\" دون لفظ الخلع؟","a":"لا يكون خلعاً؛ لأن من شروطه: أن لا يقع بلفظ الطلاق بل بصيغته الموضوعة له، وأن لا ينوي به الطلاق (فيقع طلاقاً)","m":1,"ex":"للخلع صيغة خاصة به مثل: خلعتُ، وفاديتُ. فإن استعمل لفظ الطلاق، أو نوى بالخلع الطلاق، وقع طلاقاً لا خلعاً. احفظ: لفظ الطلاق أو نيته ← طلاق، لفظ الخلع بلا نية طلاق ← خلع.","w":["يكون خلعاً؛ لأن العبرة بالعوض لا باللفظ، فيقع خلعاً ولو بلفظ الطلاق","لا يقع شيء؛ لأن الخلع لا يصح إلا بلفظه فيبطل العقد","يكون خلعاً إن نوى به الخلع، ولا يقع طلاقاً إلا إذا نوى الطلاق"],"s":"fiqh","y":"لأن من شروط الخلع ألا يقع بلفظ الطلاق وألا ينوي به الطلاق؛ فإذا فقد شرط لم يكن خلعاً"},{"id":"s164","b":"النكاح وما يتبعه","q":"ماذا يجب على الزوج من النفقة؟ ولمن تجب غير الزوجة المستقرة؟","a":"ما لا غنى لزوجته عنه من مأكل ومشرب وملبس ومسكن بالمعروف. وتجب للرجعية مطلقاً، وللبائن والناشز الحامل، والمتوفى عنها زوجها حاملاً","m":1,"ex":"على الزوج كفاية زوجته بالمعروف: طعام، وشراب، ولباس، وسكن. وتستمر النفقة للرجعية مطلقاً لأنها ما زالت في حكم الزوجة. أما البائن والناشز والمتوفى عنها زوجها فلا نفقة لهن إلا إذا كنّ حوامل.","w":["ما لا غنى لها عنه من مأكل ومشرب وملبس ومسكن بالمعروف. وتجب للبائن والناشز مطلقاً، وللرجعية الحامل فقط","المأكل والمشرب فقط دون المسكن. وتجب للرجعية مطلقاً، وللبائن الحامل، ولا تجب للمتوفى عنها ولو حاملاً","ما لا غنى لها عنه بالمعروف. وتجب للرجعية والبائن والناشز والمتوفى عنها مطلقاً ولو غير حوامل"],"ca":"ما لا غنى لها عنه من مأكل ومشرب وملبس ومسكن بالمعروف. وتجب للرجعية مطلقاً، وللبائن والناشز والمتوفى عنها إن كن حوامل","s":"fiqh","y":"لأن الرجعية كالزوجة مطلقاً، أما البائن والناشز والمتوفى عنها فلا شيء لغير الحامل منهن"},{"id":"s165","b":"النكاح وما يتبعه","q":"متى تجب النفقة على الأقارب؟","a":"بثلاثة شروط: أن يكونوا فقراء لا مال لهم ولا كسب، وأن يكون المنفق غنياً بماله أو كسبه فاضلاً عن قوته وقوت زوجته ورقيقه، وأن يكون وارثاً لهم بفرض أو تعصيب إلا الأصول والفروع فتجب مطلقاً","m":1,"ex":"ثلاثة شروط تربط الطرفين: المنفَق عليه محتاج (لا مال له ولا كسب). والمنفِق قادر (غني بماله أو كسبه، فاضلاً عن قوته وقوت زوجته ورقيقه). وصلة الإرث (يرثه بفرض أو تعصيب)، إلا الأصول والفروع فتجب لهم مطلقاً.","w":["ثلاثة: فقرهم ولو كان لهم كسب، وغنى المنفق، وكونه وارثاً لهم بفرض فقط، ولا يستثنى أحد","شرطان: فقرهم بلا مال ولا كسب، وغنى المنفق؛ وتجب لكل قريب ولو لم يكن وارثاً","ثلاثة: فقرهم بلا مال ولا كسب، وغنى المنفق، واتحاد الدين؛ ولا تجب للأصول والفروع إلا بالإرث"],"ca":"ثلاثة: فقرهم بلا مال ولا كسب، وغنى المنفق فاضلاً عن قوته وقوت عياله، وكونه وارثاً لهم، إلا الأصول والفروع فمطلقاً","s":"fiqh"},{"id":"s166","b":"النكاح وما يتبعه","q":"ما الأشياء التي يحرم فعلها مع البهيمة؟","a":"لعنها، وتحميلها مشقاً، وحلبها ما يضر ولدها، وضربها في وجهها، ووسمها فيه، وذبحها إن كانت لا تؤكل","m":1,"mn":"لعن، حمل، حلب، ضرب، وسم، ذبح","ex":"ستة يجمعها الرفق بالحيوان: بالقول (لعنها). وبالعمل (تحميلها ما يشق عليها، وحلبها بما يضر ولدها). وبالوجه (ضربها فيه، ووسمها فيه). وبالروح (ذبحها إن كانت لا تؤكل).","w":["لعنها، وتحميلها مشقاً، وحلبها ما يضر ولدها، وركوبها، ووسمها في غير الوجه، وذبحها للأكل","ضربها في وجهها، ووسمها فيه، وحلبها مطلقاً، وبيعها، وذبحها إن كانت تؤكل","لعنها، وتحميلها مشقاً، وحلبها ما يضر ولدها، وضربها في وجهها، وخصاؤها، وإطعامها ما لا تشتهي"],"s":"fiqh"},{"id":"v10977","b":"النكاح وما يتبعه","q":"ما الصفات التي يُسنّ أن تكون في المرأة التي يريد نكاحها؟","a":"يُسنّ نكاح: ذات الدين، الولود، البكر، الحسيبة، الأجنبية.","m":1,"ex":"هذه صفات مستحبة عند اختيار الزوجة. والحسيبة: ذات الأصل الطيب، والأجنبية: غير القريبة.","mn":"دين + ولود + بكر + حسيبة + أجنبية","w":["ذات المال، الجميلة، الثيب، القريبة، العاملة","ذات الدين، العقيم، الثيب، الحسيبة، القريبة","ذات النسب، البكر، الغنية، ذات القرابة، الكبيرة سناً"],"s":"fiqh"},{"id":"v11228","b":"النكاح وما يتبعه","q":"ما الشروط التي تُشترط في وليّ النكاح؟","a":"سبعة: الذكورية، والعقل، والبلوغ، والحرية، واتفاق الدين، والعدالة ولو ظاهرة، والرشد وهو معرفة الكفء ومصالح النكاح","m":1,"ex":"الولي هو الشرط الثالث من شروط النكاح، ولا يصح أن يكون وليّاً إلا من اجتمعت فيه هذه الصفات السبع. والرشد هنا معناه أن يعرف الكفء ويعرف مصالح النكاح، والعدالة تكفي فيها العدالة الظاهرة.","ca":"ذكورية، عقل، بلوغ، حرية، اتفاق دين، عدالة، رشد","mn":"«ذَعْبٌ حِدْعَر»: ذكورية، عقل، بلوغ، حرية، دين، عدالة، رشد","w":["خمسة: الإسلام، والبلوغ، والعقل، والحرية، والغنى","ستة: الذكورية، والبلوغ، والعقل، والعدالة، والاجتهاد، والغنى","ثلاثة: البلوغ، والعقل، والإسلام، ويصح من الأنثى"],"s":"fiqh"},{"id":"v11228b","b":"النكاح وما يتبعه","q":"مَن أحقّ الناس بتزويج المرأة الحرة؟ رتّبهم.","a":"أبوها وإن علا، فابنها وإن نزل، فالأخ الشقيق، فالأخ للأب، ثم الأقرب فالأقرب كالإرث، ثم السلطان أو نائبه","m":1,"ex":"الولاية مرتبة: يُقدَّم الأب ثم الجد وإن علا، ثم الابن وابنه وإن نزل، ثم الإخوة، ثم بقية العصبة على ترتيب الإرث. فإن لم يوجد أحد منهم زوّجها السلطان أو نائبه.","ca":"الأب وإن علا، فالابن وإن نزل، فالأخ الشقيق، فالأخ لأب، ثم الأقرب كالإرث، ثم السلطان","w":["ابنها، ثم أبوها، ثم الأخ الشقيق، ثم السلطان","أبوها، ثم الأخ الشقيق، ثم ابنها، ثم العم، ثم السلطان","أمها، ثم أبوها، ثم أخوها، ثم القاضي"],"s":"fiqh"},{"id":"v11305","b":"النكاح وما يتبعه","q":"اذكر المحرّمات في النكاح أبداً بالنسب. وما الذي يحرم بالرضاع؟","a":"تحرم أبداً: الأم، والجدة من كل جهة، والبنت ولو من زنا، وبنت الولد، والأخت من كل جهة، وبنتها وبنت ولدها، وبنت كل أخ وبنت ولده، والعمة، والخالة. ويحرم بالرضاع ما يحرم بالنسب","m":1,"ex":"هؤلاء محرمات على التأبيد بسبب النسب: الأصول، والفروع، وفروع الأبوين، والعمات والخالات. والرضاع يُحرِّم مثل ما يحرّمه النسب، فالأم من الرضاع والأخت من الرضاع كالأم والأخت من النسب.","ca":"الأم والجدة، والبنت وبنت الولد، والأخت وبنتها، وبنت الأخ، والعمة والخالة؛ ويحرم بالرضاع ما يحرم بالنسب","mn":"أصوله، وفروعه، وفروع أبويه، والعمة والخالة","w":["الأم، والبنت، والأخت فقط؛ ولا يحرم بالرضاع إلا الأم المرضعة","الأم، والجدة، والبنت، والأخت، والعمة، والخالة، وبنت العم، وبنت الخال","الأم، والبنت، والأخت الشقيقة فقط؛ ويحرم بالرضاع نصف ما يحرم بالنسب"],"s":"fiqh","y":"لأن الكتاب جعل الرضاع كالنسب: يحرم به ما يحرم بالنسب"},{"id":"v11333","b":"النكاح وما يتبعه","q":"كم المحرّمات أبداً بالمصاهرة؟ وأيّها يحرم بمجرد العقد؟","a":"أربع، ثلاث بمجرد العقد: زوجة أبيه وإن علا، وزوجة ابنه وإن سفل، وأم زوجته. والرابعة: بنت زوجته وبنت ابنها، لا تحرم إلا إن وطئ الزوجة","m":1,"ex":"المصاهرة قرابة سببها الزواج. فبمجرد عقده على امرأة تحرم عليه أمها أبداً، وتحرم عليه زوجة أبيه وزوجة ابنه. أما بنت الزوجة (الربيبة) فلا تحرم إلا إذا دخل بأمها ووطئها.","ca":"أربع؛ ثلاث بمجرد العقد: زوجة الأب، وزوجة الابن، وأم الزوجة؛ وبنت الزوجة بالوطء","w":["ثلاث، كلها لا تحرم إلا بالوطء: أم الزوجة، وبنتها، وأختها","أربع، كلها بمجرد العقد: زوجة الأب، وزوجة الابن، وأم الزوجة، وبنت الزوجة","اثنتان: أم الزوجة وبنتها، وتحرمان بمجرد العقد"],"s":"fiqh","y":"لأن الثلاث يحرمن بمجرد العقد، أما بنت الزوجة وبنت ابنها فلا تحرمان إلا إن وطئ الزوجة"},{"id":"v11356","b":"النكاح وما يتبعه","q":"ما حكم الجمع بين الأختين، وبين المرأة وعمتها أو خالتها؟ وكم يجوز للحر والعبد أن يجمع من الزوجات؟","a":"يحرم الجمع بين الأختين، وبين المرأة وعمتها أو خالتها. وليس للحر جمع أكثر من أربع، ولا للعبد أكثر من ثنتين، ولمن نصفه حر فأكثر جمع ثلاث","m":1,"ex":"هؤلاء لا يحرمن على التأبيد بل إلى أمد: فإذا فارق إحداهن وانقضت عدتها جاز له نكاح الأخرى. وعدد الزوجات محدود: أربع للحر، واثنتان للعبد، وثلاث لمن نصفه حر فأكثر.","ca":"يحرم؛ وللحر أربع، وللعبد اثنتان، ولمن نصفه حر ثلاث","w":["يجوز الجمع بينهن؛ وللحر أربع وللعبد أربع","يكره الجمع ولا يحرم؛ وللحر أربع وللعبد ثلاث","يحرم الجمع بين الأختين فقط؛ وللحر ثلاث وللعبد اثنتان"],"s":"fiqh"},{"id":"v11376","b":"النكاح وما يتبعه","q":"ما حكم تسمية الصداق في العقد؟ وما أقلّه؟ وما الحكم إن لم يُسمَّ أو سُمّي شيء فاسد كالخمر؟","a":"تُسنّ تسميته في العقد، ويصح بأقلّ متموَّل. فإن لم يُسمَّ أو سُمّي فاسداً صحّ العقد ووجب مهر المثل","m":1,"ex":"الصداق هو المهر. يُستحب أن يُذكر في العقد، ويصح بأي شيء له قيمة مالية ولو قليلاً. وإذا لم يُذكر أو ذُكر شيء لا يصح كالخمر والخنزير فالعقد صحيح، ولها مهر مثلها.","ca":"تُسنّ، ويصح بأقل متموّل؛ فإن لم يُسمَّ أو سُمّي فاسداً صح العقد ووجب مهر المثل","w":["تجب تسميته، فإن لم يُسمَّ بطل العقد","تُسنّ تسميته، وأقله ربع دينار، فإن سُمّي فاسداً بطل العقد","تُكره تسميته، وإن سُمّي فاسداً فلا مهر لها"],"s":"fiqh","y":"لأن الكتاب لم يجعل التسمية شرطاً لصحة العقد، بل جعلها سنة، وعند عدمها أو فسادها يجب مهر المثل"},{"id":"v11441","b":"النكاح وما يتبعه","q":"مَن الذي بيده عقدة النكاح؟","a":"الزوج","m":1,"ex":"إذا طلّق الزوج قبل الدخول فللمرأة نصف المهر، فإن كان أقبضها الصداق رجع عليها بنصفه. وأيّ الزوجين عفا لصاحبه عمّا وجب له من المهر وهو جائز التصرف بَرِئ منه صاحبه.","w":["وليّ المرأة","الزوجة","القاضي"],"s":"fiqh"},{"id":"v11524","b":"النكاح وما يتبعه","q":"متى يتنصّف الصداق؟","a":"يتنصّف قبل الدخول بالفرقة من قِبَل الزوج كطلاقه وخلعه وإسلامه وردّته، وبملك أحدهما الآخر، أو بالفرقة من قِبَل أجنبي كرضاع ونحوه","m":1,"ex":"إذا حصلت الفرقة قبل الدخول وكان سببها الزوج أو شخص أجنبي، فللزوجة نصف المهر. أما إن كانت الفرقة من قِبَلها فيسقط كله، وبالموت أو الدخول يستقر كاملاً.","ca":"قبل الدخول بالفرقة من قِبَل الزوج (طلاق، خلع، إسلام، ردة)، أو بملك أحدهما الآخر، أو من قِبَل أجنبي","w":["بالفرقة من قِبَل الزوجة كفسخها لعيبه وردّتها","بفرقة اللعان وبفسخه لعيبها","بموت أحدهما قبل الدخول"],"s":"fiqh","y":"لأن الفرقة جاءت من قبل الزوج أو من قبل أجنبي قبل الدخول، وهذه تنصف الصداق"},{"id":"v11606","b":"النكاح وما يتبعه","q":"متى تجب إجابة الدعوة إلى وليمة العرس؟ (صفة الداعي)","a":"إنما تجب إذا كان الداعي مسلماً، يحرم هجره، وكسبه طيب","m":1,"ex":"إجابة وليمة العرس في المرة الأولى واجبة، لكن بشرط أن يكون الداعي مسلماً لا يجوز هجره، ومكسبه حلال. فإن كان في ماله حرام كُرهت إجابته ومعاملته وقبول هديته.","w":["إذا كان الداعي قريباً أو جاراً","إذا كان الداعي غنياً ودعاه ثلاث مرات","تجب لكل داعٍ ولو كان كافراً أو كسبه حراماً"],"s":"fiqh"},{"id":"v11670","b":"النكاح وما يتبعه","q":"ما هي آداب الأكل المستحبة؟","a":"يستحب غسل اليدين قبل الطعام وبعده. ويُسنّ: التسمية جهراً على الطعام والشراب، وأن يجلس على رجله اليسرى وينصب اليمنى أو يتربّع، ويأكل بيمينه بثلاث أصابع مما يليه، ويُصغّر اللقمة، ويُطيل المضغ، ويمسح الصحفة، ويأكل ما تناثر، ويغضّ طرفه عن جليسه، ويؤثر المحتاج، ويأكل مع الزوجة والمملوك والولد ولو طفلاً، ويلعق أصابعه، ويخلّل أسنانه","m":1,"ex":"هذه سنن الأكل: نظافة اليد، وذكر الله جهراً، والجلوس بأدب، والأكل باليمين بثلاث أصابع مما يليه، وتصغير اللقمة وإطالة مضغها، وعدم ترك طعام في الإناء أو ما سقط منه، وعدم النظر إلى الجليس، وإيثار المحتاج، والتواضع في الأكل مع الأهل.","ca":"غسل اليدين، والتسمية جهراً، والأكل باليمين بثلاث أصابع مما يليه، وتصغير اللقمة، وإطالة المضغ، ومسح الصحفة","mn":"قبل الأكل: غسل وتسمية وجلسة؛ أثناءه: يمين، ثلاث، مما يليه، لقمة صغيرة، مضغ طويل؛ بعده: مسح الصحفة، لعق الأصابع، تخليل","w":["التسمية سراً، والأكل بخمس أصابع، وتكبير اللقمة، والأكل من وسط الصحفة","غسل اليدين بعد الطعام فقط، والأكل متكئاً، ونفخ الطعام الحار","الأكل بالشمال، والأكل من أعلى الصحفة، والنظر إلى الجليس"],"s":"fiqh"},{"id":"v11825","b":"النكاح وما يتبعه","q":"ما حكم ابتلاع ما أخرجه من بين أسنانه؟","a":"ما أخرجه بالخِلال يلقيه ويُكره أن يبتلعه، فإن قلعه بلسانه لم يُكره","m":1,"ex":"يُسنّ تخليل الأسنان بعد الأكل. فما خرج بعود الخلال ونحوه يُرمى ولا يُبلع، أما ما أخرجه بلسانه فلا بأس ببلعه.","w":["يحرم ابتلاعه مطلقاً سواء أخرجه بالخلال أو بلسانه","يُسنّ ابتلاعه مطلقاً","ما أخرجه بلسانه يُكره بلعه، وما أخرجه بالخلال لا يُكره"],"s":"fiqh"},{"id":"v11843","b":"النكاح وما يتبعه","q":"ما مكروهات الأكل؟","a":"يُكره: نفخ الطعام، وكونه حارّاً، وأكله بأقل أو أكثر من ثلاث أصابع، أو بشماله، ومن أعلى الصحفة أو وسطها، ونفض يده في القصعة، وتقديم رأسه إليها عند وضع اللقمة في فمه، وكلامه بما يُستقذر، وأكله متكئاً أو مضطجعاً، وأكله كثيراً بحيث يؤذيه أو قليلاً بحيث يضره","m":1,"ex":"هذه أمور تخالف أدب الأكل أو تؤذي الآكل أو من معه: كالنفخ في الطعام، والأكل بالشمال، والأخذ من أعلى الطعام، ونفض اليد في الإناء، والكلام المستقذر، والاتكاء، والإفراط في الأكل أو التقليل المضر.","ca":"النفخ، والحار، وغير ثلاث أصابع، والشمال، وأعلى الصحفة، ونفض اليد، والكلام المستقذر، والاتكاء، والإفراط","w":["الأكل بثلاث أصابع، والأكل مما يليه، ولعق الأصابع، ومسح الصحفة","التسمية جهراً، وتصغير اللقمة، وإطالة المضغ","الأكل مع الزوجة والولد، وإيثار المحتاج، وتخليل الأسنان"],"s":"fiqh"},{"id":"v11964","b":"النكاح وما يتبعه","q":"كيف يأكل ويشرب مع أبناء الدنيا، والفقراء، والعلماء، والإخوان؟","a":"مع أبناء الدنيا بالأدب والمروءة، ومع الفقراء بالإيثار، ومع العلماء بالتعلّم، ومع الإخوان بالانبساط والحديث الطيب والحكايات التي تليق بالحال","m":1,"ex":"يختلف أدب المجلس باختلاف من يأكل معهم: فمع أهل الدنيا يلتزم الأدب والمروءة، ومع الفقراء يقدّمهم على نفسه، ومع العلماء يتعلم منهم، ومع الإخوان يتبسّط ويتحدث بما يليق.","mn":"دنيا: أدب؛ فقراء: إيثار؛ علماء: تعلّم؛ إخوان: انبساط","w":["مع أبناء الدنيا بالإيثار، ومع الفقراء بالانبساط، ومع العلماء بالصمت، ومع الإخوان بالأدب","مع الجميع بالصمت وغض البصر","مع أبناء الدنيا بالانبساط، ومع الفقراء بالتعلم، ومع العلماء بالإيثار، ومع الإخوان بالمروءة"],"s":"fiqh"},{"id":"v12061","b":"النكاح وما يتبعه","q":"ما الذي يُسنّ إذا فرغ من الطعام؟","a":"أن يحمد الله ويقول: الحمد لله الذي أطعمني هذا الطعام ورزقنيه من غير حولٍ مني ولا قوة، ويدعو لصاحب الطعام","m":1,"ex":"من سنن الفراغ من الأكل حمد الله بهذا الذكر، والدعاء لمن أطعمه.","w":["أن يقول: بسم الله أوله وآخره، ولا يدعو لأحد","أن يغسل يديه فقط، ولا يُشرع ذكر بعد الطعام","أن يقول: اللهم بارك لنا فيما رزقتنا وقنا عذاب النار، ويقوم فوراً"],"s":"fiqh"},{"id":"v12101","b":"النكاح وما يتبعه","q":"ما حكم إعلان النكاح والضرب فيه بالدفّ؟","a":"يُسنّ إعلان النكاح، والضرب فيه بدفّ لا حِلَق فيه ولا صنوج للنساء، ويُكره للرجال","m":1,"ex":"إشهار النكاح سنة. ويُسنّ للنساء ضرب الدف الخالي من الحلق والصنوج (القطع المعدنية المصوّتة)، أما الرجال فيُكره لهم ذلك.","w":["يُكره إعلانه، ويحرم الضرب بالدف مطلقاً","يجب إعلانه، ويُسنّ الدف للرجال والنساء بكل أنواعه","يباح إعلانه، ويُسنّ الدف للرجال دون النساء"],"s":"fiqh"},{"id":"v12173","b":"النكاح وما يتبعه","q":"ما شروط الخلع؟","a":"سبعة: أن يقع من زوج يصح طلاقه، وأن يكون على عِوَض ولو مجهولاً ممن يصح تبرعه، وأن يقع منجَّزاً، وأن يقع على جميع الزوجة، وألّا يقع حيلة لإسقاط يمين الطلاق، وألّا يقع بلفظ الطلاق بل بصيغته الموضوعة له، وألّا ينوي به الطلاق","m":1,"ex":"الخلع فراق الزوجة بعوض تدفعه هي أو غيرها. فلا يصح من مجنون أو صبي لا يصح طلاقه، ولا يصح معلّقاً على زمن أو فعل، ولا بلفظ الطلاق أو بنيّته، ولو عضلها ظلماً لتختلع لم يصح.","ca":"من زوج يصح طلاقه، على عوض، منجَّزاً، على جميع الزوجة، لا حيلة، لا بلفظ الطلاق، لا بنيته","mn":"زوج، عوض، منجّز، جميع، لا حيلة، لا لفظ طلاق، لا نية طلاق","w":["ثلاثة: رضا الزوجة، وحضور القاضي، ورد المهر كاملاً","خمسة: أن يقع بلفظ الطلاق، ومعلّقاً، وبلا عوض، وبنية الطلاق، ومن الولي","أربعة: أن يقع من الزوجة، وبحضرة شاهدين، وبلفظ الطلاق، وفي طهر لم يجامعها فيه"],"s":"fiqh"},{"id":"v12243","b":"النكاح وما يتبعه","q":"إذا توفّرت شروط الخلع فما حكمه؟ وهل ينقص به عدد الطلاق؟","a":"كان فسخاً بائناً، لا ينقص به عدد الطلاق","m":1,"ex":"الخلع إذا استوفى شروطه فسخ لا طلاق، فتبين به الزوجة ولا رجعة له عليها إلا بعقد جديد، ولا يُحسب من الطلقات الثلاث.","w":["كان طلاقاً رجعياً، وينقص به عدد الطلاق","كان طلقة بائنة، وتُحسب من الثلاث","كان فسخاً رجعياً، وينقص به عدد الطلاق"],"s":"fiqh"},{"id":"v12247","b":"النكاح وما يتبعه","q":"ما صيغ الخلع الصريحة والكناية؟","a":"الصريحة لا تحتاج إلى نية، وهي: خلعتُ، وفسختُ، وفاديتُ. والكناية: باريتُكِ، وأبرأتُكِ، وأبنتُكِ، ولا بد فيها من النية","m":1,"ex":"ألفاظ الخلع قسمان: صريح يقع به دون نية، وكناية تحتمل الخلع وغيره فلا يقع بها إلا مع النية أو ما يقوم مقامها.","ca":"الصريحة: خلعت، فسخت، فاديت؛ الكناية: باريتك، أبرأتك، أبنتك","w":["الصريحة: طلقتُ وسرّحتُ وفارقتُ؛ والكناية: خلعتُ وفسختُ","الصريحة: أبرأتُك وأبنتُك؛ والكناية: خلعتُ وفاديتُ","الصريحة: فسختُ فقط؛ والكناية: طلقتُ وخلعتُ"],"s":"fiqh","y":"لأن الصريح لا يحتاج إلى نية، والكناية لا بد فيها من النية"},{"id":"v12307","b":"النكاح وما يتبعه","q":"ما شرط ثبوت تحريم الرضاع في النكاح وثبوت المحرمية؟","a":"أن يرتضع خمس رضعات في العامين؛ فيكون تحريم الرضاع في النكاح وثبوت المحرمية كالنسب","m":1,"ex":"الرضاع يحرّم ويثبت به المحرمية مثل النسب، بشرطين: أن تكون الرضعات خمساً، وأن تكون في الحولين. فلو ارتضع بقية الخمس بعد العامين بلحظة لم تثبت الحرمة.","ca":"خمس رضعات في العامين","w":["رضعة واحدة في أي عمر","ثلاث رضعات في العامين","عشر رضعات في السنة الأولى"],"s":"fiqh","y":"لأن الكتاب جعل تحريم الرضاع كالنسب بشرط خمس رضعات في العامين"},{"id":"s167","b":"الصيد والذبائح","q":"ما هي شروط حل الصيد؟","a":"أربعة: كون الصائد أهلاً للذكاة، والآلة (محدد يجرح أو جارحة معلمة)، وقصد الفعل، وقول بسم الله عند الإرسال أو الرمي (ولا تسقط هنا سهواً)","m":1,"ex":"أربعة: الصائد (أهل للذكاة)، والآلة (محدد يجرح أو جارحة معلّمة)، والقصد، والتسمية عند الإرسال أو الرمي. والفرق المهم: التسمية في الذبح تسقط سهواً، أما في الصيد فلا تسقط ولو نسياناً.","w":["أربعة: كون الصائد أهلاً للذكاة، والآلة، وقصد الفعل، وقول بسم الله عند الإرسال (وتسقط هنا سهواً)","ثلاثة: كون الصائد مسلماً، والآلة، وقول بسم الله عند الأكل","أربعة: كون الصائد بالغاً، والآلة ولو قتلت بالصدم، وقصد الفعل، وقول بسم الله عند الإرسال"],"s":"fiqh","y":"لأن الكتاب جعل التسمية شرطاً رابعاً عند الإرسال أو الرمي، ونص أنها لا تسقط هنا سهواً"},{"id":"s168","b":"الصيد والذبائح","q":"كيف يكون تعليم الجارحة (الكلب أو الطير) لكي يحل صيده؟","a":"الكلب والفهد بثلاثة: يسترسل إذا أرسل، وينزجر إذا زجر، وإذا أمسك لم يأكل. والطير بأمرين: يسترسل إذا أرسل، ويرجع إذا دعي","m":1,"ex":"الكلب والفهد يُعلَّمان بثلاثة: ينطلق إذا أُرسل، ويكفّ إذا زُجر، ولا يأكل مما أمسك. والطير بأمرين فقط: ينطلق إذا أُرسل، ويرجع إذا دُعي؛ فلا يشترط فيه ترك الأكل ولا الانزجار.","w":["الكلب والفهد بأمرين: يسترسل إذا أرسل، ويرجع إذا دعي. والطير بثلاثة: يسترسل، وينزجر، ولا يأكل","الكلب والفهد بثلاثة: يسترسل إذا أرسل، وينزجر إذا زجر، ويرجع إذا دعي. والطير بأمرين: يسترسل، ولا يأكل","الكلب والفهد والطير بثلاثة: يسترسل إذا أرسل، وينزجر إذا زجر، وإذا أمسك لم يأكل"],"s":"fiqh"},{"id":"v12627","b":"الصيد والذبائح","q":"من أدرك صيداً مجروحاً فيه حياة (متحركاً فوق حركة المذبوح) واتّسع الوقت لتذكيته، فما حكمه؟","a":"لم يُبَح إلا بالتذكية","m":1,"ex":"إذا أصاب الصيد ولم يمت فوراً، وأدركه حياً وكان عنده وقت لذبحه، وجب ذبحه، ولا تكفي الإصابة. أما إذا مات في الحال فيحلّ بالشروط الأربعة للصيد.","w":["يحل بالإصابة الأولى ولا يحتاج إلى ذبح","يُترك حتى يموت ثم يؤكل","يحرم أكله مطلقاً ولو ذبحه"],"s":"fiqh"},{"id":"v12707","b":"الصيد والذبائح","q":"ما حكم الصيد إذا قتلته الآلة بصدمٍ أو خنقٍ دون أن تجرحه؟","a":"لم يُبَح؛ لأنه يشترط أن يجرح الصيد","m":1,"ex":"آلة الصيد نوعان: محدد يجرح كالسيف والسكين والسهم، وجارحة معلّمة ككلب وفهد وصقر. ويشترط في الحالين أن يجرح الصيد، فما مات بثقل الضربة أو بالخنق لا يحل.","w":["يحل مطلقاً إذا سمّى","يحل إن كانت الآلة جارحة معلّمة","يُكره أكله ولا يحرم"],"s":"fiqh","y":"لأنه يشترط أن تجرح الآلة الصيد، والصدم والخنق لا جرح فيهما"},{"id":"v12866","b":"الصيد والذبائح","q":"ما المراد بشرط «قصد الفعل» في الصيد؟","a":"أن يرسل الآلة لقصد الصيد؛ فلو أرسلها لا لقصد الصيد، أو لقصده ولم يره، أو استرسل الجارح بنفسه فقتل صيداً، لم يحل","m":1,"ex":"قصد الفعل هو الشرط الثالث لحل الصيد. والصيد يباح لمن قصده، ويُكره إذا كان لهواً. فلا بد أن يرمي أو يرسل الجارحة قاصداً صيداً معيّناً رآه.","ca":"أن يرسل الآلة لقصد الصيد","w":["أن ينوي الأكل بعد الذبح فقط، ولو استرسل الجارح بنفسه","أن يقصد الرمي ولو لم يقصد الصيد","أن يكون الصائد مسلماً عاقلاً"],"s":"fiqh","y":"لأن الكتاب عرّف قصد الفعل بأن يرسل الآلة لقصد الصيد"},{"id":"v12909","b":"الصيد والذبائح","q":"رجل رمى الصيد وسمّى، ثم توقّف عن الرمي، ثم عاد يرمي بعد مدة؛ فهل تكفيه التسمية الأولى؟","a":"لا تكفيه؛ بل يسمّي عند الرمي الجديد، لأن التسمية تكون عند إرسال الجارحة أو رمي السلاح، ولا تسقط في الصيد سهواً. أما الرمي المتوالي المتصل فتكفيه التسمية الأولى","m":1,"ex":"قول «بسم الله» هو الشرط الرابع لحل الصيد، ومحلّه عند الرمي أو الإرسال. وتختلف التسمية في الصيد عن الذبح، فلا تسقط هنا بالنسيان؛ فإن نسيها لم يحل الصيد.","ca":"يسمّي عند الرمي الجديد، ولا تسقط التسمية في الصيد سهواً","w":["تكفيه التسمية الأولى مهما طالت المدة","لا تشترط التسمية في الصيد أصلاً","تسقط التسمية في الصيد إذا نسيها"],"s":"fiqh","y":"لأن محل التسمية في الصيد عند إرسال الجارحة أو رمي السلاح، ولا تسقط سهواً"},{"id":"s169","b":"الأيمان والنذور","q":"بم تنعقد اليمين؟","a":"بالله تعالى، أو اسم من أسمائه، أو صفة من صفاته","m":1,"ex":"اليمين لا تنعقد إلا بالله: إما بلفظ الجلالة «والله»، أو باسم من أسمائه كالرحمن، أو بصفة من صفاته كعزة الله. ثلاثة: الذات، والاسم، والصفة. أما الحلف بمخلوق فحرام.","w":["بالله تعالى، أو بأحد أنبيائه، أو بكتبه","بالله تعالى فقط، دون أسمائه وصفاته","بكل معظم كالله تعالى، أو الكعبة، أو النبي"],"s":"fiqh","y":"لأن الكتاب حصر انعقاد اليمين بالله أو اسم من أسمائه أو صفة من صفاته"},{"id":"s170","b":"الأيمان والنذور","q":"ما حكم الحلف بغير الله (كالكعبة والنبي)؟","a":"حرم، ولا كفارة","m":1,"ex":"الحلف بمخلوق كالأنبياء والأولياء والكعبة حرام، ولا كفارة فيه؛ فالكفارة إنما تكون في اليمين المنعقدة بالله أو أسمائه أو صفاته.","w":["يكره، ولا كفارة","حرم، وفيه كفارة يمين","مباح، وفيه كفارة إن حنث"],"s":"fiqh","y":"لأن الحلف بمخلوق ليس بالله ولا أسمائه ولا صفاته، ونص الكتاب أنه حرم ولا كفارة"},{"id":"s171","b":"الأيمان والنذور","q":"ما هي شروط وجوب كفارة اليمين؟","a":"خمسة: كون الحالف مكلفاً، مختاراً، قاصداً لليمين، وكونها على أمر مستقبل، والحنث","m":1,"ex":"خمسة: ثلاثة في الحالف (مكلف، مختار، قاصد لليمين)، فلا كفارة على مكره ولا على من جرت على لسانه بلا قصد. وواحد في المحلوف عليه: أن يكون أمراً مستقبلاً. والخامس: الحنث، أي مخالفة ما حلف عليه.","w":["خمسة: كون الحالف مكلفاً، مختاراً، قاصداً لليمين، وكونها على أمر ماضٍ، والحنث","أربعة: كون الحالف مكلفاً، مختاراً، ولو غير قاصد لليمين، والحنث","خمسة: كون الحالف مكلفاً، ولو مكرهاً، قاصداً لليمين، وكونها على أمر مستقبل، والحنث"],"s":"fiqh"},{"id":"s172","b":"الأيمان والنذور","q":"ما هي كفارة اليمين؟","a":"على التخيير: إطعام عشرة مساكين، أو كسوتهم، أو تحرير رقبة مؤمنة؛ فإن لم يجد صام ثلاثة أيام متتابعة","m":1,"ex":"الكفارة على مرحلتين: أولاً يختار واحداً من ثلاثة: إطعام عشرة مساكين، أو كسوتهم، أو عتق رقبة مؤمنة. فإن عجز عنها كلها انتقل إلى صيام ثلاثة أيام متتابعة. قارن: كفارة الجماع في رمضان مرتبة لا تخيير فيها.","w":["على الترتيب: عتق رقبة، فإن لم يجد فإطعام عشرة مساكين، فإن لم يجد فكسوتهم، ولا صيام فيها","على التخيير: إطعام عشرة مساكين، أو كسوتهم، أو صيام ثلاثة أيام، أو تحرير رقبة","على التخيير: إطعام ستين مسكيناً، أو كسوتهم، أو تحرير رقبة؛ فإن لم يجد صام شهرين متتابعين"],"s":"fiqh","y":"لأن الكتاب جعل الثلاثة الأولى على التخيير، والصيام لمن لم يجد"},{"id":"s173","b":"الأيمان والنذور","q":"ما حكم النذر، وما شروطه ليصح؟","a":"مكروه، لا يأتي بخير ولا يرد قضاء. ولا يصح إلا بالقول، من مكلف مختار","m":1,"ex":"النذر مكروه؛ لأنه لا يجلب خيراً ولا يرد ما قُدّر. ولا ينعقد إلا باللفظ، من شخص مكلف مختار؛ فلا يصح بالنية وحدها، ولا من صبي أو مكره.","w":["مستحب، يتقرب به إلى الله. ولا يصح إلا بالقول، من مكلف مختار","مكروه، لا يأتي بخير ولا يرد قضاء. ويصح بالنية وحدها، ولو من صبي مميز","مباح، ويرد القضاء. ولا يصح إلا بالقول، من مسلم بالغ"],"s":"fiqh"},{"id":"s174","b":"الأيمان والنذور","q":"اذكر أمثلة لأنواع النذر المنعقدة؟","a":"ستة: المطلق (كفارة يمين)، ونذر اللجاج والغضب (يخير بين الفعل وكفارة يمين)، والمباح (يخير أيضاً)، والمكروه (يسن أن يكفر ولا يفعله)، والمعصية (يحرم الوفاء ويكفر)، والتبرر (يجب الوفاء به)","m":1,"mn":"مُ لَ بَ كَ عَ تَ: مطلق، لجاج، مباح، مكروه، معصية، تبرر","ex":"ستة، وحكم كل واحد: المطلق فيه كفارة يمين. واللجاج والغضب والمباح يُخيّر فيهما بين الفعل والكفارة. والمكروه يسن أن يكفّر ولا يفعله. والمعصية يحرم الوفاء بها ويكفّر. والتبرر (الطاعة) يجب الوفاء به.","w":["ستة: المطلق، واللجاج والغضب، والمباح، والواجب، والمعصية، والتبرر","خمسة: المطلق، والمباح، والمكروه، والمعصية، والتبرر","ستة: المطلق، واللجاج والغضب، والمستحيل، والمكروه، والمعصية، والتبرر"],"ca":"ستة: المطلق، واللجاج والغضب، والمباح، والمكروه، والمعصية، والتبرر","s":"fiqh"},{"id":"v13062","b":"الأيمان والنذور","q":"إلى ماذا يُرجع في تفسير الأيمان؟ (بالترتيب)","a":"إلى نية الحالف، فإن لم ينوِ شيئاً رُجع إلى سبب اليمين وما هيّجها، فإن عُدمت النية والسبب رُجع إلى التعيين، فإن عُدم ذلك رُجع إلى ما تناوله الاسم، وهو ثلاثة: شرعي، فعرفي، فلغوي","m":1,"ex":"إذا اختُلف في معنى اليمين قُدّمت نية الحالف، ثم الشيء الذي دعاه إلى الحلف، ثم ما عيّنه بالإشارة، ثم معنى الاسم: الشرعي أولاً، ثم العرفي، ثم اللغوي.","ca":"النية، ثم السبب، ثم التعيين، ثم الاسم (شرعي، فعرفي، فلغوي)","mn":"نِيّة، سبب، تعيين، اسم","w":["إلى اللفظ اللغوي، ثم العرفي، ثم نية الحالف","إلى سبب اليمين، ثم نية الحالف، ثم العرف","إلى عرف البلد فقط"],"s":"fiqh","y":"لأن الكتاب رتب المرجع: النية، ثم السبب، ثم التعيين، ثم الاسم"},{"id":"aq01","b":"تعريف الإيمان وزيادته","q":"الإيمان في اللغة مأخوذ من؟","a":"الأمن ضد الخوف","w":["التصديق ضد التكذيب","الإقرار ضد الجحود","الطمأنينة ضد القلق"],"ex":"وليس مرادفاً للتصديق لفروق في اللفظ والمعنى.","s":"aqeedah"},{"id":"aq02","b":"تعريف الإيمان وزيادته","q":"ما تعريف الإيمان شرعاً؟","a":"اعتقاد بالقلب، ونطق باللسان، وعمل بالأركان","w":["اعتقاد بالقلب ونطق باللسان فقط","تصديق بالقلب فقط","نطق باللسان وعمل بالأركان فقط"],"s":"aqeedah"},{"id":"aq03","b":"تعريف الإيمان وزيادته","q":"كم موضعاً صرّح القرآن فيه بزيادة الإيمان؟","a":"ستة مواضع","w":["أربعة مواضع","عشرة مواضع","ثمانية مواضع"],"s":"aqeedah"},{"id":"aq04","b":"تعريف الإيمان وزيادته","q":"سؤال «أمؤمن أنت؟» بدعة أحدثها من؟","a":"المرجئة","w":["الخوارج","الجهمية","المعتزلة"],"s":"aqeedah"},{"id":"aq05","b":"تعريف الإيمان وزيادته","q":"كم مأخذاً للسلف في الاستثناء في الإيمان؟","a":"خمسة","w":["ثلاثة","أربعة","سبعة"],"s":"aqeedah"},{"id":"aq06","b":"أنواع التوحيد","q":"ما أنواع التوحيد؟","a":"الربوبية، والألوهية، والأسماء والصفات","w":["الربوبية، والألوهية، والعبادة","الألوهية، والعبادة، والقصد","الربوبية، والأسماء والصفات، والحاكمية"],"s":"aqeedah"},{"id":"aq07","b":"أنواع التوحيد","q":"من الذين جحدوا توحيد الربوبية؟","a":"المعطلة كالدهرية والملاحدة","w":["الجهمية والمعتزلة","المشركون في الجاهلية","الخوارج والمرجئة"],"s":"aqeedah"},{"id":"aq08","b":"أنواع التوحيد","q":"من الذين جحدوا توحيد الأسماء والصفات؟","a":"الجهمية ومن تابعهم من المعتزلة","w":["المعطلة كالدهرية والملاحدة","المشركون في الجاهلية","الخوارج والمرجئة"],"s":"aqeedah"},{"id":"aq09","b":"أنواع التوحيد","q":"ما تعريف توحيد الألوهية؟","a":"إفراد الله بجميع أنواع العبادة","w":["الإقرار بأن الله وحده الخالق الرازق","إثبات ما أثبته الله لنفسه من الكمال","الإقرار بأن الله رب كل شيء ومليكه"],"s":"aqeedah"},{"id":"aq10","b":"أنواع التوحيد","q":"هل أنكر مشركو الجاهلية توحيد الربوبية؟","a":"لا، كانوا مقرّين بالربوبية مع شركهم بالألوهية","ca":"لا، كانوا مقرّين بها","w":["نعم، كانوا منكرين للربوبية","كانوا مقرّين بالألوهية منكرين للربوبية","كانوا منكرين للربوبية والألوهية"],"s":"aqeedah"},{"id":"aq11","b":"أنواع التوحيد","q":"ما دلالات توحيد الربوبية؟","a":"الفطرة، والأنفس، والآفاق","w":["العقل، والنقل، والحس","الفطرة، والعقل، والشرع","الأنفس، والآفاق، والإجماع"],"s":"aqeedah"},{"id":"aq12","b":"شهادة أن لا إله إلا الله","q":"ما معنى لا إله إلا الله إجمالاً؟","a":"لا معبود بحق إلا الله","w":["لا خالق إلا الله","لا رب إلا الله","لا موجود إلا الله"],"s":"aqeedah"},{"id":"aq13","b":"شهادة أن لا إله إلا الله","q":"ما ركنا كلمة التوحيد؟","a":"النفي والإثبات","w":["العلم واليقين","القبول والانقياد","الإخلاص والمحبة"],"s":"aqeedah"},{"id":"aq14","b":"شهادة أن لا إله إلا الله","q":"كم عدد شروط لا إله إلا الله؟ وما آخرها؟","a":"سبعة؛ آخرها المحبة","w":["سبعة؛ آخرها الإخلاص","ستة؛ آخرها الصدق","ثمانية؛ آخرها الانقياد"],"s":"aqeedah"},{"id":"aq15","b":"شهادة أن لا إله إلا الله","q":"شرط اليقين من شروط لا إله إلا الله ينافي ماذا؟","a":"الشك","w":["الرد","الترك","الكذب"],"s":"aqeedah"},{"id":"aq16","b":"شهادة أن لا إله إلا الله","q":"فقدُ أي شرط من شروط لا إله إلا الله جعل المنافقين لا ينتفعون بها؟","a":"الصدق","w":["اليقين","الإخلاص","المحبة"],"s":"aqeedah"},{"id":"aq17","b":"شهادة أن لا إله إلا الله","q":"ما النواقض الثلاثة الرئيسة لشهادة التوحيد؟","a":"الشرك الأكبر، والكفر الأكبر، والنفاق الاعتقادي","w":["الشرك الأصغر، والكفر الأصغر، والبدعة","الشرك الأكبر، والبدعة، والنفاق الع بة الأولى","عند دخول الخطيب المسجد قبل صعوده"],"s":"mithaq","o":1},{"id":"mq15","b":"واجبات الإمام خاصة","q":"بأي رواية يلتزم الإمام في القراءة في الصلوات؟","a":"رواية حفص بن سليمان الكوفي، منعًا للتشويش على المصلين، إلا باستثناء من الوزارة","ca":"رواية حفص بن سليمان الكوفي","w":["رواية ورش عن نافع","رواية قالون عن نافع","رواية شعبة عن عاصم"],"s":"mithaq","m":1},{"id":"mq16","b":"واجبات الإمام خاصة","q":"من المسؤول الأول عن المسجد من قبل إدارة المساجد؟","a":"الإمام","w":["المؤذن","الخطيب","مراقب المساجد في المحافظة"],"s":"mithaq","m":1},{"id":"mq17","b":"واجبات الإمام خاصة","q":"ماذا يفعل الإمام إذا لم ينضبط المؤذن؟","a":"ينصح المؤذن، وإلا يبرئ ذمته بإبلاغ الإدارة","w":["يبلغ الإدارة فورًا دون نصح","يخبر جماعة المسجد ليعينوه عليه","يتولى الأذان بنفسه ولا يبلغ أحدًا"],"s":"mithaq","m":1},{"id":"mq18","b":"واجبات الإمام خاصة","q":"من يحدد أوقات فتح مسجد النساء وإغلاقه؟","a":"الإمام، حسب توجيهات الإدارة","w":["المؤذن، حسب توجيهات الإمام","إدارة مساجد المحافظة مباشرة","جماعة المسجد بالتشاور بينهم"],"s":"mithaq","m":1},{"id":"mq19","b":"واجبات الإمام خاصة","q":"أين يدوّن الإمام نشاطاته ودروسه؟","a":"في البطاقة الشهرية بعد الانتهاء منها","w":["في سجل الحضور اليومي","في لوحة المسجد","في التقرير السنوي"],"s":"mithaq","m":1},{"id":"mq20","b":"واجبات الإمام خاصة","q":"ماذا يفعل الإمام إذا تعرّض لتعدٍّ من أحد المصلين؟","a":"يحاول الحل بالطرق السلمية، وإلا فله أن يبلغ المخفر والإدارة","w":["يبلغ المخفر فورًا دون محاولة الصلح","يعرض الأمر على جماعة المسجد","يبلغ الجهات المختصة والإدارة فورًا"],"s":"mithaq","m":1},{"id":"mq21","b":"واجبات الإمام خاصة","q":"هل يسمح الإمام بجمع التبرعات في المسجد؟","a":"لا يسمح بذلك إلا بتصريح من الوزارة","w":["يسمح بذلك بإذن من إدارة مساجد المحافظة","يسمح بذلك بعد التشاور مع جماعة المسجد","يسمح بذلك للمؤسسات الخيرية الزائرة مطلقًا"],"s":"mithaq","m":1},{"id":"mq22","b":"واجبات المؤذن خاصة","q":"من المسؤول الثاني عن المسجد؟","a":"المؤذن","w":["الخطيب","عامل النظافة","أقدم روّاد المسجد"],"s":"mithaq","o":1},{"id":"mq23","b":"واجبات المؤذن خاصة","q":"من يشرف على خطبة الجمعة بتهيئة المكبرات وتسجيلها وتسليمها؟","a":"المؤذن","w":["الإمام","الخطيب نفسه","قسم التوجيه الفني"],"s":"mithaq","o":1},{"id":"mq24","b":"واجبات المؤذن خاصة","q":"إذا كُلّف المؤذن بخطبة الجمعة فبماذا يلتزم؟","a":"يتقيد بخطبة الوزارة","w":["يخطب بما يراه مناسبًا","يختار موضوعًا بالتشاور مع الإمام","يعيد آخر خطبة للإمام"],"s":"mithaq","o":1},{"id":"mq25","b":"واجبات المؤذن خاصة","q":"ماذا يفعل المؤذن في الإمامة عند غياب الإمام؟","a":"يتقدم إلى الإمامة ولا يتركها لغيره؛ لأنه نائب عن الإمام","ca":"يتقدم إلى الإمامة ولا يتركها لغيره","w":["يقدّم أكبر المصلين سنًّا","يترك الإمامة لأقرأ الحاضرين","ينتظر حتى تكلّف الإدارة إمامًا آخر"],"s":"mithaq","o":1},{"id":"mq26","b":"واجبات المؤذن خاصة","q":"ما أول شرط في اختيار المؤذن؟","a":"أن يكون أمينًا في نفسه","w":["أن يكون حسن الصوت","أن يكون عالمًا بالمواقيت","أن يكون من أهل الحي"],"s":"mithaq","o":1},{"id":"mq27","b":"أدوار الإمام","q":"ما حكم مراجعة الأحكام الفقهية، وخاصة الصلاة والإمامة، على الأئمة؟","a":"فرض عين","w":["فرض كفاية","سنة مؤكدة","مستحب"],"s":"mithaq","m":1},{"id":"mq28","b":"أدوار الإمام","q":"كم الحد الأدنى للدروس التي يلتزمها الإمام في الأسبوع؟","a":"ثلاثة دروس، إضافة إلى الخطبة إن كان مكلفًا بها","ca":"ثلاثة دروس","w":["درسان","خمسة دروس","درس واحد"],"s":"mithaq","m":1},{"id":"mq29","b":"أدوار الإمام","q":"أين يحق للإمام استخدام الوسائل السمعية والمرئية؟","a":"في دروسه دون خطبه","w":["في خطبه دون دروسه","في دروسه وخطبه جميعًا","لا يحق له استخدامها مطلقًا"],"s":"mithaq","m":1},{"id":"mq30","b":"أدوار الإمام","q":"في أي المسائل يمتنع الإمام عن الإفتاء ويحيلها إلى جهات الاختصاص؟","a":"المسائل ذات الطابع الخصوصي: الطلاق، والمنازعات، والمواريث","w":["مسائل الطهارة والصلاة","مسائل الصيام والزكاة","أركان الإيمان والإسلام"],"s":"mithaq","m":1},{"id":"mq31","b":"الواجبات المشتركة والحقوق","q":"ماذا يلزم الإمام أو المؤذن أو الخطيب إذا رغب في الترشح للمجالس النيابية أو البلدية أو الجمعيات التعاونية؟","a":"التقدم بالاستقالة وتُنهى خدماته، وله حق الرجوع إن لم يفز","ca":"الاستقالة وإنهاء الخدمة مع حق الرجوع إن لم يفز","w":["يأخذ إجازة بدون راتب مدة الترشح","يترشح دون أي إجراء","يحصل على إذن كتابي ويستمر في عمله"],"s":"mithaq"},{"id":"mq32","b":"الواجبات المشتركة والحقوق","q":"كم الإجازة الدورية للموظف في السنة؟","a":"35 يومًا، تزاد إلى 45 يومًا بعد خمس عشرة سنة في خدمة الدولة","w":["30 يومًا، تزاد إلى 45 يومًا بعد عشر سنوات","45 يومًا، تزاد إلى 60 يومًا بعد عشرين سنة","35 يومًا، تزاد إلى 40 يومًا بعد خمس عشرة سنة"],"s":"mithaq"},{"id":"mq33","b":"الواجبات المشتركة والحقوق","q":"متى يُعفى الموظف من العقوبة التأديبية؟","a":"إذا ثبت أن المخالفة كانت تنفيذًا لأمر كتابي من رئيسه، بالرغم من تنبيهه إلى المخالفة","ca":"تنفيذ أمر كتابي من رئيسه رغم تنبيهه إلى المخالفة","w":["إذا كانت المخالفة تنفيذًا لأمر شفوي من رئيسه","إذا كانت المخالفة أول مرة","إذا اعتذر عن المخالفة كتابيًا"],"s":"mithaq"},{"id":"mq34","b":"الواجبات المشتركة والحقوق","q":"كم جهة تشملها العلاقات المشتركة؟","a":"أربع جهات: المسجد، والعاملون فيه، والمصلّون، والإدارة","ca":"أربع جهات","w":["ثلاث جهات: المسجد، والمصلّون، والإدارة","جهتان: المسجد والإدارة","خمس جهات: المسجد، والعاملون، والمصلّون، والإدارة، والوزارة"],"s":"mithaq"},{"id":"hf01","b":"مقدمة النووي","q":"ما حكم الحفاظ على حديث «من حفظ على أمتي أربعين حديثاً»؟","a":"اتفقوا على أنه ضعيف وإن كثرت طرقه","w":["اتفقوا على أنه صحيح","اتفقوا على أنه حسن لغيره","اتفقوا على أنه موضوع"],"s":"hadith"},{"id":"hf02","b":"مقدمة النووي","q":"من أول من عُلم أنه صنّف في الأربعين؟","a":"عبد الله بن المبارك","w":["محمد بن أسلم الطوسي","عبد الرحمن بن مهدي","يحيى بن سعيد الأنصاري"],"s":"hadith"},{"id":"hf03","b":"مقدمة النووي","q":"على ماذا اتفق العلماء في الحديث الضعيف؟","a":"جواز العمل به في فضائل الأعمال","w":["جواز العمل به في الأحكام","منع العمل به مطلقاً","جواز العمل به في العقائد"],"s":"hadith"},{"id":"hf04","b":"الحديث الأول: إنما الأعمال بالنيات","q":"ماذا قال أحمد والشافعي في حديث «إنما الأعمال بالنيات»؟","a":"يدخل فيه ثلث العلم","w":["يدخل فيه نصف العلم","يدخل فيه ربع العلم","يدخل فيه سبعون باباً من العلم"],"s":"hadith"},{"id":"hf05","b":"الحديث الأول: إنما الأعمال بالنيات","q":"كم باباً من الفقه يدخل فيه حديث النية عن الشافعي؟","a":"سبعين باباً","w":["ثلاثين باباً","أربعين باباً","مائة باب"],"s":"hadith"},{"id":"hf06","b":"الحديث الأول: إنما الأعمال بالنيات","q":"لماذا قال عبد الرحمن بن مهدي: ينبغي لكل من صنّف أن يبتدئ بحديث النية؟","a":"تنبيهاً للطالب على تصحيح النية","w":["تبركاً بأول حديث في البخاري","لأنه أصح حديث في الصحيحين","لأنه ثلث الإسلام"],"s":"hadith"},{"id":"hf07","b":"الحديث الأول: إنما الأعمال بالنيات","q":"ما وصف إسناد حديث «إنما الأعمال بالنيات»؟","a":"مشهور بالنسبة إلى آخره، غريب بالنسبة إلى أوله","w":["غريب بالنسبة إلى آخره، مشهور بالنسبة إلى أوله","متواتر في جميع طبقاته","مشهور في أوله وآخره"],"s":"hadith"},{"id":"hf08","b":"الحديث الأول: إنما الأعمال بالنيات","q":"من الذي لم يروِ حديث النية عن عمر غيره؟","a":"علقمة بن أبي وقاص","w":["محمد بن إبراهيم التيمي","يحيى بن سعيد الأنصاري","عبد الرحمن بن مهدي"],"s":"hadith"},{"id":"hf09","b":"الحديث الأول: إنما الأعمال بالنيات","q":"ما معنى «إنما» في «إنما الأعمال بالنيات»؟","a":"للحصر: تثبت المذكور وتنفي ما عداه","ca":"الحصر","w":["التأكيد","التعليل","الاستئناف"],"s":"hadith"},{"id":"hf10","b":"الحديث الأول: إنما الأعمال بالنيات","q":"هل تحتاج إزالة النجاسة إلى نية؟","a":"لا؛ لأنها من باب الترك","w":["نعم؛ لأنها عبادة","نعم؛ لأنها شرط للصلاة","لا؛ لأنها من باب المباحات"],"s":"hadith"},{"id":"hf11","b":"الحديث الأول: إنما الأعمال بالنيات","q":"ما الذي يقدّره من اشترط النية في «إنما الأعمال بالنيات»؟","a":"صحة الأعمال","w":["كمال الأعمال","قبول الأعمال","ثواب الأعمال"],"s":"hadith"},{"id":"hf12","b":"الحديث الأول: إنما الأعمال بالنيات","q":"ما الذي يقدّره من لم يشترط النية في «إنما الأعمال بالنيات»؟","a":"كمال الأعمال","w":["صحة الأعمال","قبول الأعمال","وجوب الأعمال"],"s":"hadith"},{"id":"hf13","b":"الحديث الأول: إنما الأعمال بالنيات","q":"ما سبب ورود حديث «إنما الأعمال بالنيات»؟","a":"رجل هاجر ليتزوج امرأة يقال لها أم قيس","ca":"مهاجر أم قيس","w":["رجل هاجر ليصيب مالاً من المدينة","رجل خرج للجهاد طلباً للغنيمة","رجل تصدق رياءً"],"s":"hadith"},{"id":"hf14","b":"الحديث الرابع والثلاثون: من رأى منكم منكراً","q":"من أول من بدأ بالخطبة يوم العيد قبل الصلاة؟","a":"مروان","w":["معاوية","عثمان","عبد الملك بن مروان"],"s":"hadith"},{"id":"hf15","b":"الحديث الرابع والثلاثون: من رأى منكم منكراً","q":"ما نوع الأمر في «فليغيّره»؟","a":"أمر إيجاب بإجماع الأمة","w":["أمر ندب باتفاق العلماء","أمر إرشاد","أمر إباحة"],"s":"hadith"},{"id":"hf16","b":"الحديث الرابع والثلاثون: من رأى منكم منكراً","q":"ما حكم الأمر بالمعروف والنهي عن المنكر؟","a":"فرض كفاية","w":["فرض عين على كل مسلم","سنة مؤكدة","مستحب"],"s":"hadith"},{"id":"hf17","b":"الحديث الرابع والثلاثون: من رأى منكم منكراً","q":"هل يسقط الإنكار إذا ظن أنه لا يُقبل منه؟","a":"لا يسقط؛ فعليه الأمر والنهي لا القبول","ca":"لا يسقط","w":["يسقط لعدم الفائدة","يسقط ويصير مستحباً","يسقط إلا عن العلماء"],"s":"hadith"},{"id":"hf18","b":"الحديث الرابع والثلاثون: من رأى منكم منكراً","q":"هل يُنكر العلماء المختلف فيه؟","a":"لا؛ إنما ينكرون ما أجمع عليه","ca":"لا","w":["نعم كالمجمع عليه","نعم إذا خالف مذهبه","نعم باليد دون اللسان"],"s":"hadith"},{"id":"hf19","b":"الحديث الرابع والثلاثون: من رأى منكم منكراً","q":"ما قول الشافعي فيمن وعظ أخاه علانية؟","a":"فقد فضحه وشانه","w":["فقد نصحه وزانه","فقد أدى ما عليه","فقد أحسن إليه"],"s":"hadith"},{"id":"hf20","b":"الحديث الرابع والثلاثون: من رأى منكم منكراً","q":"ما معنى «وذلك أضعف الإيمان»؟","a":"أقلّه ثمرة","w":["أقلّه أجراً","أدناه درجة في الجنة","أنه لا إيمان بعده"],"s":"hadith"},{"id":"hf21","b":"الحديث الرابع والثلاثون: من رأى منكم منكراً","q":"ما حكم تغيير المنكر على من خاف القتل أو الضرب؟","a":"سقط عنه التغيير","w":["يجب عليه باليد","يجب عليه باللسان","يأثم بتركه"],"s":"hadith"},{"id":"hf22","b":"الحديث الخامس والثلاثون: لا تحاسدوا","q":"ما الفرق بين الحسد والغبطة؟","a":"الحسد تمني زوال النعمة وهو حرام، والغبطة تمني حال المغبوط من غير إرادة زوالها","w":["الحسد تمني حال المغبوط، والغبطة تمني زوال النعمة","كلاهما تمني زوال النعمة","الحسد مكروه، والغبطة حرام"],"s":"hadith"},{"id":"hf23","b":"الحديث الخامس والثلاثون: لا تحاسدوا","q":"ما أصل ال h"},{"id":"hf52","b":"الحديث الخامس: من أحدث في أمرنا","q":"أيّ هذه لا يدخل في «من أحدث في أمرنا» المردود؟","a":"كتابة المصحف ومذاهب المجتهدين وكتب النحو","w":["كل عبادة مخترعة لا أصل لها","العقود الممنوعة","كل بدعة ومخترع"],"s":"hadith"},{"id":"hf53","b":"الحديث السادس والعشرون: كل سُلامى عليه صدقة","q":"ما معنى «سُلامى» وكم عددها؟","a":"المفاصل والأعضاء، وهي ثلاثمائة وستون","ca":"ثلاثمائة وستون مفصلاً","w":["ثلاثمائة وثلاثون مفصلاً","مائتان وستون مفصلاً","ثلاثمائة وستة مفاصل"],"s":"hadith"},{"id":"hf54","b":"الحديث السادس والعشرون: كل سُلامى عليه صدقة","q":"ما الذي يجزئ عن صدقة السلامى كلها؟","a":"ركعتان يركعهما من الضحى","w":["ركعتا الفجر","صدقة بدرهم","الوتر"],"s":"hadith"},{"id":"hf55","b":"الحديث السادس والعشرون: كل سُلامى عليه صدقة","q":"ما نوع الصدقة المرادة في «كل سلامى عليه صدقة»؟","a":"صدقة ترغيب وترهيب لا إيجاب","w":["صدقة واجبة","زكاة مفروضة","صدقة إيجاب على الأغنياء"],"s":"hadith"},{"id":"hf56","b":"الحديث الثاني والأربعون: يا ابن آدم","q":"ما شروط التوبة؟","a":"ثلاثة: الإقلاع والندم والعزم، ورابع: الكفارة إن وُجدت","w":["اثنان: الندم والاستغفار","ثلاثة: الندم والاستغفار والصدقة","أربعة: الإقلاع والندم والعزم والحج"],"s":"hadith"},{"id":"hf57","b":"الحديث التاسع عشر: احفظ الله يحفظك","q":"ما الذي أرشده إليه قوله «إذا سألت فاسأل الله»؟","a":"التوكل وألا يتعلق بغيره","ca":"التوكل","w":["الإيمان بالقدر","الصبر","الزهد"],"s":"hadith"},{"id":"hf58","b":"الحديث الرابع عشر: لا يحل دم امرئ مسلم","q":"ما الثلاث التي يحل بها دم المسلم؟","a":"الثيب الزاني، والنفس بالنفس، والتارك لدينه المفارق للجماعة","w":["الزاني البكر، والقاتل، وتارك الصلاة","الثيب الزاني، والسارق، والمرتد","القاتل، وشارب الخمر، والمرتد"],"s":"hadith"},{"id":"hf59","b":"الحديث الرابع عشر: لا يحل دم امرئ مسلم","q":"من الثيب الزاني وما حكمه؟","a":"المحصن ذكراً أو أنثى، وحكمه الرجم","ca":"الرجم","w":["الجلد مائة","الجلد والتغريب","القتل بالسيف"],"s":"hadith"},{"id":"hf60","b":"الحديث السادس: إن الحلال بيّن","q":"قال أبو داود: الإسلام يدور على كم حديثاً؟","a":"أربعة أحاديث","w":["ثلاثة أحاديث","خمسة أحاديث","سبعة أحاديث"],"s":"hadith"},{"id":"hf61","b":"الحديث السادس: إن الحلال بيّن","q":"ما الشبهات؟","a":"ما تنازعته الأدلة، فالإمساك عنه ورع","ca":"ما تنازعته الأدلة","w":["ما نُص على تحريمه","ما نُص على حِلّه","ما لم يرد فيه نص ولا دليل"],"s":"hadith"},{"id":"hf62","b":"الحديث السادس: إن الحلال بيّن","q":"ما معنى «المضغة» ولماذا سُمّي القلب قلباً؟","a":"قطعة لحم قدر ما يُمضغ؛ وسُمّي القلب لسرعة الخواطر فيه","w":["قطعة دم؛ وسُمّي القلب لتقلبه في الصدر","قطعة لحم؛ وسُمّي القلب لأنه وسط الجسد","قطعة لحم؛ وسُمّي القلب لأنه لبّ الإنسان"],"s":"hadith"},{"id":"hf63","b":"الحديث الثاني والعشرون: أرأيت إذا صليت المكتوبات","q":"من السائل في «أرأيت إذا صليت المكتوبات»؟","a":"النعمان بن قوقل","w":["الأقرع بن حابس","النعمان بن بشير","سفيان بن عبد الله"],"s":"hadith"},{"id":"hf64","b":"الحديث الثاني والعشرون: أرأيت إذا صليت المكتوبات","q":"ما معنى «حرّمت الحرام» و«أحللت الحلال»؟","a":"اجتنبته؛ وفعلته معتقداً حلّه","w":["اعتقدت تحريمه فقط؛ وفعلته","اجتنبته؛ وتركته ورعاً","نهيت عنه؛ وأمرت به"],"s":"hadith"},{"id":"hf65","b":"الحديث الأربعون: كن في الدنيا كأنك غريب","q":"ما معنى «كن في الدنيا كأنك غريب» عند أبي الزناد؟","a":"الحض على قلة المخالطة وقلة الاقتناء والزهد في الدنيا","w":["الحض على الاستعداد للموت وتقصير الأمل","الحض على السفر في طلب العلم","الحض على العزلة التامة وترك الكسب"],"s":"hadith"},{"id":"hf66","b":"الحديث السابع والثلاثون: إن الله كتب الحسنات والسيئات","q":"من همّ بسيئة فلم يعملها ماذا يُكتب له؟","a":"حسنة كاملة","w":["سيئة واحدة","لا يُكتب له شيء","نصف حسنة"],"s":"hadith"},{"id":"hf67","b":"الحديث السابع والثلاثون: إن الله كتب الحسنات والسيئات","q":"من ترك السيئة مكرهاً أو عاجزاً هل تُكتب له حسنة؟","a":"لا تُكتب له حسنة","w":["تُكتب له حسنة كاملة","تُكتب له عشر حسنات","تُكتب له نصف حسنة"],"s":"hadith"},{"id":"hf68","b":"الحديث الخامس والعشرون: ذهب أهل الدثور بالأجور","q":"ما معنى «الدثور»؟","a":"المال الكثير","w":["الجماع","الأجر العظيم","الثياب الفاخرة"],"s":"hadith"},{"id":"hf69","b":"الحديث الثاني والثلاثون: لا ضرر ولا ضرار","q":"ما الفرق بين الضرر وا  في الأربعين: (1) إنما الأعمال بالنيات، (2) بينما نحن جلوس عند رسول الله ﷺ… (حديث جبريل).","s":"hadith"},{"id":"hk_90","b":"الأربعون: الرواة والعدد","q":"كم حديثاً رواه أنس في الأربعين النووية؟ وما هي؟","a":"حديثان: (13) لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه، (42) قال الله تعالى: يا ابن آدم إنك ما دعوتني ورجوتني","ca":"حديثان","w":["تسعة أحاديث","خمسة أحاديث","أربعة أحاديث"],"ex":"أحاديث أنس في الأربعين: (13) لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه، (42) قال الله تعالى: يا ابن آدم إنك ما دعوتني ورجوتني.","s":"hadith"},{"id":"hk_91","b":"الأربعون: الرواة والعدد","q":"كم حديثاً رواه أبو سعيد في الأربعين النووية؟ وما هي؟","a":"حديثان: (32) لا ضرر ولا ضرار، (34) من رأى منكم منكراً فليغيره بيده","ca":"حديثان","w":["ثلاثة أحاديث","خمسة أحاديث","أربعة أحاديث"],"ex":"أحاديث أبو سعيد في الأربعين: (32) لا ضرر ولا ضرار، (34) من رأى منكم منكراً فليغيره بيده.","s":"hadith"},{"id":"hk_92","b":"الأربعون: الرواة والعدد","q":"كم حديثاً رواه معاذ في الأربعين النووية؟ وما هي؟","a":"حديثان: (18) اتق الله حيثما كنت، (29) أخبرني بعمل يدخلني الجنة ويباعدني عن النار","ca":"حديثان","w":["خمسة أحاديث","ثلاثة أحاديث","أربعة أحاديث"],"ex":"أحاديث معاذ في الأربعين: (18) اتق الله حيثما كنت، (29) أخبرني بعمل يدخلني الجنة ويباعدني عن النار.","s":"hadith"},{"id":"h5v","b":"الأربعون: الرواة والعدد","q":"ما الحديث الذي راويه عائشة في الأربعين النووية؟","a":"من أحدث في أمرنا هذا ما ليس منه فهو ردّ","w":["أن رجلاً قال: أوصني، قال: لا تغضب","ازهد في الدنيا يحبك الله","أُمرت أن أقاتل الناس"],"ex":"الحديث 5: «من أحدث في أمرنا هذا ما ليس منه فهو ردّ» — الراوي: أم المؤمنين أم عبد الله عائشة. رواه: البخاري ومسلم؛ ولمسلم: «من عمل عملاً ليس عليه أمرنا فهو رد».","s":"hadith"},{"id":"h6v","b":"الأربعون: الرواة والعدد","q":"ما الحديث الذي راويه النعمان بن بشير في الأربعين النووية؟","a":"إن الحلال بيّن وإن الحرام بيّن","w":["من أحدث في أمرنا هذا ما ليس منه فهو ردّ","الطهور شطر الإيمان","من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت"],"ex":"الحديث 6: «إن الحلال بيّن وإن الحرام بيّن» — الراوي: أبو عبد الله "hk_108","b":"الأربعون: الرواة والعدد","q":"ما أحاديث الأربعين التي ليست في الصحيحين بهذا اللفظ؟","a":"(11) دع ما يريبك إلى ما لا يريبك، (12) من حُسن إسلام المرء تركه ما لا يعنيه، (18) اتق الله حيثما كنت، (19) يا غلام إني أعلمك كلمات: احفظ الله يحفظك، (28) وعظنا رسول الله ﷺ موعظة… أوصيكم بتقوى الله، (29) أخبرني بعمل يدخلني الجنة ويباعدني عن النار، (30) إن الله تعالى فرض فرائض فلا تضيعوها، (31) ازهد في الدنيا يحبك الله، (32) لا ضرر ولا ضرار، (33) لو يُعطى الناس بدعواهم… البينة على المدعي، (39) إن الله تجاوز لي عن أمتي الخطأ والنسيان، (41) لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به، (42) قال الله تعالى: يا ابن آدم إنك ما دعوتني ورجوتني","ex":"ليست في الصحيحين بهذا اللفظ: (11) دع ما يريبك إلى ما لا يريبك، (12) من حُسن إسلام المرء تركه ما لا يعنيه، (18) اتق الله حيثما كنت، (19) يا غلام إني أعلمك كلمات: احفظ الله يحفظك، (28) وعظنا رسول الله ﷺ موعظة… أوصيكم بتقوى الله، (29) أخبرني بعمل يدخلني الجنة ويباعدني عن النار، (30) إن الله تعالى فرض فرائض فلا تضيعوها، (31) ازهد في الدنيا يحبك الله، (32) لا ضرر ولا ضرار، (33) لو يُعطى الناس بدعواهم… البينة على المدعي، (39) إن الله تجاوز لي عن أمتي الخطأ والنسيان، (41) لا يؤمن أحدكم حتى يكون هواه تبعاً لما جئت به، (42) قال الله تعالى: يا ابن آدم إنك ما دعوتني ورجوتني.","s":"hadith"},{"id":"tf01","b":"سورة النازعات","q":"ما معنى «الراجفة» في قوله تعالى: «يوم ترجف الراجفة»؟","a":"النفخة الأولى التي يموت بها جميع الخلائق","ca":"النفخة الأولى","w":["النفخة الثانية التي يكون عندها البعث","صيحة يوم القيامة التي تصخ الآذان","الداهية العظمى التي تطم على سائر الطامات"],"s":"tafsir"},{"id":"tf02","b":"سورة النازعات","q":"ما معنى «الرادفة» في قوله تعالى: «تتبعها الرادفة»؟","a":"النفخة الثانية التي يكون عندها البعث","ca":"النفخة الثانية","w":["النفخة الأولى التي يموت بها جميع الخلائق","الملائكة التي تنزع أرواح العباد","أرض بيضاء يحاسب الله عليها الخلائق"],"s":"tafsir"},{"id":"tf03","b":"سورة النازعات","q":"ما معنى «دحاها» في قوله تعالى: «والأرض بعد ذلك دحاها»؟","a":"بسطها","w":["رفعها","أظلمها","أرساها"],"s":"tafsir"},{"id":"tf04","b":"سورة ال const CONTENT=[{"b":"الطهارة","tree":[{"h":"كتاب الطهارة: تعريفها وأقسام المياه","pts":["الطهارة: رفع الحدث، وزوال الخبث","أقسام الماء ثلاثة: طهور، وطاهر، ونجس","الطهور: يرفع الحدث ويزيل الخبث","الطاهر: ما تغير كثير من لونه أو طعمه أو ريحه بشيء طاهر، يستعمل في غير رفع الحدث وزوال الخبث","النجس: يحرم استعماله إلا لضرورة، ولا يرفع الحدث ولا يزيل الخبث"],"p":62},{"h":"باب الآنية، وباب الاستنجاء","pts":["يباح كل إناء طاهر ولو ثميناً، إلا آنية الذهب والفضة والمموه بهما","تصح الطهارة بهما وبالإناء المغصوب","الإنقاء بالحجر: لا يجزئ أقل من ثلاث مسحات تعم كل مسحة المحل","يحرم الاستنجاء بروث وعظم وطعام، فإن فعل لم يجزئ بعد ذلك إلا الماء"],"p":65},{"h":"آداب التخلي، وباب السواك","pts":["يحرم استقبال القبلة واستدبارها في الصحراء بلا حائل، ويكفي إرخاء ذيله","يحرم البول والتغوط تحت شجرة عليها ثمر يقصد، وبين قبور المسلمين","ويحرم أن يلبث فوق قدر حاجته","السواك مسنون مطلقاً إلا بعد الزوال للصائم فيكره","يتأكد عند: وضوء، وصلاة، وقراءة، وانتباه من نوم، وتغير رائحة فم، ودخول مسجد ومنزل، وإطالة سكوت، وصفرة أسنان"],"p":68},{"h":"باب الوضوء: التسمية والفروض والشروط","pts":["تجب فيه التسمية، وتسقط سهواً، وإن ذكرها في أثنائه ابتدأ","فروضه ستة: غسل الوجه ومنه المضمضة والاستنشاق، وغسل اليدين مع المرفقين، ومسح الرأس كله ومنه الأذنان، وغسل الرجلين مع الكعبين، والترتيب، والموالاة","شروطه ثمانية: انقطاع ما يوجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله، والاستنجاء أو الاستجمار"],"p":71},{"h":"صفة الوضوء وسننه","pts":["صفته: ينوي، ثم يسمي، ويغسل كفيه، ثم يتمضمض ويستنشق، ثم يغسل وجهه، ثم يديه مع مرفقيه، ثم يمسح رأسه وأذنيه، ثم يغسل رجليه مع كعبيه","سننه ثمان عشرة، منها: استقبال القبلة، والسواك، وغسل الكفين ثلاثاً، والبداءة بالمضمضة والاستنشاق، والمبالغة فيهما لغير صائم","ومنها: تخليل اللحية الكثيفة والأصابع، وأخذ ماء جديد للأذنين، وتقديم اليمنى، والغسلة الثانية والثالثة"],"p":73},{"h":"باب مسح الخفين، وفصل الجبيرة","pts":["يجوز بشروط سبعة، أولها: لبسهما بعد كمال الطهارة بالماء","المقيم والعاصي بسفره يوم وليلة، والمسافر ثلاثة أيام بلياليهن، من الحدث بعد اللبس","يبطل الوضوء إذا حصل ما يوجب الغسل، أو ظهر بعض محل الفرض، أو انقضت المدة","الجبيرة: إن وضعها على طهارة ولم تتجاوز المحل غسل الصحيح ومسح عليها وأجزأ، وإلا وجب مع الغسل أن يتيمم لها"],"p":75},{"h":"باب نواقض الوضوء، وأحكام المحدث","pts":["النواقض ثمانية: الخارج من السبيلين، وخروج النجاسة من بقية البدن، وزوال العقل، ومس الفرج بيده، ولمس الذكر الأنثى لشهوة، وغسل الميت، وأكل لحم الإبل، والردة","مس الفرج: بيده لا ظفره، بلا حائل","اللمس: لشهوة، من غير حائل","من تيقن الطهارة وشك في الحدث أو العكس: عمل بما تيقن","يحرم على المحدث: الصلاة، والطواف، ومس المصحف، ويزيد من عليه غسل: قراءة القرآن، واللبث في المسجد بلا وضوء"],"p":78},{"h":"باب ما يوجب الغسل، وشروطه وواجبه وفرضه","pts":["موجباته سبعة: انتقال المني، وخروجه، وتغييب الحشفة في فرج، وإسلام الكافر، وخروج الحيض، وخروج دم النفاس، والموت تعبداً","شروطه سبعة: انقطاع ما يوجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله","واجبه: التسمية، وتسقط سهواً","فرضه: أن يعم بالماء جميع بدنه وداخل فمه وأنفه"],"p":80},{"h":"سنن الغسل، ومقدار الماء، والأغسال المستحبة","pts":["سننه: الوضوء قبله، وإزالة ما لوثه من أذى، وإفراغ الماء على رأسه ثلاثاً وعلى بقية جسده ثلاثاً، والتيامن، والموالاة، وإمرار اليد، وإعادة غسل رجليه بمكان آخر","يسن الوضوء بمد، والاغتسال بصاع، ويكره الإسراف","الأغسال المستحبة ستة عشر، آكدها لصلاة جمعة، ومنها: لعيد، وكسوف، واستسقاء، وإحرام، ودخول مكة، ووقوف بعرفة"],"p":83},{"h":"باب التيمم","pts":["شرطه الثامن: أن يكون بتراب طهور مباح غير محترق له غبار يعلق باليد","واجبه: التسمية، وتسقط سهواً","فروضه خمسة: مسح الوجه، ومسح اليدين إلى الكوعين، والترتيب في الطهارة الصغرى، والموالاة، وتعيين النية","مبطلاته خمسة: ما أبطل الوضوء، ووجود الماء، وخروج الوقت، وزوال المبيح له، وخلع ما مسح عليه","صفته: ينوي، ثم يسمي، ويضرب التراب بيديه مفرجتي الأصابع ضربة واحدة، والأحوط اثنتان"],"p":87},{"h":"باب إزالة النجاسة","pts":["يشترط لكل متنجس سبع غسلات","إحداها بتراب طاهر أو صابون ونحوه في متنجس بكلب أو خنزير","يجزئ في بول غلام لم يأكل الطعام لشهوة نضحه، وهو غمره بالماء"],"p":90},{"h":"باب الحيض والاستحاضة","pts":["لا حيض قبل تمام تسع سنين ولا بعد خمسين سنة","أقله يوم وليلة، وأكثره خمسة عشر يوماً، وغالبه ست أو سبع","يحرم به: الوطء في الفرج، والطلاق، والصلاة، والصوم، والطواف، وقراءة القرآن، ومس المصحف، واللبث في المسجد","يوجب: الغسل، والبلوغ، والكفارة بالوطء فيه: دينار أو نصفه على التخيير","تقضي الحائض والنفساء الصوم لا الصلاة","من جاوز دمها خمسة عشر يوماً فهي مستحاضة"],"p":93}],"rules":[{"r":"يباح اتخاذ كل إناء طاهر واستعماله ولو ثميناً، إلا آنية الذهب والفضة والمموه بهما","p":64,"cards":["s3","s4"]},{"r":"لا ينجس شيء بالشك ما لم تعلم نجاسته","p":64,"cards":["s23"]},{"r":"من تيقن الطهارة وشك في الحدث، أو تيقن الحدث وشك في الطهارة: عمل بما تيقن","p":79,"cards":["s23"]},{"r":"كل ما أوجب الغسل أوجب الوضوء، غير الموت","p":78,"cards":["s20","s25"]},{"r":"كل من حدثه دائم يفعل كالمستحاضة: يغسل المحل ويعصبه، ويتوضأ لوقت كل صلاة","p":94,"cards":["s39","s40"]}],"traps":[{"t":"استقبال القبلة: يكره أم يحرم؟","right":"يكره استقبال القبلة واستدبارها في الاستنجاء، ويحرم ذلك عند قضاء الحاجة في الصحراء بلا حائل","wrong":"جعل الحكمين واحداً: التحريم في الاستنجاء، أو الكراهة فقط في الصحراء","p":66,"card":"s6"},{"t":"السواك بعد الزوال","right":"مسنون مطلقاً، إلا بعد الزوال للصائم فيكره","wrong":"القول بأنه يحرم على الصائم، أو يكره لكل أحد بعد الزوال","p":68,"card":"s9"},{"t":"غسل الكفين وغسل اليدين","right":"غسل الكفين ثلاثاً سنة، وغسل اليدين مع المرفقين فرض","wrong":"الظن أن غسل الكفين أول الوضوء يغني عن غسل اليدين","p":73,"card":"v925"},{"t":"بداية مدة المسح","right":"المدة من الحدث بعد اللبس","wrong":"حساب اليوم والليلة من وقت اللبس أو من أول مسح","p":75,"card":"s17"},{"t":"شروط الوضوء وشروط الغسل","right":"شروط الوضوء ثمانية، وشروط الغسل سبعة بلا الاستنجاء","wrong":"عدّ شروط الغسل ثمانية كشروط الوضوء","p":80,"card":"s26"},{"t":"نقض الشعر في الغسل","right":"يجب نقضه في الحيض والنفاس، لا الجنابة","wrong":"إيجاب نقض الشعر في غسل الجنابة أيضاً","p":81,"card":"s27"},{"t":"حد اليدين في التيمم","right":"مسح اليدين إلى الكوعين","wrong":"المسح إلى المرفقين كما في الوضوء","p":87,"card":"s31"},{ ..","سنن الأفعال تسمى الهيئات: رفع اليدين، ووضع اليمين على الشمال تحت سرته، ونظره إلى موضع سجوده..."],"p":113},{"h":"ما يكره في الصلاة وما يبطلها","pts":["يكره: الاقتصار على الفاتحة، والالتفات بلا حاجة، وتغميض العينين، وافتراش الذراعين، والعبث، والتخصر","متى كثر ذلك عرفاً بطلت","يكره أن يخص جبهته بما يسجد عليه","يبطلها: ما أبطل الطهارة، وكشف العورة عمداً، واستدبار القبلة، واتصال النجاسة إن لم يزلها في الحال","يبطلها: تعمد زيادة ركن فعلي، وتعمد تقديم بعض الأركان، وتعمد السلام قبل إتمامها"],"p":116},{"h":"باب سجود السهو","pts":["يسن: إذا أتى بقول مشروع في غير محله سهواً","يباح: إذا ترك مسنوناً","يجب: إذا زاد ركوعاً أو سجوداً أو قياماً أو قعوداً، أو سلم قبل إتمامها، أو لحن لحناً يحيل المعنى، أو ترك واجباً، أو شك في زيادة","تبطل الصلاة بتعمد ترك الواجب منه، لا إن ترك ما وجب بسلامه قبل إتمامها","يسقط إن طال الفصل عرفاً، أو أحدث، أو خرج من المسجد","ناسي التشهد الأول: يرجع، ويكره إن استتم قائماً، ولا يرجع إن شرع في القراءة","الشك في الصلاة: يبني على اليقين وهو الأقل، وبعد فراغها لا أثر له"],"p":120},{"h":"باب صلاة التطوع","pts":["أفضلها ما سن جماعة، وآكدها: الكسوف، فالاستسقاء، فالتراويح، فالوتر","الوتر: أقله ركعة، وأكثره إحدى عشرة، وأدنى الكمال ثلاث بسلامين","وقت الوتر: ما بين صلاة العشاء وطلوع الفجر","أفضل الرواتب: سنة الفجر، ثم المغرب، ثم سواء","الرواتب المؤكدة عشر","يسن قضاء الرواتب والوتر إلا ما فات مع فرضه وكثر فالأولى تركه"],"p":122},{"h":"الضحى، وسجود التلاوة والشكر، وأوقات النهي","pts":["تسن صلاة الضحى غباً: أقلها ركعتان وأكثرها ثمان، من خروج وقت النهي إلى قبيل الزوال","تسن تحية المسجد وسنة الوضوء","سجود التلاوة كالنافلة فيما يعتبر لها: يكبر إذا سجد بلا تكبيرة إحرام، وإذا رفع، ويجلس، ويسلم بلا تشهد","سجود الشكر عند تجدد النعم واندفاع النقم، وإن سجد له في صلاته عالماً ذاكراً بطلت","أوقات النهي: من طلوع الفجر إلى ارتفاع الشمس قيد رمح، ومن صلاة العصر إلى غروبها، وعند قيامها حتى تزول","يحرم فيها التطوع ولا ينعقد ولو جاهلاً، سوى: سنة الفجر قبلها، وركعتي الطواف، وسنة الظهر إذا جمع، وإعادة جماعة أقيمت وهو بالمسجد"],"p":126},{"h":"باب صلاة الجماعة","pts":["تجب على الرجال ا ],"p":176},{"h":"زكاة العسل والركاز","pts":["في العسل: العشر","نصابه: مائة وستون رطلاً عراقية"],"p":178},{"h":"باب زكاة الأثمان والحلي","pts":["الأثمان: الذهب والفضة، وفيها ربع العشر إذا بلغت نصاباً","نصاب الذهب: عشرون مثقالاً، ونصاب الفضة: مائتا درهم","يضم الذهب إلى الفضة في تكميل النصاب، ويخرج من أيهما شاء","لا زكاة في حلي مباح معد لاستعمال أو إعارة","تجب في الحلي المحرم، وفي المباح المعد للكراء أو النفقة إذا بلغ نصاباً وزناً"],"p":178},{"h":"باب زكاة العروض","pts":["هي ما يعد للبيع والشراء لأجل الربح","تقوم إذا حال الحول بالأحظ للمساكين من ذهب أو فضة","إن بلغت القيمة نصاباً وجب ربع العشر، وإلا فلا"],"p":180},{"h":"باب زكاة الفطر","pts":["تجب بأول ليلة العيد؛ فمن مات أو أعسر قبل الغروب فلا زكاة عليه","تلزمه عن نفسه، وعمن يمونه من المسلمين","الأفضل: يوم العيد قبل الصلاة، وتكره بعدها، ويحرم تأخيرها عن يوم العيد مع القدرة ويقضيها، وتجزئ قبل العيد بيومين","الواجب: صاع من تمر أو زبيب أو بر أو شعير أو أقط","يجوز إعطاء الجماعة فطرتهم لواحد، والواحد فطرته لجماعة","لا يجزئ إخراج القيمة في الزكاة مطلقاً"],"p":182},{"h":"باب إخراج الزكاة","pts":["يجب إخراجها فوراً، وله تأخيرها لزمن حاجة، ولقريب، وجار، ولتعذر إخراجها من النصاب","من جحد وجوبها عالماً كفر ولو أخرجها، ومن منعها بخلاً أو تهاوناً أخذت منه وعزر","يشترط لإخراجها نية من مكلف، والأفضل قرنها بالدفع، ولا يجزئ إن نوى صدقة مطلقة","يحرم نقلها إلى مسافة قصر، وتجزئ","يصح تعجيلها لحولين فقط إذا كمل النصاب"],"p":185},{"h":"باب أهل الزكاة ومن لا تدفع إليه","pts":["ثمانية: الفقير، والمسكين، والعامل عليها، والمؤلف، والمكاتب، والغارم، والغازي في سبيل الله، وابن السبيل","لا يجزئ دفعها: للكافر، ولا للرقيق، ولا للغني بمال أو كسب، ولا لمن تلزمه نفقته، ولا للزوج، ولا لبني هاشم","إن دفعها لمن يظنه فقيراً فبان غنياً: أجزأ"],"p":187},{"h":"فصل في صدقة التطوع","pts":["تسن في كل وقت، لا سيما سراً، وفي الزمان والمكان الفاضل، وعلى جاره، وذوي رحمه","من تصدق بما ينقص مؤنة تلزمه أثم","المن بالصدقة كبيرة، ويبطل به الثواب"],"p":189}],"rules":[{"r":"شرط وجوب الزكاة خمسة: الإسلام، والحرية، وملك النصاب، والملك التام، وتمام الحول","p":170,"cards":["s103"]},{"r":"لا يجزئ إخراج القيمة في الزكاة مطلقاً","p":183,"cards":["s112"]},{"r":"يجب إخراج الزكاة فوراً كالنذر والكفارة","p":184,"cards":["s113"]},{"r":"السائمة بمحلين بينهما مسافة قصر: لكل محل حكم نفسه","p":174,"cards":["v7398"]},{"r":"لا يجزئ دفع الزكاة للكافر، ولا للرقيق، ولا للغني بمال أو كسب","p":187,"cards":["s117"]}],"traps":[{"t":"العشر ونصف العشر في الزروع","right":"فيما يسقى بلا كلفة: العشر، وفيما يسقى بكلفة: نصف العشر","wrong":"عكسهما، أو جعل الواجب ربع العشر كالأثمان","p":176,"card":"v7562"},{"t":"نصاب الذهب ونصاب الفضة","right":"الذهب: عشرون مثقالاً، والفضة: مائتا درهم، وفيهما ربع العشر","wrong":"الخلط بين العددين، أو جعل الواجب العشر","p":178,"card":"s107"},{"t":"أقل نصاب الإبل والبقر والغنم","right":"الإبل خمس، والبقر ثلاثون، والغنم أربعون","wrong":"الخلط بين الأعداد، كجعل البقر أربعين والغنم ثلاثين","p":171,"card":"s105"},{"t":"الحلي المعد للاستعمال والمعد للكراء","right":"لا زكاة في المباح المعد لاستعمال أو إعارة، وتجب في المعد للكراء أو النفقة","wrong":"إيجاب الزكاة في كل حلي، أو إسقاطها عن كل حلي مباح","p":179,"card":"s108"},{"t":"نقل الزكاة إلى مسافة قصر","right":"يحرم نقلها، وتجزئ","wrong":"أنه يحرم ولا تجزئ، أو أنه جائز بلا حرج","p":186,"card":"s115"},{"t":"مدة تعجيل الزكاة","right":"يصح تعجيلها لحولين فقط إذا كمل النصاب","wrong":"جواز تعجيلها لأكثر من حولين، أو قبل كمال النصاب","p":186,"card":"s116"},{"t":"تأخير زكاة الفطر","right":"تكره بعد صلاة العيد، ويحرم تأخيرها عن يوم العيد مع القدرة ويقضيها","wrong":"جعل إخراجها بعد الصلاة محرماً، أو أنها تسقط بخروج يوم العيد","p":183,"card":"s109"},{"t":"الدفع لمن ظنه فقيراً","right":"إن دفعها لمن يظنه فقيراً فبان غنياً أجزأ","wrong":"الخلط بينه وبين من دفعها لغير مستحقها وهو يجهل ثم علم، فهذا لا يجزئه","p":188,"card":"v8229"}],"cases":[{"q":"رجل له أربعون شاة سائمة في بلد، وأربعون في بلد آخر بينهما مسافة قصر، فكم يزكي؟","a":"شاتين؛ لكل محل حكم نفسه","w":["شاة واحدة","لا شيء عليه","ثلاث شياه"],"p":175,"card":"v7398"},{"q":"تاجر حال الحول على بضاعته المعدة للبيع، فكيف يزكيها؟","a":"تقوم بالأحظ للمساكي const SUBJ={fiqh:'الفقه',hadith:'الحديث',aqeedah:'العقيدة',nahw:'النحو',tajweed:'التجويد',tafsir:'التفسير',mithaq:'ميثاق المسجد'};
const EXAM=new Date('2026-10-06T00:00:00+03:00').getTime(), MIN=6e4, DAY=864e5;
const STEPS=['اشرح','اختر','من حفظك','اكتبها'];
const S={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=ms=>ms<DAY?(ms<60*MIN?'بعد قليل':'اليوم'):(()=>{const d=Math.round(ms/DAY);return d===1?'يوم':d===2?'يومين':d+' أيام';})();
const fmtIn=ms=>ms<60*MIN?Math.max(1,Math.round(ms/MIN))+' دقيقة':ms<DAY?Math.round(ms/36e5)+' ساعة':fmt(ms);
const dkey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const $=q=>app.querySelector(q), $$=q=>app.querySelectorAll(q);
const on=(q,f)=>{const e=$(q); if(e) e.onclick=f;};

let tr=S.get('track',null), st={}, X={}, deck=[], sessionStart=0;
const key=()=> 'anki:'+tr, xkey=()=> 'x:'+tr;
const blankX=()=>({star:{},mute:{},log:{},exams:[],mastered:{},u:0});
const save=()=>{S.set(key(),st);push();};
const saveX=()=>{X.u=Date.now();S.set(xkey(),X);push();};

// ===== المزامنة مع حسابك =====
let rdoc=null, rtr=null, rbusy=false, rdirty=false, rtimer=0, synced=false;
async function syncInit(){
  try{
    if(!window.claude||!claude.use||!tr) return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return; const uid=await user.id(); if(!uid) return;
    rtr=tr; rdoc=db.doc('data/users/'+uid+'/anki-'+tr);
    const snap=await rdoc.get(), d=(snap.exists&&snap.data())||{}, remote=d.st||{}, rx=d.x;
    let changed=false, needPush=false;
    for(const [id,r] of Object.entries(remote)){ const l=st[id]; if(!l||(r.u||0)>(l.u||0)){st[id]=r;changed=true;} }
    for(const [id,l] of Object.entries(st)){ const r=remote[id]; if(!r||(l.u||0)>(r.u||0)) needPush=true; }
    if(rx&&(rx.u||0)>(X.u||0)){X=Object.assign(blankX(),rx);changed=true;} else if((X.u||0)>((rx&&rx.u)||0)) needPush=true;
    synced=snap.exists; S.set(key(),st); S.set(xkey(),X);
    if(needPush||!snap.exists) push(true);
    if(changed&&$('.home')) home(); else { const e=$('.sync'); if(e) e.textContent=syncTxt(); }
  }catch(e){}
}
function push(now){
  if(!rdoc||rtr!==tr) return; rdirty=true; clearTimeout(rtimer);
  rtimer=setTimeout(async()=>{ if(rbusy) return; rbusy=true;
    while(rdirty){ rdirty=false; try{ await rdoc.set({st:JSON.parse(JSON.stringify(st)),x:JSON.parse(JSON.stringify(X))}); if(!synced){synced=true; const e=$('.sync'); if(e) e.textContent=syncTxt();} }catch(e){ rdoc=null; synced=false; break; } }
    rbusy=false; }, now?0:1500);
}
const syncTxt=()=>synced?'تقدمك محفوظ في حسابك ✓':'تقدمك محفوظ على هذا الجهاز';

// ===== الإعدادات =====
const lim=()=>S.get('lim','auto');
const PASS=80, FINAL=3;
const daysLeft=()=>Math.max(0,Math.ceil((EXAM-Date.now())/DAY));
const newToday=()=>X.log[dkey()]?.nw||0;
function plan(){ // كم بطاقة جديدة اليوم حتى تخلص كل شي قبل آخر 3 أيام
  const rem=deck.filter(c=>!muted(c)&&!st[c.id]).length, dl=daysLeft(), studyDays=dl-FINAL;
  if(studyDays<=0) return {today:0,left:0,rem,final:true};
  const today=Math.ceil((rem+newToday())/studyDays);
  return {today,left:Math.max(0,today-newToday()),rem,final:false};
}
const newLeft=()=>lim()==='auto'?plan().left:Math.max(0,lim()-sessNew);
const limTxt=()=>lim()==='auto'?plan().today:lim();
const goal=()=>S.get('goal',40);
const skipW=()=>S.get('skipW',false);
const fs=()=>S.get('fs',1);
const applyFs=()=>document.documentElement.style.setProperty('--fs',fs());
const chap=()=>S.get('ch:'+tr,'');
const flt=()=>S.get('flt:'+tr,'all');
// بطاقات الأرقام: جوابها فيه عدد
const NUMRE=/[0-9٠-٩]|(?:^|[\s،(«:؛-])[وبفل]?(?:اثن|ثنت|ثلاث|أربع|خمس|سبع|ثمان|تسع|عشر|مائة|مئة|مائت|مئت|ألف|ثلث|ربع|نصف|شاتان|شاتين|مرتين|مرتان|سابع|ثالث|رابع|سادس|ثامن|تاسع|عاشر|واحدة?(?=$|[\s،.)»؛:])|ست(?:ة|ون|ين)?(?=$|[\s،.)»؛:]))/;
const isNum=c=>NUMRE.test(c.a);

function pick(){
  app.innerHTML=`<div class="pick"><h1>بطاقات الاختبار</h1><p class="sub">الفقه، والحديث، والعقيدة، والنحو، والتفسير، والتجويد، وميثاق المسجد</p>
    <button id="t-imam">إمام</button><button id="t-muadhin">مؤذن</button></div>`;
  on('#t-imam',()=>{tr='imam';S.set('track',tr);load();});
  on('#t-muadhin',()=>{tr='muadhin';S.set('track',tr);load();});
}
let sessNew=0;
function load(){ if(!tr) return pick(); deck=CARDS.filter(c=>tr==='imam'?!c.o:!c.m); st=S.get(key(),{}); X=Object.assign(blankX(),S.get(xkey(),{})); rdoc=null; synced=false; home(); syncInit(); }
const muted=c=>!!X.mute[c.id];
const sub=()=>S.get('sub:'+tr,'');
const marks=()=>MARKS[tr]||{};
const subjects=()=>Object.keys(marks()).filter(k=>deck.some(c=>c.s===k)).sort((a,b)=>marks()[b]-marks()[a]);
const chapters=()=>[...new Set(deck.filter(c=>!sub()||c.s===sub()).map(c=>c.b))];
const tagOf=c=>c.s&&c.s!=='fiqh'?SUBJ[c.s]+' · '+c.b:c.b;
function pool(){
  const ch=chap(), f=flt();
  const sb=sub();
  return deck.filter(c=>!muted(c)&&(!sb||c.s===sb)&&(!ch||c.b===ch)&&(f==='all'||(f==='num'&&isNum(c))||(f==='star'&&X.star[c.id])||(f==='hard'&&(st[c.id]?.bad||0)>0)));
}

// ===== السجل اليومي والهدف =====
let lastAct=0;
function tick(ok){
  const k=dkey(), L=X.log[k]||(X.log[k]={n:0,ok:0,bad:0,sec:0}), now=Date.now();
  L.n++; if(ok===true) L.ok++; if(ok===false) L.bad++;
  if(lastAct) L.sec+=Math.round(Math.min(60e3,now-lastAct)/1000); lastAct=now;
  const ks=Object.keys(X.log).sort(); while(ks.length>40) delete X.log[ks.shift()];
  saveX();
}
function streak(){
  let n=0, t=Date.now(); const g=goal();
  if(!((X.log[dkey(t)]?.n||0)>=g)) t-=DAY; // اليوم ما اكتمل بعد: نحسب من أمس
  while((X.log[dkey(t)]?.n||0)>=g){n++;t-=DAY;}
  return n;
}
function miss(c){ const s=st[c.id]; if(s){s.bad=(s.bad||0)+1; s.u=Date.now();} save(); tick(false); }

// ===== توقع الدرجة =====
// من 100 بحسب درجات المقرر؛ المادة اللي ما لها بطاقات (التفسير) تُحسب 50%
function predict(){
  const M=marks(); let v=0, tot=0;
  for(const k in M){ tot+=M[k]; const cs=deck.filter(c=>c.s===k); v+=M[k]*(cs.length?cs.reduce((a,c)=>a+cardP(c),0)/cs.length:.5); }
  v=100*v/(tot||1);
  const last=X.exams.filter(e=>e.k==='شامل'&&(e.done??e.total)>=35).pop();
  if(last) v=(v+100*last.score/last.total)/2;
  return Math.round(v);
}

const cardP=c=>{ const s=st[c.id]; let p; if(muted(c)) p=.95; else if(!s) p=.15; else if(s.t==='l') p=.45+(s.step||0)*.05; else p=(s.iv||0)>=3?.92:.82; return Math.max(.1,p-Math.min(.3,(s?.bad||0)*.03)); };
function passBox(){
  const v=predict(), gain=.67*100/Math.max(1,deck.length), need=Math.max(0,Math.ceil((PASS-v)/gain));
  const pct=Math.min(100,v);
  return `<div class="set"><div class="topline"><span class="lbl" style="margin:0">عداد النجاح</span><span><b style="font-size:1.4rem;color:var(${v>=PASS?'--accent':'--ink'})">${v}</b> <span class="x">من 100 · النجاح ${PASS}</span></span></div>
    <div class="meter" style="position:relative;height:10px"><i style="width:${pct}%;background:var(${v>=PASS?'--accent':'--warn'})"></i><b style="position:absolute;top:-3px;bottom:-3px;inset-inline-start:80%;width:2px;background:var(--ink)"></b></div>
    <p class="x" style="margin:0">${v>=PASS?'أنت فوق خط النجاح تقريباً ✓ ثبّت اللي عندك.':`باقي لك تقريباً <b>${PASS-v}</b> درجة، يعني تقريباً <b>${need}</b> بطاقة تتقنها.`}</p></div>`;
}
function mapGrid(){
  return `<div class="mapg">${[...new Set(deck.map(c=>c.b))].map(b=>{const cs=deck.filter(c=>c.b===b), p=cs.reduce((a,c)=>a+cardP(c),0)/cs.length, t=Math.max(0,Math.min(1,(p-.15)/.77)), h=Math.round(t*130);
    return `<div style="background:hsl(${h} 55% 42%)"><b>${esc(b)}</b><small>${Math.round(100*t)}%${X.mastered[b]?' ✓':''}</small></div>`;}).join('')}</div>`;
}
// ===== الصفحة الرئيسية =====
function counts(P=pool()){
  const now=Date.now(); let n=0,l=0,r=0,d=0;
  for(const c of P){const s=st[c.id]; if(!s) n++; else if(s.t==='l') l++; else if(s.due<=now) r++; else d++;}
  return {n,l,r,d};
}
