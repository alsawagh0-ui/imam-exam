<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#145C49"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="بطاقات الاختبار"></head><body style="margin:0"><title>بطاقات الاختبار</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --ink:#16211C; --muted:#5A6660; --line:#DDE1DC;
  --accent:#145C49; --accent-ink:#FFFFFF; --soft:#E5EEEA; --bad:#A13A2C; --bad-soft:#F6E6E3;
  --warn:#8A5A12; --warn-soft:#F5EDDD; --blue:#2A5B8C; --blue-soft:#E4ECF4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0F1412; --surface:#161D1A; --ink:#E6ECE8; --muted:#9AA69F; --line:#26302C;
    --accent:#5CB496; --accent-ink:#0B1411; --soft:#1A2B25; --bad:#E48071; --bad-soft:#2B1B18;
    --warn:#D9A75A; --warn-soft:#2A2215; --blue:#7FAEDC; --blue-soft:#17222E;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0F1412; --surface:#161D1A; --ink:#E6ECE8; --muted:#9AA69F; --line:#26302C;
  --accent:#5CB496; --accent-ink:#0B1411; --soft:#1A2B25; --bad:#E48071; --bad-soft:#2B1B18;
  --warn:#D9A75A; --warn-soft:#2A2215; --blue:#7FAEDC; --blue-soft:#17222E;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;direction:rtl;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;min-height:100%;display:flex;flex-direction:column;gap:14px}
button,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick{flex:1;display:grid;align-content:center;gap:14px}
.pick h1{margin:0;font-size:1.5rem}
.pick .sub{margin:0 0 8px;color:var(--muted)}
.pick button{padding:22px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;font-weight:700;text-align:right}
.pick button:hover{border-color:var(--accent)}
.home{flex:1;display:grid;align-content:center;gap:18px}
.home h1{margin:0;font-size:1.4rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stats div{display:grid;gap:2px;padding:14px 8px;text-align:center;border-inline-start:1px solid var(--line)}
.stats div:first-child{border-inline-start:0}
.stats b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}
.c-new b{color:var(--blue)} .c-learn b{color:var(--bad)} .c-rev b{color:var(--accent)} .c-done b{color:var(--muted)}
.big{padding:18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.25rem;font-weight:700}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}
.note{margin:0;color:var(--muted);font-size:.9rem;line-height:1.8;text-align:center}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .cnt{display:flex;gap:10px}
.bar .cnt b{font-weight:700}
.card{flex:1;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--soft);color:var(--accent)}
.tag.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.tag.s0{background:var(--warn-soft);color:var(--warn)} .tag.s1,.tag.s2,.tag.s3{background:var(--bad-soft);color:var(--bad)}
.tag.new{background:var(--blue-soft);color:var(--blue)}
.q{font-size:1.28rem;font-weight:700;line-height:1.7;margin:0;text-wrap:pretty}
.a{border-top:1px solid var(--line);padding-top:14px;font-family:"Noto Naskh Arabic",serif;font-size:1.18rem;line-height:2;white-space:pre-line}
.ex{padding:12px 14px;border-radius:10px;background:var(--warn-soft);line-height:1.9}
.ex b{color:var(--warn)}
.mn{padding:8px 10px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:600;font-size:.95rem}
.x{font-size:.9rem;color:var(--muted);line-height:1.8}
.opts{display:grid;gap:8px}
.opt{text-align:right;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);line-height:1.8}
.opt.right{border-color:var(--accent);background:var(--soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;min-height:120px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);line-height:1.8;resize:vertical}
.score{font-weight:700}
.acts{display:grid;gap:8px;margin-top:auto}
.acts.two{grid-template-columns:1fr 1fr}
.acts.four{grid-template-columns:repeat(4,1fr)}
.acts button{padding:12px 6px;border-radius:10px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;gap:2px}
.acts button small{font-weight:400;font-size:.72rem;color:var(--muted)}
.acts .main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:1.1rem;padding:15px}
.acts .again{color:var(--bad);border-color:var(--bad)}
.acts .hard{color:var(--warn);border-color:var(--warn)}
.acts .good{color:var(--accent);border-color:var(--accent)}
.acts .easy{color:var(--blue);border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.88rem;display:inline-flex;gap:6px;align-items:baseline}
.chips button small{color:var(--muted);font-variant-numeric:tabular-nums}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips button.on small{color:var(--accent-ink);opacity:.8}
.big.alt{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent);font-size:1.1rem;padding:15px}
.lbl{margin:0;font-size:.85rem;font-weight:600;color:var(--muted)}
.sync{margin:0;font-size:.78rem;color:var(--muted);text-align:center}
@media (max-width:380px){.acts.four{grid-template-columns:1fr 1fr}}
.card{font-size:calc(1rem*var(--fs,1))}
.q{font-size:1.28em!important} .a{font-size:1.18em!important}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fsz{display:flex;gap:4px}
.fsz button,.ibtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 10px;font-weight:700}
.banner{padding:12px 14px;border-radius:10px;background:var(--blue-soft);color:var(--blue);font-weight:600;line-height:1.7}
.banner.ok{background:var(--soft);color:var(--accent)}
.goal{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
.goal b{color:var(--ink)}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.chaps{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.chaps button{display:grid;grid-template-columns:minmax(0,1fr) 72px auto;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:8px;background:none;color:var(--ink);text-align:right}
.chaps button.on{background:var(--soft)}
.chaps button span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chaps small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.8rem;min-width:52px;text-align:left}
.chaps .ms{color:var(--accent);font-weight:700}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button{padding:13px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-align:right;display:grid;gap:2px;line-height:1.4}
.tools button small{font-weight:400;color:var(--muted);font-size:.76rem}
.pred{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.pred b{font-size:1.6rem;color:var(--accent);font-variant-numeric:tabular-nums}
.pred span{color:var(--muted);font-size:.85rem}
.page{display:grid;gap:12px;align-content:start}
.page h1{margin:0;font-size:1.3rem}
.back{justify-self:start}
.list{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.row .rq{font-weight:700;line-height:1.7}
.row .ra{font-family:"Noto Naskh Arabic",serif;line-height:1.9;border-top:1px dashed var(--line);padding-top:8px;white-space:pre-line}
.row .rt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted)}
.row .rt button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:7px;padding:3px 9px;font-size:.8rem}
.row .rt .badb{color:var(--bad)}
.inp{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
.tbl th{color:var(--muted);font-weight:600}
.set{display:grid;gap:8px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.set label{display:flex;gap:10px;align-items:center;font-weight:600}
.tfbox{padding:12px 14px;border-radius:10px;border:1px dashed var(--accent);font-family:"Noto Naskh Arabic",serif;font-size:1.12em;line-height:1.9}
.swipehint{text-align:center;font-size:.78rem;color:var(--muted);margin:0}
.mapg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.mapg div{border-radius:10px;padding:12px;color:#fff;display:grid;gap:2px}
.mapg b{font-size:.92rem} .mapg small{opacity:.9;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:6px;height:110px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.spark div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.spark i{width:100%;border-radius:4px 4px 0 0;display:block} .spark small{font-size:.7rem;color:var(--muted)}
.why{padding:10px 12px;border-radius:10px;background:var(--blue-soft);color:var(--ink);line-height:1.8;font-size:.95em}
.why b{color:var(--blue)}
.trap{padding:10px 12px;border-radius:10px;background:var(--bad-soft);line-height:1.8;font-size:.95em}
.trap b{color:var(--bad)}
.node{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.node>span{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.node ul{margin:4px 0 0;padding-inline-start:18px;line-height:1.9}
.pg{font-size:.72rem;color:var(--muted);font-weight:400}
.rule{padding:12px 14px;border-radius:10px;border-inline-start:4px solid var(--accent);background:var(--soft);font-weight:600;line-height:1.8}
.story{position:relative;display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 120px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 22px;overflow:hidden}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.segs i b{display:block;height:100%;width:0;background:var(--accent)}
.segs i.done b{width:100%}
.segs i.now b{animation:seg var(--dur,7s) linear forwards}
.story.paused .segs i.now b{animation-play-state:paused}
@keyframes seg{to{width:100%}}
.story .num{font-size:.8rem;font-weight:700;color:var(--muted)}
.story .hd{font-family:"Noto Naskh Arabic",serif;font-size:1.55em;line-height:1.8;font-weight:600;text-wrap:balance}
.story .who{display:grid;gap:8px}
.story .who div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.story .who span{font-size:.8rem;color:var(--muted);min-width:52px}
.story .who b{font-size:1.15em}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;font-size:.95em}
.pill.both{background:var(--soft);color:var(--accent)} .pill.bk{background:var(--blue-soft);color:var(--blue)} .pill.ms{background:var(--warn-soft);color:var(--warn)} .pill.ot{background:var(--bad-soft);color:var(--bad)}
.story ul{margin:0;padding-inline-start:20px;display:grid;gap:10px;line-height:1.9;font-size:1.08em}
.story .mnb{padding:12px 14px;border-radius:12px;background:var(--soft);color:var(--accent);font-weight:700;line-height:1.8}
.story .tap{position:absolute;top:60px;bottom:90px;width:35%;z-index:1}
.story .tap.l{left:0} .story .tap.r{right:0}
.story .ctl{margin-top:auto;display:flex;gap:8px;justify-content:space-between;align-items:center;position:relative;z-index:2}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cgrid button{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:right;display:grid;gap:4px;line-height:1.5}
.cgrid button b{color:var(--accent);font-size:.8rem}
.cgrid button.seen{border-color:var(--accent);background:var(--soft)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bins button{padding:16px 8px;border-radius:12px;font-weight:700;font-size:1.05rem;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match div{display:grid;gap:8px;align-content:start}
.match button{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:right;line-height:1.5;min-height:52px}
.match button.sel{border-color:var(--accent);background:var(--soft)}
.match button.ok{opacity:.35;border-color:var(--accent)}
.match button.no{border-color:var(--bad);background:var(--bad-soft)}
.home.simple{align-content:start;gap:16px;padding-top:8px}
.today{display:grid;justify-items:center;gap:2px;padding:18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.today b{font-size:3rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.today span{color:var(--muted)}
.menu{display:grid;gap:10px}
.menu button{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:right;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.menu button span{grid-row:1/3;font-size:1.6rem;text-align:center}
.menu button b{font-size:1.1rem} .menu button small{color:var(--muted)}
.mpts{margin:0;padding-inline-start:22px;display:grid;gap:6px;font-family:"Noto Naskh Arabic",serif;font-size:1.12em;line-height:1.8;border-top:1px solid var(--line);padding-top:12px}
.big.small{font-size:1rem;padding:13px}
</style>

<div class="wrap" id="app"></div>

<script>
const CARDS=[{"id":"s1","b":"الطهارة","q":"إلى كم قسم تنقسم المياه؟","a":"ثلاثة: طهور، وطاهر، ونجس.","m":0,"ex":"الماء ثلاث درجات من الأعلى إلى الأدنى: طهور يطهِّر غيره، ثم طاهر نظيف في نفسه لا يطهِّر غيره، ثم نجس لا يُستعمل. احفظها كسلّم نازل: طهور ← طاهر ← نجس.","w":["قسمان: طهور، ونجس.","أربعة: طهور، وطاهر، ومكروه، ونجس.","ثلاثة: طهور، ومستعمل، ونجس."],"s":"fiqh"},{"id":"s2","b":"الطهارة","q":"ما الفرق بين الطاهر والطهور؟ (ما هو الطهور)؟","a":"الطهور: الباقي على خلقته، يرفع الحدث ويزيل الخبث. والطاهر: ما تغير كثير من لونه أو طعمه أو ريحه بشيء طاهر، يجوز استعماله في غير رفع الحدث وزوال الخبث.","m":0,"ex":"الفرق في كلمة واحدة: الطهور «مطهِّر» لأنه باقٍ على خلقته، فيرفع الحدث ويزيل النجاسة. أما الطاهر فتغيّر كثيراً بشيء طاهر، فصار نظيفاً فقط: يُشرب ويُستعمل، لكن لا يرفع حدثاً ولا يزيل خبثاً.","w":["الطهور: ما تغير كثيراً بطاهر يرفع الحدث. والطاهر: الباقي على خلقته لا يرفع الحدث ولا يزيل الخبث.","الطهور: الباقي على خلقته يزيل الخبث فقط. والطاهر: ما تغير كثيراً بطاهر يرفع الحدث ولا يزيل الخبث.","الطهور: الباقي على خلقته يرفع الحدث ويزيل الخبث. والطاهر: ما تغير يسيراً بنجس، يرفع الحدث دون الخبث."],"ca":"الطهور: الباقي على خلقته يرفع الحدث ويزيل الخبث. والطاهر: ما تغير كثيراً بطاهر، لا يرفع حدثاً ولا يزيل خبثاً.","s":"fiqh","y":"الطاهر تغيّر كثير من لونه أو طعمه أو ريحه بشيء طاهر، فلا يُستعمل في رفع الحدث ولا زوال الخبث."},{"id":"s3","b":"الطهارة","q":"ما حكم استعمال آنية الذهب والفضة؟","a":"يحرم اتخاذ واستعمال آنية الذهب والفضة والمموه بهما (يباح كل إناء طاهر إلا هذه).","m":0,"ex":"الأصل أن كل إناء طاهر مباح ولو كان ثميناً، ويُستثنى الذهب والفضة فقط. والتحريم يشمل الاستعمال والاتخاذ (مجرد اقتنائه)، ويشمل حتى المموّه أي المطليّ بهما.","w":["يكره اتخاذ واستعمال آنية الذهب والفضة والمموه بهما (يباح كل إناء طاهر إلا هذه).","يحرم استعمال آنية الذهب والفضة دون اتخاذها، ويباح المموه بهما.","يحرم الأكل والشرب في آنية الذهب والفضة فقط، ويباح اتخاذها واستعمالها في غير ذلك."],"s":"fiqh","y":"الأصل إباحة كل إناء طاهر ولو كان ثميناً، واستثنى الكتاب الذهب والفضة والمموه بهما."},{"id":"s4","b":"الطهارة","q":"هل تصح الطهارة بإناء الذهب والفضة؟","a":"نعم، تصح الطهارة بهما، وبالإناء المغصوب.","m":0,"ex":"فرّق بين الإثم والصحة: استعمال إناء الذهب والفضة حرام يأثم به، لكن الطهارة نفسها صحيحة، لأن التحريم في الإناء لا في الماء. ومثله الإناء المغصوب: حرام والطهارة صحيحة.","w":["لا، لا تصح الطهارة بهما، ولا بالإناء المغصوب.","لا تصح بإناء الذهب والفضة، وتصح بالإناء المغصوب.","تصح بإناء الفضة دون الذهب، ولا تصح بالإناء المغصوب."],"s":"fiqh","y":"التحريم في الاتخاذ والاستعمال، ونصّ الكتاب على أن الطهارة تصح بهما وبالمغصوب."},{"id":"s5","b":"الطهارة","q":"ما هو أقل عدد يجزئ المسح به (في الاستجمار)؟","a":"ثلاث مسحات، تعم كل مسحة المحل؛ ولا يجزئ أقل منها.","m":0,"ex":"الاستجمار له شرطان في العدد والصفة: لا أقل من ثلاث مسحات، وكل مسحة تستوعب المحل كله. فلو نظف المحل بمسحتين لم يكفِ حتى يكمل الثلاث.","w":["مسحتان تعم كل مسحة المحل؛ ولا يجزئ أقل منهما.","مسحة واحدة إن أنقت المحل.","سبع مسحات، تعم كل مسحة المحل؛ ولا يجزئ أقل منها."],"s":"fiqh","y":"الإنقاء بالحجر لا يجزئ فيه أقل من ثلاث مسحات، وكل مسحة تعم المحل."},{"id":"s6","b":"الطهارة","q":"ما حكم استقبال القبلة واستدبارها عند الاستنجاء وقضاء الحاجة؟","a":"يكره استقبال القبلة واستدبارها في الاستنجاء، ويحرمان عند قضاء الحاجة في الصحراء بلا حائل (ويكفي إرخاء ذيله).","m":0,"ex":"الحكم يشتد بحسب الحال: عند الاستنجاء (التنظيف) يُكره فقط، وعند قضاء الحاجة يحرم إذا كان في الصحراء بلا حائل. فإن وُجد حائل ولو إرخاء ذيله زال التحريم. تذكّر: استنجاء = كراهة، قضاء حاجة في فضاء = تحريم.","w":["يحرم استقبال القبلة واستدبارها في الاستنجاء، ويكرهان عند قضاء الحاجة في الصحراء بلا حائل.","يباح استقبال القبلة واستدبارها في الاستنجاء، ويكرهان عند قضاء الحاجة في الصحراء بلا حائل.","يكره استقبال القبلة واستدبارها في الاستنجاء، ويحرمان عند قضاء الحاجة في البنيان ولو بحائل."],"s":"fiqh","y":"الكراهة في الاستنجاء، والتحريم عند قضاء الحاجة في الصحراء بلا حائل."},{"id":"s7","b":"الطهارة","q":"ما حكم من استنجى بروث؟","a":"يحرم (بروث وعظم وطعام ولو لبهيمة)، فإن فعل لم يجزئ بعد ذلك إلا الماء.","m":0,"ex":"الروث والعظم والطعام محترمة أو نجسة فيحرم الاستجمار بها. ومن فعل عوقب بسقوط رخصة الحجارة: لا يجزئه بعدها إلا الماء.","w":["يكره، ويجزئ بعده الاستجمار بالحجارة.","يحرم، لكنه يجزئ إن أنقى المحل.","يحرم، ويجزئ بعده الاستجمار بثلاثة أحجار طاهرة."],"s":"fiqh","y":"الروث مما يحرم الاستنجاء به، ومن فعل ذلك لم يجزئه بعده إلا الماء."},{"id":"s8","b":"الطهارة","q":"اذكر ثلاث أو خمس أوقات يتأكد فيها استخدام السواك؟","a":"عند: وضوء، وصلاة، وقراءة، وانتباه من نوم، وتغير رائحة فم، ودخول مسجد ومنزل، وإطالة سكوت، وصفرة أسنان.","m":0,"mn":"و ص ق ن ر م س ص: وضوء صلاة قراءة نوم رائحة مسجد/منزل سكوت صفرة","ex":"اربطها بفكرة واحدة: السواك يتأكد عند كل تغيّر في الفم أو عند مناجاة الله. للعبادة: وضوء، صلاة، قراءة. لتغيّر الفم: نوم، رائحة، سكوت طويل، صفرة أسنان. وللدخول: مسجد ومنزل.","w":["عند: وضوء، وصلاة، وأكل، وشرب، وخروج من المنزل.","عند: صلاة، وقراءة، وبعد الزوال للصائم، وخروج من المسجد، ونوم.","عند: غسل، وتيمم، وأذان، وأكل، وسفر."],"ca":"عند: وضوء، وصلاة، وقراءة، وانتباه من نوم، وتغير رائحة فم.","s":"fiqh"},{"id":"s9","b":"الطهارة","q":"ما حكم السواك بعد الزوال؟","a":"مسنون مطلقاً إلا بعد الزوال للصائم فيكره.","m":0,"ex":"السواك سنة في كل وقت، ويُستثنى الصائم بعد الزوال فيكره له. وقبل الزوال يبقى في حقه سنة كغيره.","w":["مسنون مطلقاً حتى بعد الزوال للصائم.","يحرم بعد الزوال للصائم.","يكره بعد الزوال لكل أحد صائماً أو مفطراً."],"s":"fiqh","y":"السواك مسنون مطلقاً، والمستثنى الصائم بعد الزوال فيكره له."},{"id":"s10","b":"الطهارة","q":"ما حكم الختان للذكور والإناث؟","a":"واجب على الذكر والأنثى عند البلوغ، وقبله أفضل.","m":0,"ex":"الختان في المذهب واجب، ونصّ الكتاب: «والختان واجب».","w":["واجب على الذكر، سنة للأنثى، عند البلوغ.","سنة للذكر والأنثى، وقبل البلوغ أفضل.","واجب على الذكر والأنثى في اليوم السابع من الولادة."],"s":"fiqh","y":"الختان واجب على الذكر والأنثى، ووقت وجوبه البلوغ، وقبله أفضل."},{"id":"s11","b":"الطهارة","q":"ما حكم التسمية في الوضوء؟","a":"تجب، وتسقط سهواً، وإن ذكرها في أثنائه ابتدأ.","m":0,"ex":"التسمية واجب خفيف: تجب مع الذكر وتسقط بالنسيان. فإن تذكرها في أثناء الوضوء لم يكمل، بل يبدأ من جديد ليكون الوضوء كله بعد التسمية.","w":["تسن، ولا شيء على من تركها عمداً أو سهواً.","تجب، ولا تسقط سهواً، فإن تركها أعاد الوضوء.","تجب، وتسقط سهواً، وإن ذكرها في أثنائه سمّى وأكمل."],"s":"fiqh","y":"التسمية واجبة تسقط بالسهو، فإن ذكرها في أثناء الوضوء ابتدأ."},{"id":"s12","b":"الطهارة","q":"اذكر فروض الوضوء؟","a":"ستة: غسل الوجه ومنه المضمضة والاستنشاق، وغسل اليدين مع المرفقين، ومسح الرأس كله ومنه الأذنان، وغسل الرجلين مع الكعبين، والترتيب، والموالاة.","m":0,"ex":"ستة: أربعة أعضاء بترتيب الآية (وجه، يدان، رأس، رجلان)، ومعها صفتان: الترتيب والموالاة. والفم والأنف تابعان للوجه، والأذنان تابعتان للرأس.","w":["ستة: غسل الوجه، واليدين، ومسح الرأس، وغسل الرجلين، والترتيب، والنية.","خمسة: غسل الوجه، واليدين، ومسح الرأس، وغسل الرجلين، والترتيب.","ستة: غسل الوجه، واليدين، ومسح الرأس، وغسل الرجلين، والموالاة، والتسمية."],"ca":"ستة: غسل الوجه، واليدين، ومسح الرأس، وغسل الرجلين، والترتيب، والموالاة.","s":"fiqh"},{"id":"s13","b":"الطهارة","q":"كم عدد شروط الوضوء؟","a":"ثمانية: انقطاع ما يوجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله، والاستنجاء أو الاستجمار.","m":0,"ex":"ثمانية: ثلاثة في الشخص (إسلام، عقل، تمييز)، وثلاثة قبله (انقطاع الموجب، الاستنجاء، إزالة المانع)، ثم النية، والماء الطهور المباح. وشروط الغسل هي نفسها بلا الاستنجاء فتصير سبعة.","w":["سبعة: انقطاع موجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله.","ثمانية: انقطاع موجبه، والنية، والإسلام، والعقل، والبلوغ، والماء الطهور المباح، وإزالة ما يمنع وصوله، والاستنجاء.","ثمانية: انقطاع موجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور، ودخول الوقت، والاستنجاء أو الاستجمار."],"ca":"ثمانية: انقطاع موجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله، والاستنجاء أو الاستجمار.","s":"fiqh"},{"id":"s14","b":"الطهارة","q":"اذكر خمسة أمثلة من سنن الوضوء؟","a":"(سننه ثمان عشرة) منها: استقبال القبلة، والسواك، وغسل الكفين ثلاثاً، والبداءة بالمضمضة والاستنشاق، والمبالغة فيهما لغير صائم، وتخليل اللحية الكثيفة والأصابع، وأخذ ماء جديد للأذنين، وتقديم اليمنى على اليسرى، والغسلة الثانية والثالثة.","m":0,"ex":"السنن أشياء تكمّل الوضوء: قبله (قبلة، سواك، غسل الكفين)، وفي صفته (بدء بالمضمضة، مبالغة لغير صائم، تخليل، ماء جديد للأذنين، تيامن)، وفي عدده (الغسلة الثانية والثالثة). وعددها ثماني عشرة.","w":["منها: استقبال القبلة، والسواك، وغسل الكفين ثلاثاً، والترتيب، والموالاة.","منها: التسمية، والسواك، وغسل الكفين ثلاثاً، والمبالغة في المضمضة للصائم، ومسح الرأس كله.","منها: النية، والسواك، وغسل الكفين ثلاثاً، وتخليل الأصابع، وتقديم اليسرى على اليمنى."],"ca":"منها: استقبال القبلة، والسواك، وغسل الكفين ثلاثاً، وتخليل الأصابع، وتقديم اليمنى على اليسرى.","s":"fiqh"},{"id":"s15","b":"الطهارة","q":"ما هي شروط المسح الخفين والجوارب؟","a":"سبعة: لبسهما بعد كمال الطهارة بالماء، وسترهما لمحل الفرض ولو بربطهما، وإمكان المشي بهما عرفاً، وثبوتهما بنفسهما، وإباحتهما، وطهارة عينهما، وعدم وصفهما البشرة.","m":0,"ex":"سبعة شروط تدور على ثلاثة أمور: متى لبسه (بعد كمال الطهارة بالماء)، وصفة الخف نفسه (ساتر، يمكن المشي به، ثابت بنفسه، لا يصف البشرة)، وحكمه (مباح وطاهر العين).","w":["سبعة: لبسهما بعد كمال الطهارة ولو بالتيمم، وسترهما محل الفرض، وإمكان المشي بهما، وثبوتهما بنفسهما، وإباحتهما، وطهارتهما، وعدم وصفهما البشرة.","ستة: لبسهما بعد كمال الطهارة بالماء، وسترهما محل الفرض، وإمكان المشي بهما، وإباحتهما، وطهارتهما، وعدم وصفهما البشرة.","سبعة: لبسهما بعد كمال الطهارة بالماء، وسترهما محل الفرض، وإمكان المشي بهما، وثبوتهما بنفسهما، وإباحتهما، وطهارتهما، وأن يكونا من جلد."],"ca":"سبعة: لبسهما بعد كمال الطهارة بالماء، وسترهما محل الفرض، وإمكان المشي بهما، وثبوتهما بنفسهما، وإباحتهما، وطهارتهما، وعدم وصفهما البشرة.","s":"fiqh"},{"id":"s16","b":"الطهارة","q":"رجل توضأ فغسل رجله اليمنى ثم لبس الجورب، ثم غسل اليسرى فلبس الجورب، ما حكم وضوئه أو مسحه؟","a":"وضوؤه صحيح، لكن لا يصح المسح عليهما؛ لأنه لم يلبسهما بعد كمال الطهارة بالماء.","m":0,"n":"الذي لا يصح هو المسح لا الوضوء","ex":"الوضوء صحيح لأنه غسل كل الأعضاء بترتيب. لكن الشرط الأول للمسح «لبسهما بعد كمال الطهارة»، وهو لبس اليمنى قبل أن يغسل اليسرى، أي قبل أن تكتمل طهارته، فلا يمسح.","w":["وضوؤه صحيح، ويصح المسح عليهما؛ لأنه لبس كل رجل بعد غسلها.","وضوؤه باطل؛ لأنه فصل بين غسل الرجلين باللبس.","وضوؤه صحيح، ويصح المسح على اليسرى دون اليمنى."],"s":"fiqh","y":"أول شروط المسح لبسهما بعد كمال الطهارة بالماء، وهو لبس اليمنى قبل غسل اليسرى."},{"id":"s17","b":"الطهارة","q":"كم مدة المسح؟","a":"المقيم والعاصي بسفره: يوم وليلة، والمسافر: ثلاثة أيام بلياليهن، من الحدث بعد اللبس.","m":0,"ex":"المسافر يُخفَّف عليه فمدته ثلاثة أيام، والمقيم يوم وليلة. ومن سافر سفر معصية لا يأخذ رخصة المسافر فيعامل كالمقيم. وتبدأ المدة من أول حدث بعد اللبس، لا من اللبس ولا من أول مسح.","w":["المقيم: يوم وليلة، والمسافر والعاصي بسفره: ثلاثة أيام بلياليهن، من الحدث بعد اللبس.","المقيم والعاصي بسفره: يوم وليلة، والمسافر: ثلاثة أيام بلياليهن، من وقت اللبس.","المقيم: ثلاثة أيام، والمسافر: يوم وليلة، من أول مسح بعد اللبس."],"s":"fiqh","y":"المدة تبدأ من الحدث بعد اللبس، لا من وقت اللبس."},{"id":"s18","b":"الطهارة","q":"متى يبطل المسح؟","a":"إذا حصل ما يوجب الغسل، أو ظهر بعض محل الفرض، أو انقضت المدة: بطل الوضوء.","m":0,"ex":"ثلاثة أسباب: حدث أكبر يوجب الغسل فيلزم نزع الخف، أو ظهور شيء من القدم فزال الستر، أو انتهاء المدة. وإذا حصل أحدها بطل الوضوء كله لا المسح فقط.","w":["إذا حصل ما يوجب الوضوء، أو ظهر بعض محل الفرض، أو انقضت المدة: بطل المسح وبقي الوضوء.","إذا حصل ما يوجب الغسل، أو ظهر بعض محل الفرض، أو انقضت المدة: يغسل رجليه فقط.","إذا حصل ما يوجب الغسل، أو خلع أحد الخفين، أو سافر: بطل الوضوء."],"s":"fiqh"},{"id":"s19","b":"الطهارة","q":"متى يجب التيمم على صاحب الجبيرة؟","a":"إذا لم يضعها على طهارة (فيغسل الصحيح ويتيمم لها)، أو وضعها على طهارة وتجاوزت المحل (فيغسل ويمسح ويتيمم). فإن وضعها على طهارة ولم تتجاوز المحل: غسل الصحيح ومسح عليها وأجزأ.","m":0,"ex":"التيمم يأتي لتعويض ما فات: إن لم يضعها على طهارة فالمسح لا يكفي فيتيمم. وإن وضعها على طهارة لكنها زادت عن موضع الحاجة فيمسح ويتيمم للزائد. وإن وضعها على طهارة ولم تتجاوز: يكفي المسح.","w":["إذا وضعها على طهارة ولم تتجاوز المحل. فإن لم يضعها على طهارة: مسح عليها وأجزأ.","يجب التيمم لها في كل حال، ولا يمسح عليها.","إذا تجاوزت المحل فقط، ولا يضر وضعها على غير طهارة."],"ca":"إذا لم يضعها على طهارة، أو وضعها على طهارة وتجاوزت المحل. فإن وضعها على طهارة ولم تتجاوز: مسح عليها وأجزأ.","s":"fiqh","y":"المسح وحده يجزئ إذا وضعها على طهارة ولم تتجاوز المحل، وإلا وجب التيمم."},{"id":"s20","b":"الطهارة","q":"اذكر نواقض الوضوء (أو خمسة منها)؟","a":"ثمانية: الخارج من السبيلين، وخروج النجاسة من بقية البدن (البول والغائط مطلقاً، وغيرهما إن فحش)، وزوال العقل أو تغطيته، ومس الفرج بيده بلا حائل، ولمس الذكر الأنثى أو العكس لشهوة بلا حائل، وغسل الميت، وأكل لحم الإبل، والردة.","m":0,"mn":"سَبيلان، نجاسة، عقل، مس، لمس، ميت، إبل، ردة","ex":"ثمانية: اثنان في الخارج (من السبيلين، ومن بقية البدن)، وواحد في العقل، واثنان في اللمس (مس الفرج، ولمس الجنس الآخر لشهوة)، ثم غسل الميت، ولحم الإبل، والردة.","w":["ثمانية: الخارج من السبيلين، وخروج النجاسة من البدن، وزوال العقل، ومس الفرج، ولمس المرأة لشهوة، وحمل الميت، وأكل لحم الإبل، والردة.","ثمانية: الخارج من السبيلين، وخروج النجاسة من البدن، وزوال العقل، ومس الفرج، ولمس المرأة لشهوة، وغسل الميت، وأكل لحم الغنم، والردة.","ثمانية: الخارج من السبيلين، والقهقهة، وزوال العقل، ومس الفرج، ولمس المرأة لشهوة، وغسل الميت، وأكل لحم الإبل، والردة."],"ca":"ثمانية: الخارج من السبيلين، وخروج النجاسة من البدن، وزوال العقل، ومس الفرج، ولمس المرأة لشهوة، وغسل الميت، وأكل لحم الإبل، والردة.","s":"fiqh"},{"id":"s21","b":"الطهارة","q":"متى ينتقض الوضوء بلمس المرأة؟","a":"إذا لمس بشرتها لشهوة، من غير حائل.","m":0,"ex":"قيدان يجب اجتماعهما: شهوة، وبلا حائل (بشرة ببشرة). فاللمس بلا شهوة لا ينقض، واللمس من وراء ثوب لا ينقض ولو بشهوة.","w":["إذا لمس بشرتها مطلقاً، بشهوة أو بغير شهوة.","إذا لمسها لشهوة ولو من وراء حائل.","إذا لمس بشرتها بغير شهوة من غير حائل."],"s":"fiqh","y":"لمس المرأة ينقض بقيدين في الكتاب: أن يكون لشهوة، ومن غير حائل."},{"id":"s22","b":"الطهارة","q":"متى ينتقض الوضوء بلمس ذكره؟","a":"إذا مسه بيده (لا ظفره) بلا حائل.","m":0,"ex":"الناقض مسّ باليد نفسها مباشرة بلا حائل. فالظفر لا يُعد يداً في هذا، والمسّ من وراء ثوب لا ينقض. ولا يُشترط هنا الشهوة بخلاف لمس المرأة.","w":["إذا مسه بيده لشهوة، ولو من وراء حائل.","إذا مسه بيده أو ظفره ولو بحائل.","إذا مسه بيده لشهوة فقط، بلا حائل."],"s":"fiqh","y":"الناقض مسه بيده لا ظفره، وأن يكون بلا حائل."},{"id":"s23","b":"الطهارة","q":"إذا شك في الطهارة ماذا يفعل الشاك؟","a":"من تيقن الطهارة وشك في الحدث، أو تيقن الحدث وشك في الطهارة: عمل بما تيقن.","m":0,"ex":"القاعدة: اليقين لا يزول بالشك. فمن كان متيقناً من شيء (طهارة أو حدث) بقي عليه ولا يلتفت إلى الشك الطارئ.","w":["من تيقن الطهارة وشك في الحدث: توضأ احتياطاً، ومن تيقن الحدث وشك في الطهارة: عمل بما تيقن.","يعمل بغلبة ظنه في الحالين.","من تيقن الطهارة وشك في الحدث، أو تيقن الحدث وشك في الطهارة: عمل بالشك."],"s":"fiqh","y":"الكتاب يأمر بالعمل بما تيقن، فلا يرفع اليقين بالشك."},{"id":"s24","b":"الطهارة","q":"ماذا يحرم على المحدث؟","a":"الصلاة، والطواف، ومس المصحف ببشرته بلا حائل. ويزيد من عليه غسل: قراءة القرآن، واللبث في المسجد بلا وضوء.","m":0,"ex":"المحدث حدثاً أصغر ممنوع من ثلاثة: الصلاة، والطواف، ومس المصحف. والجنب أشد حدثاً فيزيد عليه اثنان: قراءة القرآن، والمكث في المسجد إلا إن توضأ.","w":["الصلاة، والطواف، وقراءة القرآن. ويزيد من عليه غسل: مس المصحف، واللبث في المسجد.","الصلاة، ومس المصحف فقط. ويزيد من عليه غسل: الطواف، وقراءة القرآن.","الصلاة، والطواف، ومس المصحف، واللبث في المسجد. ويزيد من عليه غسل: الصوم."],"ca":"الصلاة، والطواف، ومس المصحف. ويزيد من عليه غسل: قراءة القرآن، واللبث في المسجد بلا وضوء.","s":"fiqh","y":"من عليه غسل يحرم عليه ما يحرم على المحدث، ويزيد القراءة واللبث في المسجد بلا وضوء."},{"id":"s25","b":"الطهارة","q":"ما هي موجبات (أسباب) الغسل؟","a":"سبعة: انتقال المني، وخروجه، وتغييب الحشفة في فرج، وإسلام الكافر، وخروج الحيض، وخروج دم النفاس، والموت.","m":0,"ex":"سبعة: ثلاثة للجنابة (انتقال المني، خروجه، تغييب الحشفة)، واثنان للنساء (حيض ونفاس)، ثم إسلام الكافر، والموت. تذكّر: جنابة ٣ + نساء ٢ + إسلام + موت.","w":["سبعة: انتقال المني، وخروجه، وتغييب الحشفة، وإسلام الكافر، والحيض، والنفاس، والاستحاضة.","سبعة: انتقال المني، وخروجه، وتغييب الحشفة، وإسلام الكافر، والحيض، والنفاس، والإغماء.","ستة: خروج المني، وتغييب الحشفة، وإسلام الكافر، والحيض، والنفاس، والموت."],"ca":"سبعة: انتقال المني، وخروجه، وتغييب الحشفة، وإسلام الكافر، والحيض، والنفاس، والموت.","s":"fiqh"},{"id":"s26","b":"الطهارة","q":"كم عدد شروط الغسل؟","a":"سبعة: انقطاع ما يوجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله.","m":0,"ex":"هي شروط الوضوء نفسها ناقصة شرطاً واحداً: الاستنجاء أو الاستجمار. فالوضوء ثمانية والغسل سبعة.","w":["ثمانية: انقطاع موجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله، والاستنجاء.","سبعة: انقطاع موجبه، والنية، والإسلام، والعقل، والبلوغ، والماء الطهور المباح، وإزالة ما يمنع وصوله.","ستة: النية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله."],"ca":"سبعة: انقطاع موجبه، والنية، والإسلام، والعقل، والتمييز، والماء الطهور المباح، وإزالة ما يمنع وصوله.","s":"fiqh"},{"id":"s27","b":"الطهارة","q":"ينقسم الغسل لقسمين: فرض وكمال، وضح ذلك؟","a":"فرضه: أن يعم بالماء جميع بدنه وداخل فمه وأنفه، حتى ما يظهر من فرج المرأة عند القعود لحاجتها، وحتى باطن شعرها. وسننه (الكمال): الوضوء قبله، وإزالة ما لوثه من أذى، وإفراغ الماء على رأسه ثلاثاً وعلى بقية جسده ثلاثاً، والتيامن، والموالاة، وإمرار اليد على الجسد، وإعادة غسل رجليه بمكان آخر.","m":0,"ex":"الفرض شيء واحد: تعميم البدن كله بالماء، حتى الفم والأنف وباطن الشعر. وما زاد فهو كمال: وضوء قبله، وإزالة الأذى، والتثليث، والتيامن، والموالاة، ودلك الجسد، وغسل الرجلين في مكان آخر.","w":["فرضه: الوضوء، ثم تعميم البدن بالماء. وكماله: المضمضة والاستنشاق، والتثليث، والتيامن، والدلك.","فرضه: تعميم البدن بالماء ثلاثاً. وكماله: الوضوء قبله، والمضمضة والاستنشاق، والتيامن، والدلك.","فرضه: تعميم البدن بالماء مع الفم والأنف ودلكه. وكماله: الوضوء قبله، وإزالة الأذى، والتثليث، والتيامن."],"ca":"فرضه: تعميم البدن بالماء مع الفم والأنف. وكماله: الوضوء قبله، وإزالة الأذى، والتثليث، والتيامن، والدلك.","s":"fiqh"},{"id":"s28","b":"الطهارة","q":"اذكر خمسة أمثلة من الأغسال المستحبة؟","a":"(ستة عشر) منها: لصلاة جمعة، ولغسل ميت، ولعيد، ولكسوف، واستسقاء، وجنون، وإغماء، واستحاضة لكل صلاة، وإحرام، ودخول مكة، وحرمها، ووقوف بعرفة، وطواف زيارة، وطواف وداع، ومبيت بمزدلفة، ورمي جمار.","m":0,"n":"«غسل ميت» في الكتاب: الاغتسال لمن غسّل ميتاً","ex":"ستة عشر غسلاً، اجمعها في ثلاث مجموعات: صلوات (جمعة، عيد، كسوف، استسقاء)، وأحوال (غسل ميت، جنون، إغماء، استحاضة)، وحج (إحرام، دخول مكة وحرمها، عرفة، طوافان، مزدلفة، رمي).","w":["منها: لصلاة جمعة، ولغسل ميت، ولعيد، ولخروج المني، ولإحرام.","منها: لصلاة جمعة، ولعيد، ولإسلام الكافر، وللحيض، ولإحرام.","منها: لكل صلاة فريضة، ولعيد، ولكسوف، ولأكل لحم الإبل، ولإحرام."],"ca":"منها: لصلاة جمعة، ولغسل ميت، ولعيد، ولكسوف، ولإحرام.","s":"fiqh"},{"id":"s29","b":"الطهارة","q":"كم عدد شروط صحة التيمم؟","a":"ثمانية: النية، والإسلام، والعقل، والتمييز، والاستنجاء أو الاستجمار، ودخول وقت الصلاة، وتعذر استعمال الماء، وأن يكون بتراب طهور مباح غير محترق له غبار يعلق باليد.","m":0,"ex":"ثمانية: أربعة مشتركة مع الوضوء (نية، إسلام، عقل، تمييز) والاستنجاء، ثم ثلاثة خاصة بالتيمم: دخول الوقت، وتعذر الماء، والتراب الطهور المباح الذي له غبار.","w":["ثمانية: النية، والإسلام، والعقل، والتمييز، والاستنجاء، ودخول الوقت، وتعذر الماء، والتراب أو الحجر ولو بلا غبار.","سبعة: النية، والإسلام، والعقل، والتمييز، والاستنجاء، وتعذر الماء، والتراب الطهور المباح.","ثمانية: النية، والإسلام، والعقل، والبلوغ، والاستنجاء، ودخول الوقت، وتعذر الماء، والتراب الطهور المباح."],"ca":"ثمانية: النية، والإسلام، والعقل، والتمييز، والاستنجاء، ودخول الوقت، وتعذر الماء، والتراب الطهور المباح له غبار.","s":"fiqh","y":"دخول الوقت شرط، فلا يصح التيمم لصلاة قبل وقتها."},{"id":"s30","b":"الطهارة","q":"في أي الأعمال تجب التسمية في الطهارة؟","a":"في الوضوء، والغسل، والتيمم (وتسقط سهواً).","m":0,"ex":"التسمية واجبة في الطهارات الثلاث الحدثية كلها: وضوء، وغسل، وتيمم. وحكمها واحد فيها: تسقط بالسهو.","w":["في الوضوء فقط (وتسقط سهواً).","في الوضوء والغسل دون التيمم (وتسقط سهواً).","في الوضوء، والغسل، والتيمم (ولا تسقط سهواً)."],"s":"fiqh","y":"التسمية تجب في الوضوء، وهي واجب الغسل، وواجب التيمم."},{"id":"s31","b":"الطهارة","q":"اذكر فروض التيمم؟","a":"خمسة: مسح الوجه، ومسح اليدين إلى الكوعين، والترتيب في الطهارة الصغرى، والموالاة، وتعيين النية لما يتيمم له من حدث أو نجاسة.","m":0,"ex":"خمسة: عضوان فقط (الوجه، واليدان إلى الكوعين أي الرسغين لا المرفقين)، ثم الترتيب والموالاة كالوضوء، ويزيد التيمم فرضاً خاصاً: تعيين النية لما يتيمم له. والترتيب في الحدث الأصغر فقط.","w":["خمسة: مسح الوجه، ومسح اليدين إلى المرفقين، والترتيب في الطهارة الصغرى، والموالاة، وتعيين النية.","أربعة: مسح الوجه، ومسح اليدين إلى الكوعين، والترتيب، والموالاة.","خمسة: مسح الوجه، ومسح اليدين إلى الكوعين، والترتيب في الطهارة الكبرى والصغرى، والموالاة، والتسمية."],"s":"fiqh"},{"id":"s32","b":"الطهارة","q":"اذكر ثلاثة من مبطلات التيمم؟","a":"خمسة: ما أبطل الوضوء، ووجود الماء، وخروج الوقت، وزوال المبيح له، وخلع ما مسح عليه.","m":0,"ex":"التيمم بدل عن الماء، فيبطل بما يبطل الأصل (نواقض الوضوء)، ويبطل إذا زال سبب البدل: وجود الماء، أو زوال العذر المبيح. ولأنه مؤقت يبطل بخروج الوقت، وبخلع ما مسح عليه.","w":["خمسة: ما أبطل الوضوء، ووجود الماء، وخروج الوقت، والكلام، وخلع ما مسح عليه.","ثلاثة: ما أبطل الوضوء، ووجود الماء، والكلام.","خمسة: ما أبطل الوضوء، ووجود التراب، وخروج الوقت، وزوال المبيح له، والسفر."],"s":"fiqh"},{"id":"s33","b":"الطهارة","q":"ما هي صفة التيمم الصحيحة؟ وإذا مسح يديه قبل وجهه هل يصح؟","a":"ينوي ثم يسمي، ويضرب التراب بيديه مفرجتي الأصابع ضربة واحدة (والأحوط اثنتان) بعد نزع خاتم ونحوه، فيمسح وجهه بباطن أصابعه، وكفيه براحتيه. وإن مسح يديه قبل وجهه لم يصح؛ لأن الترتيب فرض في الطهارة الصغرى.","m":0,"ex":"الترتيب: نية، تسمية، ضربة، ثم الوجه أولاً ثم الكفان. والوجه قبل اليدين لأن الترتيب فرض في التيمم عن الحدث الأصغر كالوضوء، فمن عكس لم يصح تيممه.","w":["ينوي ويسمي، ويضرب التراب ضربة واحدة، فيمسح وجهه ثم كفيه. وإن قدّم يديه صح؛ لأن الترتيب سنة في التيمم.","ينوي ويسمي، ويضرب التراب ثلاث ضربات، فيمسح وجهه ثم ذراعيه إلى المرفقين. وإن قدّم يديه لم يصح.","ينوي ويسمي، ويضرب التراب ضربة واحدة، فيمسح كفيه ثم وجهه. وإن قدّم وجهه لم يصح."],"ca":"ينوي ويسمي، ويضرب التراب ضربة واحدة، فيمسح وجهه ثم كفيه. وإن قدّم يديه لم يصح؛ لأن الترتيب فرض في الطهارة الصغرى.","s":"fiqh","y":"الترتيب فرض في الطهارة الصغرى، ومن مسح يديه قبل وجهه لم يرتب."},{"id":"s34","b":"الطهارة","q":"(لغز) رجل في الصلاة نهق حماره فبطلت صلاته، ليش؟","a":"لأنه صلى بالتيمم، فعلم بنهيق حماره وصول الماء؛ «وإن وجد الماء وهو في الصلاة بطلت».","m":0,"ex":"السرّ في التيمم: من وجد الماء وهو في الصلاة بطلت صلاته لأن عذره زال. فنهيق الحمار دلّه على وصول الماء، فبطل تيممه وصلاته.","w":["لأن نهيق الحمار يقطع الصلاة إذا مرّ بين يديه.","لأنه التفت إلى حماره بلا حاجة فبطلت صلاته.","لأنه ضحك من نهيق حماره فقهقه في صلاته."],"s":"fiqh","y":"وجود الماء من مبطلات التيمم، ومن وجده وهو في الصلاة بطلت."},{"id":"s35","b":"الطهارة","q":"كلب ولغ في إناء كيف يطهر؟","a":"سبع غسلات، إحداها بتراب طاهر أو صابون ونحوه.","m":0,"ex":"نجاسة الكلب مغلّظة: سبع غسلات، وواحدة منها لا بد أن تكون بالتراب، ويقوم مقامه الصابون ونحوه. تذكّر: سبع + تراب.","w":["ثلاث غسلات، إحداها بتراب طاهر.","سبع غسلات، بلا تراب.","ثمان غسلات، الثامنة بتراب طاهر."],"s":"fiqh","y":"كل متنجس سبع غسلات، ويزيد الكلب والخنزير أن تكون إحداها بتراب أو صابون ونحوه."},{"id":"s36","b":"الطهارة","q":"ما الفرق بين غسل نجاسة الجارية (الأنثى) وغسل بول الغلام (الذي لم يأكل الطعام لشهوة)؟","a":"بول الجارية كسائر النجاسات: يغسل سبع غسلات. وبول الغلام الذي لم يأكل الطعام لشهوة: يجزئ نضحه، وهو غمره بالماء.","m":0,"ex":"رُخِّص في بول الغلام الصغير الذي لم يأكل الطعام بشهوة، فيكفي نضحه أي غمره بالماء بلا عصر ولا غسل. أما الجارية فلا رخصة لها: بولها كسائر النجاسات يُغسل سبعاً.","w":["بول الغلام كسائر النجاسات يغسل سبعاً، وبول الجارية التي لم تأكل الطعام يجزئ نضحه.","بولهما سواء: يجزئ نضحهما ما لم يأكلا الطعام لشهوة.","بول الجارية يغسل ثلاثاً، وبول الغلام الذي لم يأكل الطعام لشهوة يغسل مرة واحدة."],"s":"fiqh","y":"النضح خاص ببول غلام لم يأكل الطعام لشهوة، والجارية على الأصل: سبع غسلات."},{"id":"s37","b":"الطهارة","q":"ما أقل وأكثر سن الحيض؟ وما أقل وأكثر مدته؟","a":"لا حيض قبل تمام تسع سنين ولا بعد خمسين سنة. أقله يوم وليلة، وأكثره خمسة عشر يوماً (وغالبه ست أو سبع).","m":0,"ex":"احفظ الأرقام أزواجاً: السن من ٩ إلى ٥٠ سنة، والمدة من يوم وليلة إلى ١٥ يوماً، والغالب ٦ أو ٧. فما قبل التسع وبعد الخمسين ليس حيضاً، وما زاد على ١٥ استحاضة.","w":["لا حيض قبل تمام تسع سنين ولا بعد ستين سنة. أقله ثلاثة أيام، وأكثره عشرة أيام.","لا حيض قبل تمام اثنتي عشرة سنة ولا بعد خمسين. أقله يوم وليلة، وأكثره خمسة عشر يوماً.","لا حيض قبل تمام تسع سنين ولا بعد خمسين سنة. أقله يوم وليلة، وأكثره سبعة عشر يوماً."],"s":"fiqh"},{"id":"s38","b":"الطهارة","q":"اذكر خمسة أشياء تحرم بالحيض؟","a":"الوطء في الفرج، والطلاق، والصلاة، والصوم، والطواف، وقراءة القرآن، ومس المصحف، واللبث في المسجد، والمرور فيه إن خافت تلويثه.","m":0,"ex":"اجمعها في ثلاث: عبادات (صلاة، صوم، طواف، قراءة، مس المصحف)، والمسجد (لبث، ومرور إن خافت التلويث)، والزوجية (الوطء في الفرج، والطلاق).","w":["الوطء في الفرج، والصلاة، والصوم، والذكر، والدعاء.","الاستمتاع بما دون الفرج، والصلاة، والصوم، والطواف، والإحرام.","الصلاة، والصوم، والطواف، والوضوء، والخروج من البيت."],"ca":"الوطء في الفرج، والطلاق، والصلاة، والصوم، والطواف.","s":"fiqh"},{"id":"s39","b":"الطهارة","q":"امرأة مضى عليها أكثر من 15 يوماً وينزل عليها الدم، ماذا تفعل؟","a":"هي مستحاضة: تجلس من كل شهر ستاً أو سبعاً (حيث لا تمييز)، ثم تغتسل، وتصوم وتصلي بعد غسل المحل وتعصيبه، وتتوضأ لوقت كل صلاة.","m":0,"ex":"ما زاد على أكثر الحيض (١٥ يوماً) ليس حيضاً بل استحاضة. فإن لم تميّز دمها جلست عادة غالب النساء ستاً أو سبعاً، ثم تغتسل وتعيش كالطاهرة، مع غسل المحل وعصبه والوضوء لوقت كل صلاة.","w":["هي حائض: تترك الصلاة والصوم حتى ينقطع الدم.","هي مستحاضة: تجلس خمسة عشر يوماً من كل شهر ثم تغتسل، وتصلي بوضوء واحد لكل يوم.","هي مستحاضة: لا تجلس شيئاً، وتغتسل لكل صلاة."],"ca":"هي مستحاضة: تجلس ستاً أو سبعاً ثم تغتسل، وتصوم وتصلي بعد غسل المحل وتعصيبه، وتتوضأ لوقت كل صلاة.","s":"fiqh","y":"أكثر الحيض خمسة عشر يوماً، فمن جاوز دمها ذلك فهي مستحاضة."},{"id":"s40","b":"الطهارة","q":"من كان حدثه دائم (كسلس البول أو استطلاق الريح) كيف يتطهر؟","a":"يفعل كالمستحاضة: يغسل المحل ويعصبه، ويتوضأ لوقت كل صلاة («وكذا يفعل كل من حدثه دائم»).","m":0,"ex":"كل من حدثه مستمر يُقاس على المستحاضة: يغسل المحل، ويشده حتى يخف الخارج، ثم يتوضأ بعد دخول الوقت لكل صلاة، ولا يضره ما خرج بعد ذلك.","w":["يتوضأ مرة واحدة لكل يوم، ولا يلزمه غسل المحل.","يغتسل لكل صلاة كالمستحاضة.","يسقط عنه الوضوء لأنه معذور، ويصلي بحاله."],"s":"fiqh","y":"نصّ الكتاب بعد أحكام المستحاضة: وكذا يفعل كل من حدثه دائم."},{"id":"s41","b":"الطهارة","q":"ما أقل النفاس وما أكثره؟","a":"لا حد لأقله، وأكثره أربعون يوماً.","m":0,"ex":"النفاس لا حدّ لأقله: متى طهرت ولو بعد يوم اغتسلت وصلّت. أما أكثره فأربعون يوماً. قارن بالحيض: أقله يوم وليلة وأكثره ١٥.","w":["أقله يوم وليلة، وأكثره أربعون يوماً.","لا حد لأقله، وأكثره ستون يوماً.","أقله عشرة أيام، وأكثره أربعون يوماً."],"s":"fiqh"},{"id":"v182","b":"الطهارة","q":"كم واجبات الغسل؟ وما هو؟","a":"واجب واحد: التسمية، وتسقط سهواً.","m":0,"ex":"للغسل واجب واحد فقط هو التسمية، فإن تركها ناسياً سقطت وصح غسله. أما فرضه فتعميم البدن بالماء، وما سوى ذلك من أفعاله سنن.","w":["واجبان: النية والتسمية، ولا يسقطان سهواً.","لا واجب له، وكل ما فيه سنن إلا تعميم البدن.","ثلاثة: التسمية والمضمضة والاستنشاق."],"s":"fiqh","y":"واجب الغسل التسمية وحدها، وتسقط سهواً."},{"id":"v281","b":"الطهارة","q":"ما تعريف الطهارة؟","a":"رفع الحدث، وزوال الخبث.","m":0,"ex":"الطهارة تجمع أمرين: رفع الحدث بالوضوء أو الغسل أو ما يقوم مقامهما، وزوال الخبث وهو النجاسة عن البدن والثوب والمكان.","w":["زوال الخبث فقط.","رفع الحدث فقط.","استعمال الماء الطهور في أعضاء مخصوصة بنية."],"s":"fiqh"},{"id":"v554","b":"الطهارة","q":"ما حكم البول أو التغوط في طريق مسلوك، أو ظل نافع، أو تحت شجرة عليها ثمر يُقصد، أو بين قبور المسلمين؟","a":"يحرم ذلك كله. ويحرم عند قضاء الحاجة أيضاً: استقبال القبلة واستدبارها في الصحراء بلا حائل، وأن يلبث فوق قدر حاجته.","m":0,"ex":"هذه من المحرمات عند قضاء الحاجة: أن يبول أو يتغوط بطريق مسلوك، وظل نافع، وتحت شجرة عليها ثمر يُقصد، وبين قبور المسلمين. ويلحق بها استقبال القبلة واستدبارها في الصحراء بلا حائل، واللبث فوق قدر الحاجة.","ca":"يحرم.","w":["يكره.","يباح مع الكراهة في المقابر فقط.","يكره إلا تحت الشجرة المثمرة فيحرم."],"s":"fiqh"},{"id":"v761","b":"الطهارة","q":"ما صفة الوضوء؟","a":"ينوي، ثم يسمي، ويغسل كفيه، ثم يتمضمض ويستنشق، ثم يغسل وجهه من منابت شعر الرأس المعتاد، ثم يغسل يديه مع مرفقيه، ثم يمسح جميع ظاهر رأسه من حد الوجه إلى ما يسمى قفاً، ويدخل سبابتيه في صماخي أذنيه ويمسح بإبهاميه ظاهرهما، ثم يغسل رجليه مع كعبيه، وهما العظمان الناتئان.","m":0,"ex":"يبدأ بالنية ثم التسمية وغسل الكفين، ثم المضمضة والاستنشاق، ثم الوجه، ثم اليدين مع المرفقين، ثم مسح الرأس كله ومعه الأذنان، ثم الرجلين مع الكعبين، وهما العظمان الناتئان.","ca":"ينوي، ثم يسمي، ويغسل كفيه، ثم يتمضمض ويستنشق، ثم يغسل وجهه، ثم يديه مع المرفقين، ثم يمسح رأسه وأذنيه، ثم يغسل رجليه مع الكعبين.","w":["يسمي، ثم ينوي، ويغسل كفيه، ثم يغسل وجهه، ثم يتمضمض ويستنشق، ثم يديه مع المرفقين، ثم يمسح رأسه وأذنيه، ثم يغسل رجليه.","ينوي، ثم يسمي، ويغسل كفيه، ثم يتمضمض ويستنشق، ثم يغسل وجهه، ثم يمسح رأسه وأذنيه، ثم يغسل يديه مع المرفقين، ثم رجليه.","ينوي، ثم يسمي، ثم يتمضمض ويستنشق، ثم يغسل وجهه، ثم يديه إلى الكوعين، ثم يمسح مقدم رأسه، ثم يغسل رجليه إلى الكعبين."],"s":"fiqh"},{"id":"v925","b":"الطهارة","q":"ما الفرق بين غسل الكفين وغسل اليدين في الوضوء؟","a":"غسل الكفين ثلاثاً في أول الوضوء سنة من سننه، وغسل اليدين مع المرفقين فرض من فروضه يكون بعد غسل الوجه؛ فلا يغني غسل الكفين عنه.","m":0,"ex":"من سنن الوضوء غسل الكفين ثلاثاً قبل البدء، ومن فروضه الستة غسل اليدين مع المرفقين بعد الوجه. فمن اكتفى بغسل كفيه في أول وضوئه ولم يغسل يديه مع المرفقين بعد وجهه لم يصح وضوؤه.","ca":"غسل الكفين سنة في أول الوضوء، وغسل اليدين مع المرفقين فرض بعد غسل الوجه.","w":["كلاهما فرض من فروض الوضوء.","غسل الكفين فرض في أول الوضوء، وغسل اليدين إلى المرفقين سنة.","لا فرق بينهما، فغسل الكفين أول الوضوء يغني عن غسل اليدين."],"s":"fiqh","y":"غسل الكفين ثلاثاً من السنن، أما غسل اليدين مع المرفقين فمن الفروض."},{"id":"v1497","b":"الطهارة","q":"ما معنى أن الموت يوجب الغسل «تعبّداً»؟ وهل يُغسَّل الميت لرفع حدث؟","a":"الموت من موجبات الغسل السبعة تعبّداً؛ أي يُغسَّل الميت امتثالاً للأمر الشرعي، لا لرفع حدث.","m":0,"ex":"ذكر الكتاب الموت سابعَ موجبات الغسل وقيّده بقوله «تعبّداً»، أي أن غسله أمر يُتعبَّد به. ولذلك قال في نواقض الوضوء: «وكل ما أوجب الغسل غير الموت».","ca":"يُغسَّل امتثالاً للأمر، لا لرفع حدث.","w":["يُغسَّل لرفع حدثه كالجنب.","يُغسَّل لإزالة النجاسة فقط، لأنه ينجس بالموت.","يُغسَّل استحباباً لا وجوباً، إكراماً له."],"s":"fiqh","y":"الموت سابع موجبات الغسل، وقيّده الكتاب بقوله: تعبداً."},{"id":"v1600","b":"الطهارة","q":"بكم يُسنّ الوضوء والاغتسال من الماء؟","a":"يُسنّ الوضوء بمُدّ، والاغتسال بصاع، ويُكره الإسراف.","m":0,"ex":"السنة ألا يزيد في الوضوء على مُدّ، ولا في الغسل على صاع، والزيادة الكثيرة إسراف مكروه. ولا يُكره الإسباغ بأقل من ذلك.","w":["يُسنّ الوضوء بصاع، والاغتسال بمُدّ.","يُسنّ الوضوء بمُدّين، والاغتسال بثلاثة آصع.","يجب الوضوء بمُدّ والاغتسال بصاع، ولا يجزئ أقل منهما."],"s":"fiqh","y":"يسن الوضوء بمد والاغتسال بصاع، ويكره الإسراف."},{"id":"v1675","b":"الطهارة","q":"ما حكم الاغتسال للوقوف بعرفة، ولدخول مكة؟","a":"مستحب؛ فهما من الأغسال المستحبة الستة عشر.","m":0,"ex":"عدّ الكتاب من الأغسال المستحبة: الغسل للإحرام، ولدخول مكة وحرمها، وللوقوف بعرفة، ولطواف الزيارة والوداع، وللمبيت بمزدلفة، ولرمي الجمار. فهي سنن لا واجبات.","w":["واجب على الحاج.","واجب لدخول مكة، مستحب للوقوف بعرفة.","مباح، وليس من الأغسال المستحبة."],"s":"fiqh","y":"الغسل لدخول مكة وللوقوف بعرفة معدود في الأغسال المستحبة."},{"id":"v2249","b":"الطهارة","q":"ما الذي يوجبه الحيض؟","a":"يوجب: الغسل، والبلوغ، والكفارة بالوطء فيه (دينار أو نصفه على التخيير). وتقضي الحائض الصوم لا الصلاة.","m":0,"ex":"إذا انقطع دم الحيض وجب على المرأة الغسل. وخروج الحيض علامة على بلوغها. ومن وطئ امرأته وهي حائض لزمته كفارة: دينار أو نصف دينار يختار أيهما شاء، ولو كان مكرهاً أو ناسياً أو جاهلاً، وكذا المرأة إن طاوعته.","ca":"الغسل، والبلوغ، والكفارة بالوطء فيه.","w":["الغسل، والوضوء، وقضاء الصلاة.","الغسل، والبلوغ، وقضاء الصلاة والصوم.","الوضوء فقط، والكفارة بالوطء فيه."],"s":"fiqh","y":"الكفارة بالوطء في الحيض دينار أو نصفه على التخيير، ولو ناسياً أو جاهلاً."},{"id":"s42","b":"الصلاة","q":"ما حكم الأذان والإقامة؟ (متى فرض كفاية، متى سنة، متى يكره)؟","a":"فرض كفاية في الحضر على الرجال الأحرار، ويسنان للمنفرد وفي السفر، ويكرهان للنساء ولو بلا رفع صوت.","m":0,"ex":"ثلاث درجات بحسب الحال: رجال أحرار في الحضر = فرض كفاية، ومنفرد أو مسافر = سنة، ونساء = مكروه ولو بصوت خافت.","w":["سنة مؤكدة في الحضر على الرجال، ويباحان للمنفرد وفي السفر، ويسنان للنساء بلا رفع صوت.","فرض عين على كل رجل، ويسنان في السفر، ويكرهان للنساء.","فرض كفاية في الحضر والسفر على الرجال والنساء."],"s":"fiqh","y":"لأن الكتاب جعلهما فرض كفاية في الحضر على الرجال الأحرار، وسنة للمنفرد والمسافر، ومكروهين للنساء."},{"id":"s43","b":"الصلاة","q":"ما شروط صحة الأذان؟","a":"أن يكونا مرتبين، متواليين عرفاً، من واحد، بنية منه؛ وكون المؤذن مسلماً، ذكراً، عاقلاً، مميزاً، ناطقاً، عدلاً ولو ظاهراً؛ وألا يكونا قبل الوقت.","m":0,"ex":"اقسمها ثلاثة: في الأذان نفسه (مرتب، متوالٍ، من واحد، بنية)، وفي المؤذن (مسلم، ذكر، عاقل، مميز، ناطق، عدل)، وفي الوقت (لا قبله).","w":["أن يكون مرتباً متوالياً من واحد بنية، والمؤذن مسلم ذكر بالغ متطهر، وألا يكون قبل الوقت.","أن يكون مرتباً ولو من اثنين، والمؤذن مسلم ذكر عاقل مميز عدل، وألا يكون قبل الوقت.","أن يكون مرتباً متوالياً من واحد بنية، والمؤذن مسلم عاقل مميز ولو أنثى، ويصح قبل الوقت."],"ca":"أن يكون مرتباً متوالياً من واحد بنية، والمؤذن مسلم ذكر عاقل مميز ناطق عدل، وألا يكون قبل الوقت.","s":"fiqh"},{"id":"s44","b":"الصلاة","q":"هل يصح الأذان قبل الوقت؟","a":"لا يصحان قبل الوقت إلا أذان الفجر، فيصح بعد نصف الليل.","m":0,"ex":"الأصل أن الأذان لا يصح قبل دخول الوقت. ويُستثنى الفجر وحده، فيصح أذانه بعد نصف الليل.","w":["لا يصحان قبل الوقت مطلقاً، حتى الفجر.","يصحان قبل الوقت في كل الصلوات بقليل.","لا يصحان قبل الوقت إلا أذان الجمعة، فيصح قبل الزوال."],"s":"fiqh","y":"لأن الأذان لا يصح قبل الوقت، واستثني أذان الفجر وحده."},{"id":"s45","b":"الصلاة","q":"ما هي سنن الأذان والمؤذن؟","a":"يسن كون المؤذن: صيتاً، أميناً، عالماً بالوقت، متطهراً، قائماً. ويسن: الأذان أول الوقت، والترسل فيه، وأن يكون على علو، رافعاً وجهه، جاعلاً سبابتيه في أذنيه، مستقبل القبلة، يلتفت يميناً لحي على الصلاة وشمالاً لحي على الفلاح، والتثويب في الفجر.","m":0,"ex":"قسمان: صفات المؤذن (صيّت، أمين، عالم بالوقت، متطهر، قائم) وكلها تعين على الإبلاغ والثقة. وصفة الأذان: أول الوقت، بترسل، على مرتفع، إصبعاه في أذنيه، مستقبل القبلة، يلتفت في الحيعلتين، ويثوّب في الفجر.","w":["كون المؤذن صيتاً أميناً عالماً بالوقت متطهراً جالساً، والأذان أول الوقت مستدبر القبلة، والتثويب في العشاء.","كون المؤذن صيتاً أميناً بالغاً، والأذان آخر الوقت على علو مستقبل القبلة، والتثويب في الفجر.","كون المؤذن مسلماً ذكراً عاقلاً، والأذان أول الوقت على علو مستقبل القبلة، والتثويب في المغرب."],"ca":"كون المؤذن صيتاً أميناً عالماً بالوقت متطهراً قائماً، والأذان أول الوقت على علو مستقبل القبلة، والتثويب في الفجر.","s":"fiqh"},{"id":"s46","b":"الصلاة","q":"ما حكم الخروج من المسجد بعد الأذان؟","a":"يحرم بلا عذر أو نية رجوع.","m":0,"ex":"الأذان دعوة للصلاة، فمن كان في المسجد وخرج بعده كأنه أعرض عنها، فيحرم. ويُستثنى أمران: وجود عذر، أو نيته الرجوع.","w":["يكره بلا عذر أو نية رجوع.","يباح مطلقاً إن نوى الصلاة في مسجد آخر.","يحرم مطلقاً ولو لعذر أو نية رجوع."],"s":"fiqh"},{"id":"s47","b":"الصلاة","q":"كم عدد شروط الصلاة، واذكر خمسة منها؟","a":"تسعة: الإسلام، والعقل، والتمييز، والطهارة مع القدرة، ودخول الوقت، وستر العورة، واجتناب النجاسة، واستقبال القبلة، والنية.","m":0,"ex":"تسعة: ثلاثة في الشخص (إسلام، عقل، تمييز) كالوضوء، ثم ستة للصلاة: طهارة، وقت، ستر عورة، اجتناب نجاسة، قبلة، نية. والطهارة مقيدة بالقدرة.","w":["تسعة: الإسلام، والعقل، والبلوغ، والطهارة، ودخول الوقت، وستر العورة، واجتناب النجاسة، واستقبال القبلة، والنية.","ثمانية: الإسلام، والعقل، والتمييز، والطهارة، ودخول الوقت، وستر العورة، واستقبال القبلة، والنية.","تسعة: الإسلام، والعقل، والتمييز، والطهارة، ودخول الوقت، وستر العورة، وتكبيرة الإحرام، واستقبال القبلة، والنية."],"ca":"تسعة: الإسلام، والعقل، والتمييز، والطهارة، ودخول الوقت، وستر العورة، واجتناب النجاسة، واستقبال القبلة، والنية.","s":"fiqh"},{"id":"s48","b":"الصلاة","q":"على من تجب الصلاة؟ ومن هو المميز؟","a":"تجب على كل مسلم مكلف غير الحائض والنفساء. والمميز: من بلغ سبعاً.","m":0,"n":"في نسخة دليل الطالب المطبوعة (ص107): «وهو: من بلغ عشراً».","ex":"تجب على المسلم المكلف (البالغ العاقل)، ويُستثنى الحائض والنفساء فلا تجب عليهما ولا تقضيانها. والمميز من أتم سبع سنين، وهو سن الأمر بالصلاة.","w":["تجب على كل مسلم مكلف حتى الحائض والنفساء. والمميز: من بلغ عشراً.","تجب على كل مسلم مميز غير الحائض والنفساء. والمميز: من بلغ سبعاً.","تجب على كل مسلم مكلف غير الحائض والنفساء. والمميز: من بلغ خمساً."],"s":"fiqh"},{"id":"s49","b":"الصلاة","q":"كم عدد أركان الصلاة؟ وما تعريف الركن؟","a":"أربعة عشر. والركن: ما لا يسقط عمداً ولا سهواً ولا جهلاً.","m":0,"ex":"الركن هو عمود الصلاة، فلا يسقط أبداً: لا بالعمد ولا بالسهو ولا بالجهل. فرّق بينه وبين الواجب الذي يسقط بالسهو والجهل.","w":["أربعة عشر. والركن: ما تبطل الصلاة بتركه عمداً ويسقط سهواً وجهلاً.","ثلاثة عشر. والركن: ما لا يسقط عمداً ولا سهواً ولا جهلاً.","ثمانية. والركن: ما لا يسقط عمداً ولا سهواً ولا جهلاً."],"s":"fiqh","y":"لأن الركن ما لا يسقط عمداً ولا سهواً ولا جهلاً."},{"id":"s50","b":"الصلاة","q":"إمام سجد سجدة واحدة ثم سلم، ما حكم صلاته وماذا يفعل؟","a":"لا تصح إلا بالإتيان بالركن؛ لأن الأركان لا تسقط عمداً ولا سهواً ولا جهلاً، فيأتي به (بركعة كاملة إن ذكر بعد السلام ولم يطل الفصل) ويسجد للسهو وجوباً؛ لأنه سلم قبل إتمامها.","m":0,"ex":"السجدة الثانية ركن، والركن لا يسقط بالنسيان، فلا بد من الإتيان به. وإن تذكّر بعد السلام قريباً أتى بركعة كاملة، ثم يسجد للسهو وجوباً لأنه سلّم قبل الإتمام.","w":["صلاته صحيحة، ويسجد للسهو فقط؛ لأن الركن يسقط سهواً.","لا تصح، ويلزمه إعادة الصلاة كلها ولو ذكر قريباً.","لا تصح إلا بالإتيان بالسجدة وحدها، ويسجد للسهو استحباباً."],"ca":"لا تصح إلا بالإتيان بالركن (بركعة كاملة إن ذكر بعد السلام ولم يطل الفصل)، ويسجد للسهو وجوباً.","s":"fiqh","y":"لأن السجود ركن، والركن لا يسقط عمداً ولا سهواً ولا جهلاً، فلا بد من الإتيان به."},{"id":"s51","b":"الصلاة","q":"كم عدد واجبات الصلاة وما تعريفها؟","a":"ثمانية، تبطل الصلاة بتركها عمداً وتسقط سهواً وجهلاً: التكبير لغير الإحرام، والتسميع للإمام والمنفرد، والتحميد للكل، وسبحان ربي العظيم مرة، وسبحان ربي الأعلى مرة، ورب اغفر لي بين السجدتين، والتشهد الأول، والجلوس له.","m":0,"ex":"الواجب وسط بين الركن والسنة: يبطل تعمد تركه، ويسقط بالسهو والجهل ويجبر بسجود السهو. وثمانية: ثلاثة أذكار انتقال (تكبير، تسميع، تحميد)، ثلاثة أذكار ثبات (تسبيح ركوع وسجود، ورب اغفر لي)، والتشهد الأول وجلوسه.","w":["ثمانية، لا تسقط عمداً ولا سهواً: تكبير الانتقال، والتسميع، والتحميد، وتسبيح الركوع والسجود، ورب اغفر لي، والتشهد الأول وجلوسه.","ثمانية، تبطل بتركها عمداً وتسقط سهواً: تكبيرة الإحرام، والتسميع، والتحميد، وتسبيح الركوع والسجود، ورب اغفر لي، والتشهد الأخير وجلوسه.","ثمانية، تبطل بتركها عمداً وتسقط سهواً: تكبير الانتقال، والتسميع، والتحميد، وتسبيح الركوع والسجود، والاستفتاح، والتعوذ."],"ca":"ثمانية، تبطل بتركها عمداً وتسقط سهواً: تكبير الانتقال، والتسميع، والتحميد، وتسبيح الركوع والسجود، ورب اغفر لي، والتشهد الأول وجلوسه.","s":"fiqh","y":"لأن هذا حد الواجب في الكتاب: يبطل تركه عمداً ويسقط سهواً وجهلاً."},{"id":"s52","b":"الصلاة","q":"اذكر خمسة من سنن الأقوال، وخمسة من سنن الأفعال؟","a":"سنن الأقوال (إحدى عشرة): الاستفتاح، والتعوذ، والبسملة، وآمين، وقراءة السورة بعد الفاتحة، والجهر بالقراءة للإمام، وقول «ملء السماء...» لغير المأموم، وما زاد على المرة في التسبيح وفي رب اغفر لي، والصلاة على آله في التشهد الأخير، والدعاء بعده. سنن الأفعال (الهيئات) منها: رفع اليدين مع تكبيرة الإحرام وعند الركوع والرفع منه، ووضع اليمين على الشمال تحت سرته، والنظر إلى موضع سجوده، ومد ظهره في الركوع، والبداءة بالركبتين ثم اليدين في السجود، ومجافاة عضديه عن جنبيه، والافتراش في التشهد الأول والتورك في الثاني.","m":0,"ex":"سنن الأقوال: أذكار زائدة (استفتاح، تعوذ، بسملة، آمين، سورة، جهر، زيادة التسبيح، دعاء بعد التشهد). وسنن الأفعال هيئات الجسد: رفع اليدين، وضع اليمين على الشمال، النظر لموضع السجود، مد الظهر، المجافاة، الافتراش والتورك.","w":["أقوال: الاستفتاح، والتعوذ، والتسميع، وآمين، والسورة. أفعال: رفع اليدين، ووضع اليمين على الشمال، والجلوس للتشهد الأول، والمجافاة، والتورك.","أقوال: الاستفتاح، والتعوذ، والبسملة، وآمين، والفاتحة. أفعال: رفع اليدين، ووضع اليمين على الشمال، والنظر لموضع السجود، والمجافاة، والطمأنينة.","أقوال: الاستفتاح، والتعوذ، والبسملة، وآمين، والسورة. أفعال: رفع اليدين، ووضع اليمين على الشمال، والنظر إلى السماء، والتورك في التشهد الأول، والافتراش في الثاني."],"ca":"أقوال: الاستفتاح، والتعوذ، والبسملة، وآمين، والسورة. أفعال: رفع اليدين، ووضع اليمين على الشمال، والنظر لموضع السجود، والمجافاة، والتورك.","s":"fiqh"},{"id":"s53","b":"الصلاة","q":"اذكر خمسة من مكروهات الصلاة؟","a":"منها: الالتفات بلا حاجة، وتغميض عينيه، وافتراش ذراعيه ساجداً، والعبث، والتخصر، والتمطي، وفرقعة أصابعه وتشبيكها، ومس الحصى، وكف ثوبه، واقتصاره على الفاتحة، وأن يمسح أثر سجوده.","m":0,"ex":"المكروهات كلها تنافي الخشوع والهيئة الحسنة: حركات عابثة (عبث، فرقعة، تشبيك، مس حصى، كف ثوب، مسح أثر السجود)، وهيئات سيئة (تخصر، تمطٍّ، افتراش الذراعين، التفات، تغميض)، وتقصير (الاقتصار على الفاتحة).","w":["منها: الالتفات بلا حاجة، وتغميض عينيه، والعبث، والتخصر، والقهقهة.","منها: الالتفات بلا حاجة، والنظر إلى موضع السجود، والعبث، والتخصر، ووضع اليمين على الشمال.","منها: استدبار القبلة، وتغميض عينيه، والعبث، والتخصر، والكلام سهواً."],"ca":"منها: الالتفات بلا حاجة، وتغميض عينيه، والعبث، والتخصر، وفرقعة أصابعه.","s":"fiqh"},{"id":"s54","b":"الصلاة","q":"ما هي مبطلات الصلاة؟","a":"ما أبطل الطهارة، وكشف العورة عمداً، واستدبار القبلة، واتصال النجاسة به إن لم يزلها في الحال، والعمل الكثير من غير جنسها لغير ضرورة، والاستناد قوياً لغير عذر، ورجوعه للتشهد الأول بعد الشروع في القراءة عالماً ذاكراً، وتعمد زيادة ركن فعلي أو تقديم بعض الأركان أو السلام قبل إتمامها، وتعمد إحالة المعنى في القراءة، وفسخ النية والتردد فيه، والدعاء بملاذ الدنيا، والقهقهة، والكلام ولو سهواً، وتقدم المأموم على إمامه، وبطلان صلاة إمامه، والأكل والشرب (سوى اليسير لناس وجاهل).","m":0,"ex":"المبطلات ترجع إلى إخلال بشرط (طهارة، عورة، قبلة، نجاسة، نية)، أو بركن وترتيب (زيادة ركن عمداً، تقديم ركن، سلام قبل الإتمام)، أو بما ينافي الصلاة (عمل كثير، كلام، قهقهة، أكل وشرب)، أو من جهة الإمام (التقدم عليه، بطلان صلاته).","w":["منها: ما أبطل الطهارة، وكشف العورة عمداً، واستدبار القبلة، والعمل اليسير، والالتفات بلا حاجة، والتبسم.","منها: ما أبطل الطهارة، وكشف العورة سهواً، واستدبار القبلة، والعمل الكثير لغير ضرورة، والكلام عمداً فقط، والتخصر.","منها: ما أبطل الطهارة، وكشف العورة عمداً، واستدبار القبلة، والعمل الكثير لغير ضرورة، والكلام ولو سهواً، وتغميض العينين."],"ca":"منها: ما أبطل الطهارة، وكشف العورة عمداً، واستدبار القبلة، والعمل الكثير لغير ضرورة، والكلام ولو سهواً، والقهقهة.","s":"fiqh"},{"id":"s55","b":"الصلاة","q":"ما أحوال سجود السهو (متى يباح، يسن، يجب)؟","a":"يسن: إذا أتى بقول مشروع في غير محله سهواً. يباح: إذا ترك مسنوناً. يجب: إذا زاد ركوعاً أو سجوداً أو قياماً أو قعوداً، أو سلم قبل إتمامها، أو لحن لحناً يحيل المعنى، أو ترك واجباً، أو شك في زيادة وقت فعلها.","m":0,"ex":"ثلاث مراتب بحسب نوع الخطأ: قول مشروع في غير محله = سنة، وترك سنة = مباح، وخلل كبير = واجب: زيادة فعل من جنس الصلاة، أو سلام قبل تمامها، أو لحن يحيل المعنى، أو ترك واجب، أو شك في زيادة.","w":["يسن: لترك مسنون. يباح: لقول مشروع في غير محله. يجب: لزيادة فعل، أو سلام قبل تمامها، أو ترك واجب.","يسن: لقول مشروع في غير محله. يباح: لترك واجب. يجب: لزيادة فعل، أو سلام قبل تمامها، أو ترك مسنون.","يسن: لترك واجب. يباح: لقول مشروع في غير محله. يجب: لزيادة فعل، أو سلام قبل تمامها، أو ترك مسنون."],"ca":"يسن: لقول مشروع في غير محله. يباح: لترك مسنون. يجب: لزيادة فعل، أو سلام قبل تمامها، أو ترك واجب.","s":"fiqh"},{"id":"s56","b":"الصلاة","q":"متى تبطل الصلاة في سجود السهو؟","a":"بتعمد ترك سجود السهو الواجب، لا إن ترك ما وجب بسلامه قبل إتمامها.","m":0,"ex":"من تعمد ترك سجود سهو واجب بطلت صلاته. ويُستثنى السجود الذي وجب لأنه سلم قبل تمام الصلاة، لأن محله بعد السلام فلا يُبطل تركه الصلاة.","w":["بتعمد ترك سجود السهو المسنون، لا إن ترك الواجب منه.","بتعمد ترك سجود السهو الواجب، ولو كان ما وجب بسلامه قبل إتمامها.","بترك سجود السهو الواجب سهواً أو عمداً."],"s":"fiqh","y":"لأن الواجب يبطل تعمد تركه، واستثني ما وجب بالسلام قبل الإتمام."},{"id":"s57","b":"الصلاة","q":"متى يسقط سجود السهو؟","a":"إن نسيه حتى طال الفصل عرفاً، أو أحدث، أو خرج من المسجد.","m":0,"ex":"ثلاثة أسباب تقطع صلته بالصلاة: طول الفصل عرفاً، أو الحدث، أو الخروج من المسجد. فإن حصل واحد منها سقط السجود.","w":["إن نسيه حتى قام من مجلسه، أو تكلم، أو التفت.","لا يسقط أبداً، ويسجد متى ذكره.","إن نسيه حتى خرج وقت الصلاة فقط."],"s":"fiqh"},{"id":"s58","b":"الصلاة","q":"من نسي التشهد الأول وقام ما حكمه؟","a":"إن ذكره قبل أن يستتم قائماً لزمه الرجوع، وإن استتم قائماً كره الرجوع، وإن شرع في القراءة لم يرجع (فإن رجع عالماً ذاكراً بطلت).","m":0,"ex":"ثلاث مراحل كلما تقدم فيها قوي المنع: قبل الاستتمام قائماً = يلزمه الرجوع، بعد الاستتمام = يكره الرجوع، بعد الشروع في القراءة = يحرم الرجوع، ومن رجع عالماً ذاكراً بطلت صلاته.","w":["إن ذكره قبل أن يستتم قائماً كره الرجوع، وإن استتم قائماً لزمه الرجوع، وإن شرع في القراءة لم يرجع.","إن ذكره قبل أن يستتم قائماً لزمه الرجوع، وإن استتم قائماً حرم الرجوع، وإن شرع في القراءة وجب الرجوع.","يلزمه الرجوع ما لم يركع، فإن ركع لم يرجع."],"s":"fiqh","y":"لأن الكتاب فرّق بين ما قبل الاستتمام وما بعده وما بعد الشروع في القراءة."},{"id":"s59","b":"الصلاة","q":"ما هي أفضل صلاة تطوع؟","a":"أفضلها ما سن جماعة، وآكدها: الكسوف، فالاستسقاء، فالتراويح، فالوتر.","m":0,"ex":"القاعدة: ما شُرعت له الجماعة أفضل. ثم الترتيب تنازلياً: كسوف ← استسقاء ← تراويح ← وتر. تذكّر أن آخرها الوتر وأولها الكسوف.","w":["أفضلها ما سن جماعة، وآكدها: الوتر، فالتراويح، فالاستسقاء، فالكسوف.","أفضلها الرواتب، وآكدها: سنة الفجر، فالوتر، فالتراويح.","أفضلها ما سن جماعة، وآكدها: التراويح، فالكسوف، فالوتر، فالاستسقاء."],"s":"fiqh"},{"id":"s60","b":"الصلاة","q":"اذكر سنن الرواتب؟","a":"عشر: ركعتان قبل الظهر، وركعتان بعدها، وركعتان بعد المغرب، وركعتان بعد العشاء، وركعتان قبل الفجر.","m":0,"ex":"عشر ركعات: الظهر وحده له ركعتان قبل وركعتان بعد، والمغرب والعشاء ركعتان بعد كل منهما، والفجر ركعتان قبله. والعصر ليس له راتبة.","w":["عشر: ركعتان قبل الظهر، وركعتان بعدها، وركعتان بعد العصر، وركعتان بعد المغرب، وركعتان قبل الفجر.","اثنتا عشرة: أربع قبل الظهر، وركعتان بعدها، وركعتان بعد المغرب، وركعتان بعد العشاء، وركعتان قبل الفجر.","عشر: ركعتان قبل الظهر، وركعتان بعدها، وركعتان قبل المغرب، وركعتان بعد العشاء، وركعتان قبل الفجر."],"s":"fiqh"},{"id":"s61","b":"الصلاة","q":"ما هي السنن التي يشرع قضاؤها إن فاتت؟","a":"الرواتب والوتر، إلا ما فات مع فرضه وكثر فالأولى تركه.","m":0,"ex":"ما كان مؤكداً يُقضى: الرواتب والوتر. لكن إن فاتت مع فرائضها وكثرت، فالأولى تركها والاشتغال بقضاء الفرائض، لأن الفرض أهم.","w":["الرواتب والوتر، ويقضيها دائماً ولو فاتت مع فرضها وكثرت.","الوتر وحده، ولا تقضى الرواتب.","كل النوافل تقضى، حتى تحية المسجد وصلاة الضحى."],"s":"fiqh","y":"لأن الكتاب استثنى ما فات مع فرضه وكثر فالأولى تركه."},{"id":"s62","b":"الصلاة","q":"ما حكم تحية المسجد؟","a":"سنة.","m":0,"ex":"تحية المسجد سنة، أي يُثاب فاعلها ولا يأثم تاركها. ولا توصف بالوجوب، فلا تلتبس عليك بالفروض.","w":["واجبة.","مكروهة.","مباحة."],"s":"fiqh"},{"id":"s63","b":"الصلاة","q":"اذكر صفة سجود التلاوة؟","a":"يكبر إذا سجد بلا تكبيرة إحرام، وإذا رفع، ويجلس، ويسلم بلا تشهد. (وهو كالنافلة فيما يعتبر لها).","m":0,"ex":"سجود التلاوة سجدة واحدة لها طرفان: تكبير عند النزول وتكبير عند الرفع، بلا تكبيرة إحرام، ثم جلوس وسلام بلا تشهد. ويشترط لها ما يشترط للنافلة كالطهارة والقبلة.","w":["يكبر للإحرام ثم يكبر إذا سجد وإذا رفع، ويتشهد ويسلم.","يسجد بلا تكبير ولا سلام، ولا يشترط له الطهارة.","يكبر إذا سجد وإذا رفع، ويجلس ويتشهد، ولا يسلم."],"s":"fiqh","y":"لأن سجود التلاوة كالنافلة فيما يعتبر لها، وصفته في الكتاب بلا تكبيرة إحرام ولا تشهد."},{"id":"s64","b":"الصلاة","q":"رجل وهو يصلي الفريضة أُخبر بنجاحه فسجد للشكر في الصلاة، ما حكم صلاته؟","a":"تبطل صلاته إن سجد للشكر فيها عالماً ذاكراً.","m":0,"ex":"سجود الشكر يكون خارج الصلاة، فإذا فعله فيها كان زيادة ليست منها فتبطل. والبطلان مقيد بأن يكون عالماً بالحكم ذاكراً أنه في صلاة.","w":["صلاته صحيحة؛ لأن سجود الشكر مشروع في الصلاة كسجود التلاوة.","صلاته صحيحة، ويسجد للسهو.","تبطل صلاته ولو كان جاهلاً أو ناسياً."],"s":"fiqh"},{"id":"s65","b":"الصلاة","q":"ما هي أوقات النهي عن الصلاة؟","a":"من طلوع الفجر إلى ارتفاع الشمس قيد رمح، ومن صلاة العصر إلى غروب الشمس، وعند قيامها حتى تزول.","m":0,"ex":"ثلاثة أوقات: بعد الفجر حتى ترتفع الشمس قيد رمح، وبعد العصر حتى تغرب، وعند منتصف النهار حين تكون الشمس في كبد السماء حتى تزول. تذكّر: طلوع، وزوال، وغروب.","w":["من طلوع الشمس إلى ارتفاعها قيد رمح، ومن صلاة العصر إلى غروب الشمس، وعند قيامها حتى تزول.","من طلوع الفجر إلى ارتفاع الشمس قيد رمح، ومن صلاة المغرب إلى العشاء، وعند قيامها حتى تزول.","من طلوع الفجر إلى ارتفاع الشمس قيد رمح، ومن صلاة العصر إلى غروب الشمس، ومن نصف الليل إلى الفجر."],"s":"fiqh"},{"id":"s66","b":"الصلاة","q":"ما هي الصلوات المستثناة التي يجوز صلاتها في أوقات النهي؟","a":"سنة الفجر قبلها، وركعتا الطواف، وسنة الظهر إذا جمع، وإعادة جماعة أقيمت وهو بالمسجد. ويجوز فيها قضاء الفرائض، وفعل المنذورة.","m":0,"ex":"المستثنيات صلوات لها سبب أو متعلقة بفرض: سنة الفجر قبله، ركعتا الطواف، سنة الظهر عند الجمع، إعادة الجماعة. ويضاف إليها ما هو واجب: قضاء الفرائض والنذر.","w":["سنة الفجر قبلها، وركعتا الطواف، وتحية المسجد، وصلاة الضحى، وقضاء الفرائض.","سنة الفجر قبلها، وسنة المغرب، وصلاة الوتر، وقضاء الرواتب، والمنذورة.","لا يجوز فيها شيء إلا قضاء الفرائض."],"ca":"سنة الفجر قبلها، وركعتا الطواف، وسنة الظهر إذا جمع، وإعادة الجماعة، وقضاء الفرائض، والمنذورة.","s":"fiqh"},{"id":"s67","b":"الصلاة","q":"على من تجب صلاة الجماعة؟","a":"على الرجال الأحرار القادرين، حضراً وسفراً.","m":0,"ex":"شروط وجوب الجماعة ثلاثة: رجال، أحرار، قادرون. ولا تسقط بالسفر، فهي واجبة حضراً وسفراً. فلا تجب على النساء ولا العبيد ولا العاجز.","w":["على الرجال الأحرار القادرين، في الحضر دون السفر.","على كل مكلف من الرجال والنساء، حضراً وسفراً.","هي سنة مؤكدة على الرجال، حضراً وسفراً."],"s":"fiqh"},{"id":"s68","b":"الصلاة","q":"بماذا تدرك أجر الجماعة؟ وبماذا تدرك الركعة؟","a":"من كبر قبل تسليمة الإمام الأولى أدرك الجماعة. ومن أدرك الركوع غير شاك أدرك الركعة.","m":0,"ex":"فرّق بين إدراكين: الجماعة تُدرك بتكبيرة الإحرام قبل السلام الأول للإمام ولو في التشهد. والركعة تُدرك بإدراك الركوع مع الإمام دون شك.","w":["من أدرك ركعة كاملة أدرك الجماعة. ومن أدرك الركوع غير شاك أدرك الركعة.","من كبر قبل تسليمة الإمام الأولى أدرك الجماعة. ومن أدرك القيام قبل الركوع أدرك الركعة.","من كبر قبل التشهد الأخير أدرك الجماعة. ومن أدرك السجود أدرك الركعة."],"s":"fiqh"},{"id":"s69","b":"الصلاة","q":"ماذا يتحمل الإمام عن المأموم؟","a":"القراءة، وسجود السهو، وسجود التلاوة، والسترة، ودعاء القنوت، والتشهد الأول إذا سبق بركعة في رباعية.","m":0,"ex":"ستة أشياء يكفي فيها فعل الإمام عن المأموم: القراءة، والسجودان (سهو وتلاوة)، والسترة، والقنوت، والتشهد الأول للمسبوق بركعة في الرباعية. تذكّر: قراءة، سجودان، سترة، قنوت، تشهد.","w":["القراءة، وسجود السهو، وتكبيرة الإحرام، والسترة، ودعاء القنوت، والتشهد الأخير.","الفاتحة، والتسبيح، والتحميد، والسترة، ودعاء القنوت، والتشهد الأول.","القراءة، وسجود السهو، وسجود التلاوة، والنية، والسلام، والتشهد الأول."],"ca":"القراءة، وسجود السهو، وسجود التلاوة، والسترة، ودعاء القنوت، والتشهد الأول للمسبوق.","s":"fiqh"},{"id":"s70","b":"الصلاة","q":"متى لا تنعقد صلاة المأموم؟","a":"إذا أحرم مع إمامه، أو قبل إتمامه لتكبيرة الإحرام.","m":0,"ex":"المأموم يتبع إمامه، فلا يدخل في الصلاة قبله ولا معه. فإن كبّر للإحرام مع الإمام أو قبل أن يُتم الإمام تكبيرته لم تنعقد صلاته أصلاً.","w":["إذا أحرم بعد إمامه وقبل قراءته الفاتحة.","إذا ركع قبل إمامه سهواً.","إذا أحرم مع إمامه فقط، وتنعقد إن أحرم قبل إتمامه التكبيرة."],"s":"fiqh","y":"لأن الكتاب قال: من أحرم مع إمامه أو قبل إتمامه لتكبيرة الإحرام لم تنعقد."},{"id":"s71","b":"الصلاة","q":"إذا انتقض وضوء الإمام في الصلاة فهل تبطل صلاة من وراءه أم يستنيب غيره؟","a":"تبطل صلاة من وراءه؛ لأن من مبطلات الصلاة «بطلان صلاة إمامه».","m":0,"ex":"صلاة المأموم مرتبطة بصلاة إمامه، فإذا بطلت صلاة الإمام بالحدث بطلت صلاة من خلفه، لأن من المبطلات «بطلان صلاة إمامه».","w":["لا تبطل صلاة من وراءه، ويستنيب الإمام من يكمل بهم.","لا تبطل، ويكمل كل مأموم صلاته منفرداً.","تبطل صلاة الإمام وحده، وينتظرونه حتى يتوضأ ثم يكمل بهم."],"s":"fiqh","y":"لأن من مبطلات الصلاة المنصوصة بطلان صلاة الإمام."},{"id":"s72","b":"الصلاة","q":"ما حكم انتظار الإمام للداخل للمسجد؟","a":"يسن انتظار داخل إن لم يشق على المأموم.","m":0,"ex":"يسن للإمام أن ينتظر الداخل ليدرك الركعة، بشرط ألا يشق ذلك على من خلفه. فحق المأمومين الحاضرين مقدَّم على الداخل.","w":["يجب انتظار داخل ولو شق على المأموم.","يكره انتظار الداخل مطلقاً.","يسن انتظار داخل ولو شق على المأموم."],"s":"fiqh"},{"id":"s73","b":"الصلاة","q":"اذكر ترتيب الأحق بالإمامة؟","a":"الأجود قراءة الأفقه، ثم الأسن، ثم الأشرف، ثم الأتقى والأورع، ثم يقرع.","m":0,"ex":"الترتيب يبدأ بالعلم: الأجود قراءة مع الفقه، ثم الأكبر سناً، ثم الأشرف نسباً، ثم الأتقى والأورع، فإن تساووا فالقرعة.","w":["الأفقه، ثم الأجود قراءة، ثم الأسن، ثم الأشرف، ثم يقرع.","الأجود قراءة الأفقه، ثم الأشرف، ثم الأسن، ثم الأتقى، ثم يقرع.","الأسن، ثم الأجود قراءة، ثم الأفقه، ثم الأتقى، ثم يقرع."],"s":"fiqh"},{"id":"s74","b":"الصلاة","q":"هل يصح للمميز (٧ سنين) أن يكون إماماً؟","a":"لا تصح إمامة المميز بالبالغ في الفرض، وتصح في النفل، وفي الفرض بمثله.","m":0,"ex":"المميز صلاته نافلة لأنه غير مكلف، فلا يؤم البالغ في الفرض. أما في النفل فيصح، ويصح أن يؤم مميزاً مثله في الفرض لتساويهما.","w":["تصح إمامة المميز بالبالغ في الفرض والنفل.","لا تصح إمامة المميز مطلقاً، لا في فرض ولا نفل.","تصح إمامة المميز بالبالغ في الفرض، ولا تصح في النفل."],"s":"fiqh"},{"id":"s75","b":"الصلاة","q":"ما حكم وقوف الإمام بين المأمومين بالصف (يمينه ويساره مأمومين)؟","a":"يصح، والسنة وقوفه متقدماً عليهم.","m":0,"ex":"وقوف الإمام وسط الصف صحيح لا يبطل الصلاة، لكنه خلاف السنة. فالسنة أن يتقدم الإمام عليهم.","w":["لا يصح، ويلزمه التقدم عليهم.","يصح، والسنة وقوفه وسطهم.","يصح مع الكراهة للمأمومين، ويعيدون الصلاة."],"s":"fiqh"},{"id":"s76","b":"الصلاة","q":"ما هي الأسباب التي يُعذر فيها بترك الجمعة والجماعة؟","a":"المريض، والخائف حدوث المرض، والمدافع أحد الأخبثين، ومن له ضائع يرجوه، أو يخاف ضياع ماله أو فواته أو ضرراً فيه، أو يخاف على مال استؤجر لحفظه، أو أذى بمطر ووحل وثلج وجليد وريح باردة بليلة مظلمة، أو تطويل إمام.","m":0,"ex":"كل الأعذار ترجع إلى الخوف من ضرر: على البدن (مرض، أو خوف مرض، أو مدافعة الأخبثين)، أو على المال (ضائع، أو خوف ضياع أو ضرر، أو مال مستأجر لحفظه)، أو من الأذى (مطر ووحل وريح باردة)، أو تطويل الإمام.","w":["المرض، وخوف حدوثه، ومدافعة الأخبثين، والسفر القصير، والحر المعتاد، وتطويل الإمام.","المرض، ومدافعة الأخبثين، وخوف ضياع المال، والأذى بالمطر، والانشغال بالتجارة.","المرض فقط، أو خوف ضياع المال."],"ca":"المرض، وخوف حدوثه، ومدافعة الأخبثين، وخوف ضياع المال، والأذى بالمطر والوحل، وتطويل الإمام.","s":"fiqh"},{"id":"s77","b":"الصلاة","q":"كيف يصلي المريض المكتوبة؟","a":"قائماً ولو مستنداً، فإن لم يستطع فقاعداً، فإن لم يستطع فعلى جنبه والأيمن أفضل، يومئ بالركوع والسجود ويجعل السجود أخفض.","m":0,"ex":"المريض ينتقل درجة درجة حسب قدرته: قائماً ولو معتمداً على شيء، ثم قاعداً، ثم على جنبه والأيمن أفضل. ويومئ بالركوع والسجود ويجعل السجود أخفض ليتميز عن الركوع.","w":["قاعداً، فإن لم يستطع فعلى جنبه والأيسر أفضل، ويجعل الركوع أخفض.","قائماً ولو مستنداً، فإن لم يستطع فعلى جنبه، فإن لم يستطع فقاعداً.","قائماً بلا استناد، فإن لم يستطع سقطت عنه الصلاة."],"s":"fiqh"},{"id":"s78","b":"الصلاة","q":"ما هي شروط قصر الصلاة الرباعية للمسافر؟","a":"لمن نوى سفراً مباحاً، لمحل معين، يبلغ ستة عشر فرسخاً (يومان قاصدان)، إذا فارق بيوت قريته العامرة.","m":0,"ex":"أربعة شروط: نية سفر مباح (لا معصية)، إلى مكان معين، مسافته ستة عشر فرسخاً وهي يومان قاصدان، ويبدأ القصر إذا خرج من بيوت قريته العامرة.","w":["لمن نوى سفراً ولو محرماً، لمحل معين، يبلغ ستة عشر فرسخاً، إذا فارق بيوت قريته.","لمن نوى سفراً مباحاً، لمحل معين، يبلغ أربعة فراسخ، إذا فارق بيوت قريته.","لمن نوى سفراً مباحاً، ولو لغير محل معين، يبلغ ستة عشر فرسخاً، إذا نوى السفر ولو لم يخرج."],"s":"fiqh"},{"id":"s79","b":"الصلاة","q":"متى يلزم المسافر أن يتم صلاته (ولا يقصر)؟","a":"إن دخل وقتها وهو في الحضر، أو صلى خلف من يتم، أو لم ينو القصر عند الإحرام، أو نوى إقامة مطلقة أو أكثر من أربعة أيام، أو أقام لحاجة وظن ألا تنقضي إلا بعد الأربعة، أو أخر الصلاة بلا عذر حتى ضاق وقتها عنها.","m":0,"ex":"يرجع إلى الإتمام إذا اختل سبب القصر: دخل الوقت وهو مقيم، أو صلى خلف من يتم، أو لم ينو القصر عند الإحرام، أو نوى إقامة أكثر من أربعة أيام أو إقامة مطلقة، أو أخر الصلاة بلا عذر حتى ضاق وقتها.","w":["إن دخل وقتها في السفر، أو صلى خلف من يقصر، أو لم ينو القصر عند الإحرام، أو نوى إقامة أكثر من أربعة أيام.","إن دخل وقتها في الحضر، أو صلى خلف من يتم، أو لم ينو القصر عند الإحرام، أو نوى إقامة يومين.","إن صلى منفرداً، أو صلى خلف من يتم، أو نوى القصر عند الإحرام، أو نوى إقامة أكثر من عشرة أيام."],"ca":"إن دخل وقتها في الحضر، أو صلى خلف من يتم، أو لم ينو القصر عند الإحرام، أو نوى إقامة أكثر من أربعة أيام.","s":"fiqh"},{"id":"s80","b":"الصلاة","q":"ما هي الصلوات التي يجوز الجمع بينها؟ ومن له حق الجمع؟","a":"الظهر مع العصر، والمغرب مع العشاء، بوقت إحداهما. ويباح: للمسافر سفر قصر، وللمقيم المريض يلحقه بتركه مشقة، وللمرضع لمشقة كثرة النجاسة، وللعاجز عن الطهارة لكل صلاة، ولعذر أو شغل يبيح ترك الجمعة والجماعة. ويختص بالعشاءين: الثلج والجليد والوحل والريح الشديدة الباردة والمطر الذي يبل الثياب.","m":0,"ex":"يُجمع بين الظهر والعصر، والمغرب والعشاء، في وقت إحداهما. وأسبابه مشقة: سفر قصر، أو مرض، أو إرضاع، أو عجز عن الطهارة، أو عذر الجماعة. وتختص العشاءان بأعذار الجو: مطر يبل الثياب، ثلج، جليد، وحل، ريح شديدة باردة.","w":["الظهر مع العصر، والعصر مع المغرب، والمغرب مع العشاء. يباح للمسافر، والمريض، ويختص الظهران بالمطر.","الظهر مع العصر، والمغرب مع العشاء. يباح للمسافر فقط، ويختص الظهران بالمطر ونحوه.","الظهر مع العصر، والمغرب مع العشاء. يباح للمسافر، والمريض، والمرضع، ويختص الظهران والعشاءان بالمطر."],"ca":"الظهر مع العصر، والمغرب مع العشاء. يباح للمسافر، والمريض، والمرضع، والعاجز عن الطهارة، ويختص العشاءان بالمطر ونحوه.","s":"fiqh"},{"id":"s81","b":"الصلاة","q":"متى تصح صلاة الخوف ومن يحق له صلاتها؟","a":"تصح إذا كان القتال مباحاً، حضراً وسفراً. وإذا اشتد الخوف صلوا رجالاً وركباناً، للقبلة وغيرها، يومئون طاقتهم؛ وكذا في الهرب من عدو أو سيل أو سبع أو نار أو غريم ظالم، أو خوف فوت الوقوف بعرفة، أو خاف على نفسه أو أهله أو ماله.","m":0,"ex":"شرطها أن يكون القتال مباحاً، في الحضر أو السفر. فإن اشتد الخوف صلّوا ماشين وراكبين بالإيماء ولو لغير القبلة. ويلحق بذلك كل هارب من خطر: عدو، سيل، سبع، نار، غريم ظالم، أو خائف على نفسه أو أهله أو ماله.","w":["تصح إذا كان القتال مباحاً، في السفر دون الحضر. وإذا اشتد الخوف أخّروا الصلاة حتى يأمنوا.","تصح في كل قتال ولو محرماً، حضراً وسفراً. وإذا اشتد الخوف صلوا رجالاً وركباناً للقبلة فقط.","تصح إذا كان القتال مباحاً، حضراً وسفراً. وإذا اشتد الخوف صلوا رجالاً وركباناً، ولا يلحق بهم الهارب من سيل أو سبع."],"ca":"تصح إذا كان القتال مباحاً، حضراً وسفراً. وإذا اشتد الخوف صلوا رجالاً وركباناً يومئون، وكذا الهارب من عدو أو سيل أو سبع.","s":"fiqh"},{"id":"s82","b":"الصلاة","q":"على من تجب صلاة الجمعة؟ ومن الذين تسقط عنهم؟","a":"تجب على كل ذكر، مسلم، مكلف، حر، لا عذر له. ولا تجب على من يباح له القصر، ولا على عبد، ومبعض، وامرأة.","m":0,"ex":"خمسة شروط وجوب: ذكر، مسلم، مكلف، حر، بلا عذر. ومن اختل فيه شرط سقطت عنه: المسافر سفر قصر، والعبد، والمبعّض، والمرأة.","w":["تجب على كل مسلم مكلف ذكراً كان أو أنثى، حر أو عبد. ولا تجب على المسافر.","تجب على كل ذكر، مسلم، مكلف، حر، لا عذر له. ولا تجب على من يباح له القصر فقط.","تجب على كل ذكر، مسلم، مميز، حر. ولا تجب على المريض والمرأة فقط."],"s":"fiqh"},{"id":"s83","b":"الصلاة","q":"ما معنى (المبعّض) المذكور فيمن لا تجب عليهم الجمعة؟","a":"من بعضه حر وبعضه رقيق.","m":0,"ex":"المبعّض من كان جزء منه حراً وجزء منه رقيقاً، فهو ليس حراً كاملاً ولا عبداً كاملاً. ولأن الحرية الكاملة شرط لوجوب الجمعة لم تجب عليه.","w":["من كان مقيماً بعض السنة ومسافراً بعضها.","من بلغ بعض سنه ولم يبلغ الحلم.","العبد الذي كاتبه سيده على مال."],"s":"fiqh"},{"id":"s84","b":"الصلاة","q":"ما هي شروط صحة صلاة الجمعة؟","a":"أربعة: الوقت، وأن تكون بقرية يستوطنها أربعون، وحضور أربعين، وتقدم خطبتين.","m":0,"ex":"أربعة شروط: الوقت، ومكان مستوطن (قرية يستوطنها أربعون)، وعدد (حضور أربعين)، وخطبتان قبلها. تذكّر: وقت، وطن، عدد، خطبة.","w":["أربعة: الوقت، وأن تكون في مسجد جامع، وحضور أربعين، وتقدم خطبتين.","أربعة: الوقت، وأن تكون بقرية يستوطنها أربعون، وحضور اثني عشر، وتقدم خطبتين.","أربعة: الوقت، وأن تكون بقرية يستوطنها أربعون، وحضور أربعين، وتقدم خطبة واحدة."],"s":"fiqh"},{"id":"s85","b":"الصلاة","q":"ما أركان خطبة الجمعة؟","a":"ستة: حمد الله، والصلاة على رسول الله ﷺ، وقراءة آية من كتاب الله، والوصية بتقوى الله، وموالاتهما مع الصلاة، والجهر بحيث يسمع العدد المعتبر.","m":0,"mn":"حمد، صلاة، آية، وصية، موالاة، جهر","ex":"ستة: أربعة أقوال (حمد الله، الصلاة على النبي ﷺ، آية، الوصية بالتقوى)، واثنان في الصفة (الموالاة بين الخطبتين والصلاة، والجهر بحيث يسمع الأربعون).","w":["ستة: حمد الله، والصلاة على النبي ﷺ، وقراءة آية، والوصية بالتقوى، والموالاة، والدعاء للمسلمين.","خمسة: حمد الله، والصلاة على النبي ﷺ، وقراءة آية، والوصية بالتقوى، والجلوس بين الخطبتين.","ستة: حمد الله، والشهادتان، وقراءة سورة، والوصية بالتقوى، والموالاة، والجهر."],"ca":"ستة: حمد الله، والصلاة على النبي ﷺ، وقراءة آية، والوصية بالتقوى، والموالاة، والجهر بحيث يسمع العدد المعتبر.","s":"fiqh"},{"id":"s86","b":"الصلاة","q":"كم أقل السنة بعد الجمعة وأكثرها؟","a":"أقلها ركعتان، وأكثرها ست.","m":0,"ex":"السنة بعد الجمعة لها حدّان: أقلها ركعتان وأكثرها ست. رقمان زوجيان: ٢ و ٦.","w":["أقلها ركعتان، وأكثرها أربع.","أقلها أربع، وأكثرها ست.","أقلها ركعتان، وأكثرها ثمان."],"s":"fiqh"},{"id":"s87","b":"الصلاة","q":"ما حكم صلاة العيدين ووقتها؟ وهل يجوز قضاؤها؟","a":"فرض كفاية، ووقتها كصلاة الضحى. وإن لم يعلم بالعيد إلا بعد الزوال صلوا من الغد قضاء، ويسن لمن فاتته قضاؤها ولو بعد الزوال.","m":0,"ex":"صلاة العيد فرض كفاية، ووقتها وقت الضحى من ارتفاع الشمس إلى الزوال. فإن لم يعلموا بالعيد إلا بعد الزوال صلّوها من الغد قضاء. ومن فاتته وحده يسن له قضاؤها ولو بعد الزوال.","w":["سنة مؤكدة، ووقتها كالضحى. وإن لم يعلم بالعيد إلا بعد الزوال فلا تقضى.","فرض عين، ووقتها بعد الزوال كالظهر. وإن فاتت لم تقض.","فرض كفاية، ووقتها كالضحى. وإن لم يعلم بالعيد إلا بعد الزوال صلوها بعد العصر أداء."],"ca":"فرض كفاية، ووقتها كالضحى. وإن لم يعلم بالعيد إلا بعد الزوال صلوا من الغد قضاء.","s":"fiqh"},{"id":"s88","b":"الصلاة","q":"كم يكبر زوائد في الركعة الأولى والثانية بصلاة العيد؟","a":"في الأولى بعد تكبيرة الإحرام وقبل التعوذ: ستاً، وفي الثانية قبل القراءة: خمساً، يرفع يديه مع كل تكبيرة","m":0,"ex":"في صلاة العيد تكبيرات زائدة قبل القراءة في كل ركعة. في الأولى ستّ بعد تكبيرة الإحرام وقبل الاستعاذة، وفي الثانية خمس قبل القراءة. احفظ: ستّ ثم خمس (تنقص واحدة)، ويرفع يديه مع كل تكبيرة.","w":["في الأولى بعد التعوذ وقبل القراءة: خمساً، وفي الثانية قبل القراءة: ستاً، يرفع يديه مع كل تكبيرة","في الأولى بعد تكبيرة الإحرام وقبل التعوذ: سبعاً، وفي الثانية بعد القراءة: خمساً، ولا يرفع يديه","في الأولى بعد تكبيرة الإحرام وقبل التعوذ: ستاً، وفي الثانية بعد القراءة: ستاً، يرفع يديه في الأولى فقط"],"s":"fiqh"},{"id":"s89","b":"الصلاة","q":"ما هو التكبير المطلق والمقيد؟","a":"المطلق (ويجهر به): في ليلتي العيدين إلى فراغ الخطبة، وفي كل عشر ذي الحجة. المقيد: في الأضحى عقب كل فريضة صلاها في جماعة، من صلاة فجر يوم عرفة إلى عصر آخر أيام التشريق، إلا المحرم فمن صلاة ظهر يوم النحر","m":0,"ex":"التكبير نوعان: مطلق في كل وقت، ومقيد بأدبار الصلوات. المطلق يُجهر به ليلتي العيدين حتى تنتهي الخطبة، وطوال عشر ذي الحجة. والمقيد خاص بالأضحى عقب الفرائض في جماعة: من فجر يوم عرفة إلى عصر آخر أيام التشريق، والمحرم يبدأ من ظهر يوم النحر.","w":["المطلق: ليلة الفطر فقط إلى خروج الإمام. المقيد: عقب كل صلاة ولو نافلة، من ظهر يوم النحر إلى عصر آخر التشريق","المطلق: ليلتي العيدين إلى فراغ الخطبة وكل عشر ذي الحجة. المقيد: عقب الفرائض جماعة، من فجر يوم النحر إلى مغرب آخر التشريق","المطلق: عقب الفرائض جماعة في عشر ذي الحجة. المقيد: ليلتي العيدين إلى فراغ الخطبة، ومن فجر عرفة إلى عصر يوم النحر"],"ca":"المطلق: ليلتي العيدين إلى فراغ الخطبة وكل عشر ذي الحجة. المقيد: عقب الفرائض جماعة، من فجر عرفة إلى عصر آخر التشريق","s":"fiqh"},{"id":"s90","b":"الصلاة","q":"ما حكم صلاة الكسوف ووقتها؟ وإذا انتهى الكسوف هل تقضى؟","a":"سنة، من غير خطبة، ولا تقضى إن فاتت","m":0,"ex":"صلاة الكسوف سنة، ووقتها من ابتداء الكسوف إلى ذهابه، وليس لها خطبة بخلاف العيد والاستسقاء. وهي مربوطة بسببها، فإذا انجلى الكسوف فات وقتها فلا تُقضى. احفظ: سنة، بلا خطبة، بلا قضاء.","w":["فرض كفاية، بخطبتين، وتقضى إن فاتت","سنة، بخطبة واحدة، وتقضى إن فاتت","واجبة، من غير خطبة، ولا تقضى إن فاتت"],"s":"fiqh","y":"لأن الكتاب جعلها سنة من غير خطبة ونص على أنها لا تقضى إن فاتت."},{"id":"s91","b":"الصلاة","q":"في صلاة الكسوف، من فاته الركوع فبأي الركوعين تدرك الركعة؟","a":"بالركوع الأول؛ وما بعد الأول سنة لا تدرك به الركعة","m":0,"ex":"في كل ركعة من الكسوف ركوعان أو أكثر. الركوع الأول هو الأصل الذي تُدرك به الركعة، وما بعده زيادة مسنونة. فمن لحق الإمام في الركوع الثاني فاتته تلك الركعة.","w":["بالركوع الثاني؛ وما قبله سنة لا تدرك به الركعة","بأيهما أدرك؛ فكلاهما ركن تدرك به الركعة","بالركوع الأخير؛ لأنه الذي يعقبه السجود"],"s":"fiqh","y":"لأن ما بعد الركوع الأول سنة لا تدرك به الركعة."},{"id":"s92","b":"الصلاة","q":"ما حكم صلاة الاستسقاء؟","a":"سنة، ووقتها وصفتها وأحكامها كصلاة العيد","m":0,"ex":"الاستسقاء صلاة لطلب المطر
